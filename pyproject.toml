[project]
name = "lingard-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Lingard monorepo workspace root (not a distributable package)"
dependencies = [
    "lingard-contracts",
    "lingard-llm",
    "agent-memory[postgres]",
    "lingard-curriculum",
    "lingard-exam-packs",
    "lingard-economy",
    "lingard-api",
    "lingard-live",
    "lingard-graphs",
    "lingard-pronunciation",
    "lingard-telemetry",
    "lingard-world",
    "lingard-storage",
    "lingard-db",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
lingard-contracts = { workspace = true }
lingard-llm = { workspace = true }
agent-memory = { workspace = true }
lingard-curriculum = { workspace = true }
lingard-exam-packs = { workspace = true }
lingard-economy = { workspace = true }
lingard-api = { workspace = true }
lingard-live = { workspace = true }
lingard-graphs = { workspace = true }
lingard-pronunciation = { workspace = true }
lingard-telemetry = { workspace = true }
lingard-world = { workspace = true }
lingard-storage = { workspace = true }
lingard-db = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "services", "evals", "tools"]
markers = [
    "integration: needs docker services (postgres, redis, livekit)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["lingard_*", "agent_memory", "voicebench", "evals"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["livekit.*", "fsrs.*", "langfuse.*", "argon2.*", "numpy.*", "scipy.*", "opentelemetry.exporter.*", "langchain_openai.*", "boto3.*", "botocore.*", "torch.*", "transformers.*", "av.*"]
ignore_missing_imports = true
