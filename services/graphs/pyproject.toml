[project]
name = "lingard-graphs"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "fsrs>=5.0",
    "redis>=5.2",
    "lingard-contracts",
    "lingard-llm",
    "lingard-curriculum",
    "lingard-economy",
    "lingard-exam-packs",
    "agent-memory",
    "lingard-db",
    "lingard-world",
    "lingard-telemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingard_graphs"]
