[project]
name = "lingard-live"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "numpy>=2.1",
    "redis>=5.2",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "lingard-contracts",
    "lingard-llm",
    "lingard-world",
    "lingard-telemetry",
    "pyyaml>=6",
    "wordfreq>=3.1",
    "websockets>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingard_live"]
