[project]
name = "lingard-pronunciation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "lingard-contracts",
    "pyyaml>=6",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingard_pronunciation"]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.46"]
