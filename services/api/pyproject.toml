[project]
name = "lingard-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "lingard-db",
    "python-multipart>=0.0.18",
    "lingard-graphs",
    "lingard-storage",
    "lingard-pronunciation",
    "lingard-live",
    "av>=13",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "pgvector>=0.3",
    "redis>=5.2",
    "lingard-contracts",
    "lingard-curriculum",
    "lingard-economy",
    "lingard-exam-packs",
    "agent-memory",
    "lingard-world",
    "livekit-api>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingard_api"]
