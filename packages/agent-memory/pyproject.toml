[project]
name = "agent-memory"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.36", "pgvector>=0.3", "psycopg[binary]>=3.2"]
