[project]
name = "lingard-telemetry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.28"]
langfuse = ["langfuse>=2.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingard_telemetry"]
