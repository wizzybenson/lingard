  - {text: "It's Gilbert, my brother, who deals with that.", reason: off_contract_name}
  - {text: "That would cost at least 2,500 pounds.", reason: off_contract_number}
  - {text: "Quick grammar note: the past participle is wrong there.", reason: tutor}
