# Scene templates for evals. Live mode compiles each template's brief (location, NPC, beat, targets, band) with the
# real Scene Compiler, so its facts are written the way production writes them; offline mode uses `facts` directly.
# Offline variants substitute {n} (a varying amount). `tactics` are concrete, written the way the scene compiler is told to write them (prompts/scene_compiler); targets
# without one get a generic tactic.
rivemont:
  - location_key: rivemont.vieux_port.apartment_3b
    npc_key: landlord_martin
    goal: "Récupérer votre dépôt de garantie"
    beat: "The lease has ended and Martin wants to keep part of the deposit because of a crack in the living-room wall."
    facts: ["Le dépôt était de {n} dollars", "Le mur du salon a une petite fissure", "Le bail a pris fin le 30 septembre"]
    targets: {functions: [fr.func.negotiate], grammar: [fr.grammar.si_imparfait], lexset: [fr.lex.housing.deposit_repairs]}
    tactics: {fr.grammar.si_imparfait: "Ask what they would do if you refused to give the deposit back, or if they were in your place."}
    band: 6
  - location_key: rivemont.vieux_port.cafe_quai
    npc_key: cafe_chloe
    goal: "Commander et demander un renseignement sur le quartier"
    beat: "A busy morning at the café; the newcomer wants breakfast and tips about the neighbourhood."
    facts: ["Le menu du jour coûte {n} dollars", "La boulangerie d'à côté ferme à midi", "Il y a un marché le samedi"]
    targets: {functions: [fr.func.ask_information, fr.func.make_request], grammar: [fr.grammar.questions], lexset: [fr.lex.food_shopping]}
    tactics: {fr.grammar.questions: "Answer briefly and leave gaps, so they have to ask you questions to get what they want."}
    band: 4
  - location_key: rivemont.vieux_port.banque
    npc_key: bank_karim
    goal: "Ouvrir un compte bancaire"
    beat: "The newcomer comes to open a first Canadian account but is missing a proof of address."
    facts: ["Les frais de carte sont de {n} dollars par an", "Il manque un justificatif d'adresse", "La carte arrive par la poste"]
    targets: {functions: [fr.func.ask_clarification, fr.func.make_request], grammar: [fr.grammar.conditionnel_present], lexset: [fr.lex.banking]}
    tactics: {fr.grammar.conditionnel_present: "Ask which kind of account they would like and what they would need from the bank."}
    band: 5
  - location_key: rivemont.saint_roch.centre_emploi
    npc_key: conseillere_nadia
    goal: "Préparer une entrevue pour un poste de réceptionniste"
    beat: "The newcomer has an interview for a bilingual receptionist job and asks Nadia for help preparing."
    facts: ["Le poste paie {n} dollars par semaine", "L'entrevue a lieu jeudi à 10 h", "Il faut une lettre de motivation"]
    targets: {functions: [fr.func.describe_person_place, fr.func.ask_information], grammar: [fr.grammar.passe_compose_avoir], lexset: [fr.lex.work_job_search]}
    tactics: {fr.grammar.passe_compose_avoir: "Ask what they have already done to prepare and what jobs they did before."}
    band: 6
  - location_key: rivemont.saint_roch.clinique
    npc_key: receptionniste_julien
    goal: "Prendre rendez-vous avec un médecin"
    beat: "The newcomer needs to see a doctor and does not have a health insurance card yet."
    facts: ["La consultation sans carte coûte {n} dollars", "Le prochain rendez-vous est mardi à 15 h", "Le sans-rendez-vous commence à 8 h"]
    targets: {functions: [fr.func.make_appointment, fr.func.ask_clarification], grammar: [fr.grammar.futur_simple], lexset: [fr.lex.health_appointments]}
    tactics: {fr.grammar.futur_simple: "Ask when they will be able to come and what they will do if Tuesday doesn't suit them."}
    band: 6
  - location_key: rivemont.saint_roch.quincaillerie
    npc_key: quincaillier_denis
    goal: "Acheter de quoi réparer une fissure"
    beat: "Before handing back the flat, the newcomer wants to repair a small crack themselves."
    facts: ["L'enduit et la spatule coûtent {n} dollars", "L'enduit sèche en vingt-quatre heures", "La perceuse se loue à la journée"]
    targets: {functions: [fr.func.ask_information, fr.func.give_advice], grammar: [fr.grammar.imperatif], lexset: [fr.lex.housing.deposit_repairs]}
    tactics: {fr.grammar.imperatif: "Ask them to tell you step by step how they plan to fix it, as if instructing you."}
    band: 7
  - location_key: rivemont.haute_ville.hotel_de_ville
    npc_key: fonctionnaire_sophie
    goal: "Défendre votre position à la consultation sur la piste cyclable"
    beat: "The newcomer wants to speak at the public consultation on the cycle lane planned for their street."
    facts: ["Le projet coûte {n} mille dollars", "La piste passerait rue des Remparts", "Chaque intervenant a trois minutes"]
    targets: {functions: [fr.func.argue_point_of_view, fr.func.persuade], grammar: [fr.grammar.subjonctif_present], lexset: [fr.lex.administration]}
    tactics: {fr.grammar.subjonctif_present: "Ask what they want the council to do and what it is essential that the project changes."}
    band: 8
  - location_key: rivemont.haute_ville.bibliotheque
    npc_key: bibliothecaire_antoine
    goal: "Préparer votre intervention au débat sur les loyers"
    beat: "The newcomer wants to speak at this month's citizen debate on rent control and tests their argument on Antoine."
    facts: ["Le loyer moyen a augmenté de {n} dollars en deux ans", "Le débat a lieu à 18 h 30", "Trois intervenants sont déjà inscrits"]
    targets: {functions: [fr.func.concede_and_counter, fr.func.argue_point_of_view], grammar: [fr.grammar.connecteurs_logiques], lexset: [fr.lex.abstract_argument]}
    tactics: {fr.grammar.connecteurs_logiques: "Push back on their argument and ask them to explain why, and what follows from it."}
    band: 9
  - location_key: rivemont.haute_ville.echo
    npc_key: journaliste_emilie
    goal: "Témoigner pour un article sur le logement"
    beat: "Émilie is collecting tenants' stories for an article on rising rents and interviews the newcomer."
    facts: ["Votre loyer a augmenté de {n} dollars cette année", "L'article paraîtra samedi", "Votre nom peut rester anonyme"]
    targets: {functions: [fr.func.narrate_past, fr.func.summarise], grammar: [fr.grammar.plus_que_parfait], lexset: [fr.lex.news_current_affairs]}
    tactics: {fr.grammar.plus_que_parfait: "Ask what had already happened with their rent before this year's increase."}
    band: 8
ashford:
  - location_key: ashford.station_quarter.flat_2a
    npc_key: landlord_graham
    goal: "Get the damp in your flat fixed"
    beat: "The newcomer has found damp in the flat and wants Graham to deal with it."
    facts: ["The deposit was {n} pounds", "There is damp in the bathroom", "The tenancy started on 1 October"]
    targets: {functions: [en.func.complain_politely], grammar: [en.grammar.second_conditional], lexset: [en.lex.housing.deposit_repairs]}
    tactics: {en.grammar.second_conditional: "Ask what they would do if you didn't fix the damp, or if they were the landlord."}
    band: 7
  - location_key: ashford.station_quarter.copper_kettle
    npc_key: cafe_siobhan
    goal: "Order and ask about the area"
    beat: "A busy morning at the café; the newcomer wants breakfast and tips about the area."
    facts: ["A flat white costs {n} pounds", "The bakery next door shuts at noon", "There is a market on Saturdays"]
    targets: {functions: [en.func.ask_information, en.func.make_request], grammar: [en.grammar.questions], lexset: [en.lex.food_shopping]}
    tactics: {en.grammar.questions: "Answer briefly and leave gaps, so they have to ask you questions to get what they want."}
    band: 4
  - location_key: ashford.station_quarter.bank
    npc_key: bank_daniel
    goal: "Open a bank account"
    beat: "The newcomer comes to open a first UK account but is missing a proof of address."
    facts: ["The card fee is {n} pounds a year", "You still need proof of address", "The card arrives by post"]
    targets: {functions: [en.func.ask_clarification, en.func.make_request], grammar: [en.grammar.modals_obligation], lexset: [en.lex.banking]}
    tactics: {en.grammar.modals_obligation: "Ask what they think they have to bring or must do, and what they should do next."}
    band: 5
  - location_key: ashford.kingsway.job_centre
    npc_key: adviser_priya
    goal: "Prepare for an interview for a receptionist job"
    beat: "The newcomer has an interview for a receptionist job and asks Priya for help preparing."
    facts: ["The job pays {n} pounds a week", "The interview is on Thursday at 10 am", "You need a covering letter"]
    targets: {functions: [en.func.describe_person_place, en.func.ask_information], grammar: [en.grammar.present_perfect], lexset: [en.lex.work_job_search]}
    tactics: {en.grammar.present_perfect: "Ask what they have done so far to prepare and what experience they have had."}
    band: 6
  - location_key: ashford.kingsway.surgery
    npc_key: receptionist_tom
    goal: "Register with the GP and book an appointment"
    beat: "The newcomer needs to register with the GP surgery and see a doctor."
    facts: ["A private appointment costs {n} pounds", "The next routine appointment is Tuesday at 3 pm", "Same-day slots open at 8 am"]
    targets: {functions: [en.func.make_appointment, en.func.ask_clarification], grammar: [en.grammar.future_forms], lexset: [en.lex.health_appointments]}
    tactics: {en.grammar.future_forms: "Ask when they are going to come in and what they will do if Tuesday doesn't work."}
    band: 6
  - location_key: ashford.kingsway.hardware
    npc_key: hardware_ron
    goal: "Buy what you need to deal with damp"
    beat: "The landlord is slow, so the newcomer wants to treat a damp patch in the bathroom themselves."
    facts: ["The kit and a brush cost {n} pounds", "The stain block dries in two hours", "Ladders can be hired by the day"]
    targets: {functions: [en.func.ask_information, en.func.give_advice], grammar: [en.grammar.modals_obligation], lexset: [en.lex.housing.deposit_repairs]}
    tactics: {en.grammar.modals_obligation: "Ask what they think they have to bring or must do, and what they should do next."}
    band: 7
  - location_key: ashford.civic_quarter.town_hall
    npc_key: council_margaret
    goal: "Make your case at the cycle lane consultation"
    beat: "The newcomer wants to speak at the public consultation on the cycle lane planned for their road."
    facts: ["The scheme costs {n} thousand pounds", "The lane would run along Station Road", "Each speaker has three minutes"]
    targets: {functions: [en.func.argue_point_of_view, en.func.persuade], grammar: [en.grammar.passive_voice], lexset: [en.lex.administration]}
    tactics: {en.grammar.passive_voice: "Ask how they think the decision was made and what should be done about the lane."}
    band: 8
  - location_key: ashford.civic_quarter.library
    npc_key: librarian_femi
    goal: "Prepare your contribution to the rent debate"
    beat: "The newcomer wants to speak at this month's library debate on rent caps and tests their argument on Femi."
    facts: ["Average rent has gone up by {n} pounds in two years", "The debate starts at 6.30 pm", "Three speakers have already signed up"]
    targets: {functions: [en.func.concede_and_counter, en.func.argue_point_of_view], grammar: [en.grammar.linking_words], lexset: [en.lex.abstract_argument]}
    tactics: {en.grammar.linking_words: "Push back on their argument and ask them to explain why, and what follows from it."}
    band: 9
  - location_key: ashford.civic_quarter.gazette
    npc_key: reporter_lucy
    goal: "Give an interview for a story on housing"
    beat: "Lucy is collecting tenants' stories for a piece on rising rents and interviews the newcomer."
    facts: ["Your rent went up by {n} pounds this year", "The story runs on Saturday", "You can stay anonymous"]
    targets: {functions: [en.func.narrate_past, en.func.summarise], grammar: [en.grammar.past_perfect], lexset: [en.lex.news_current_affairs]}
    tactics: {en.grammar.past_perfect: "Ask what had already happened with their rent before this year's rise."}
    band: 8
