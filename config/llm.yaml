# Model catalog and tier defaults. SPEC §10: tiers are config keys, never hard-coded model IDs in call sites.
#
# Each tier lists catalog models in preference order. A model is used only when its provider's key is set
# (ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_API_KEY), so any one key is enough; the first configured one wins.
# Override any tier from the environment without editing this file (see .env.example):
#   LLM_FAST_MODELS=claude-haiku-5-5,claude-sonnet-5-5     LLM_FAST_EFFORT=low     LLM_GUARD_THINKING=false
# Every name must be in the catalog below, so cost reporting always has a price for it.
#
# Prices: first-party API rates, USD per million tokens.
# gemini-3.8-flash: promotional price until 2026-12-31, then 1.50 / 7.50 / 0.15.
# claude-opus-5-5 and gpt-6-astra stay in the catalog but in no tier: too expensive (decision 0009).
catalog:
  claude-haiku-5-5:
    provider: anthropic
    price: {input: 0.10, output: 0.50, cache_read: 0.01, source_url: "https://platform.claude.com/docs/en/about-claude/pricing", as_of: "2026-10-14"}
  claude-sonnet-5-5:
    provider: anthropic
    price: {input: 2.00, output: 10.00, cache_read: 0.10, source_url: "https://platform.claude.com/docs/en/about-claude/pricing", as_of: "2026-10-14"}
  claude-opus-5-5:
    provider: anthropic
    price: {input: 4.00, output: 20.00, cache_read: 0.20, source_url: "https://platform.claude.com/docs/en/about-claude/pricing", as_of: "2026-10-14"}
  gpt-6-luna:
    provider: openai
    price: {input: 0.1, output: 0.5, cache_read: 0.01, source_url: "https://developers.openai.com/api/docs/pricing", as_of: "2026-10-14"}
  gpt-6.1-sol:
    provider: openai
    price: {input: 2.0, output: 10.0, cache_read: 0.1, source_url: "https://developers.openai.com/api/docs/pricing", as_of: "2026-10-14"}
  gpt-6-astra:
    provider: openai
    price: {input: 10.0, output: 50.0, cache_read: 1.0, source_url: "https://developers.openai.com/api/docs/pricing", as_of: "2026-10-14"}
  gemini-3.1-flash-lite:
    provider: google
    price: {input: 0.25, output: 1.5, cache_read: 0.025, source_url: "https://ai.google.dev/gemini-api/docs/pricing", as_of: "2026-10-14"}
  gemini-3.8-flash:
    provider: google
    price: {input: 0.75, output: 3.75, cache_read: 0.075, source_url: "https://ai.google.dev/gemini-api/docs/pricing", as_of: "2026-10-14"}
  gemini-3.1-pro-preview:
    provider: google
    price: {input: 2.0, output: 12.0, cache_read: 0.2, source_url: "https://ai.google.dev/gemini-api/docs/pricing", as_of: "2026-10-14"}

tiers:
  fast:                   # NPC actor, live plane
    models: [claude-haiku-5-5, claude-sonnet-5-5, gemini-3.1-flash-lite]
    effort: low           # Google models ignore effort
    max_tokens: 1024
    timeout_s: 8
    retries: 0            # a retry costs more latency than a fallback
  guard:                  # Contract Guard claim check: one short answer per NPC sentence, live plane (decision 0012)
    models: [claude-haiku-5-5, gemini-3.1-flash-lite]
    effort: low
    thinking: false        # with thinking on, Haiku spent the budget reasoning and often returned no answer
    max_tokens: 200
    timeout_s: 5           # the claim checker's own deadline (CLAIM_CHECK_DEADLINE_S) is what binds
    retries: 0
  mid:                    # assessment, planning, lessons
    models: [claude-sonnet-5-5, gpt-6.1-sol, gemini-3.8-flash]
    effort: medium
    max_tokens: 8192
    timeout_s: 60
    retries: 1
  compile:                # Scene Compiler: the learner waits for it when starting a day, so less effort than frontier
    models: [gpt-6.1-sol, claude-sonnet-5-5, gemini-3.1-pro-preview]
    effort: medium
    max_tokens: 16000
    timeout_s: 120
    retries: 1
  frontier:               # examiners, judges, golden review
    models: [gpt-6.1-sol, claude-sonnet-5-5, gemini-3.1-pro-preview]
    effort: high
    max_tokens: 16000
    timeout_s: 180
    retries: 1
