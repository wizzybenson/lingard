# Tier → ordered models (primary first, fallbacks after). SPEC §10: tiers are config keys, not hard-coded IDs.
# Prices: Anthropic first-party API rates, USD per million tokens.
tiers:
  fast:
    retries: 0            # live plane: a retry costs more latency than a fallback
    models:
      - provider: anthropic
        model: claude-haiku-5-5
        max_tokens: 1024
        effort: low
        timeout_s: 8
        price: {input: 0.10, output: 0.50, cache_read: 0.01, source_url: "https://docs.anthropic.com/en/docs/about-claude/models", as_of: "2026-10-06"}
      - provider: anthropic
        model: claude-sonnet-5-5
        max_tokens: 1024
        effort: low
        timeout_s: 8
        price: {input: 2.00, output: 10.00, cache_read: 0.20, source_url: "https://docs.anthropic.com/en/docs/about-claude/models", as_of: "2026-10-06"}
  mid:
    retries: 1
    models:
      - provider: anthropic
        model: claude-sonnet-5-5
        max_tokens: 8192
        effort: medium
        timeout_s: 60
        price: {input: 2.00, output: 10.00, cache_read: 0.20, source_url: "https://docs.anthropic.com/en/docs/about-claude/models", as_of: "2026-10-06"}
      - provider: anthropic
        model: claude-opus-5-5
        max_tokens: 8192
        effort: low
        timeout_s: 60
        price: {input: 4.00, output: 20.00, cache_read: 0.20, source_url: "https://docs.anthropic.com/en/docs/about-claude/models", as_of: "2026-10-06"}
  frontier:
    retries: 1
    models:
      - provider: anthropic
        model: claude-opus-5-5
        max_tokens: 16000
        effort: high
        timeout_s: 180
        price: {input: 4.00, output: 20.00, cache_read: 0.20, source_url: "https://docs.anthropic.com/en/docs/about-claude/models", as_of: "2026-10-06"}
      - provider: anthropic
        model: claude-sonnet-5-5
        max_tokens: 16000
        effort: high
        timeout_s: 180
        price: {input: 2.00, output: 10.00, cache_read: 0.20, source_url: "https://docs.anthropic.com/en/docs/about-claude/models", as_of: "2026-10-06"}
