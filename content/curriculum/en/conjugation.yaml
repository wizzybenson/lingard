# English irregular verbs (principal parts) for conjugation games and the past-tense error checks.
source_url: https://www.canada.ca/content/dam/ircc/migration/ircc/english/pdf/pub/language-benchmarks.pdf
as_of: "2012"
engine: english
# The conjugation duel of a grammar point: the principal parts it drills (irregular verbs), by the longest of these
# found in its key.
drills:
  past_simple: [past]
  present_perfect: [participle]
  present_perfect_or_past_simple: [past, participle]
  past_perfect: [participle]
  past_modals: [participle]
form_labels: {past: past simple, participle: past participle}
# The verb tables a learner opens by tapping a verb in a lesson: these tenses, easiest first.
persons: [I, you, he/she/it, we, they]
tenses: [present_simple, past_simple, present_perfect, past_perfect]
tense_labels: {present_simple: present simple, past_simple: past simple, present_perfect: present perfect, past_perfect: past perfect}
tense_bands: {present_simple: 4, past_simple: 4, present_perfect: 5, past_perfect: 7}
# The tenses a grammar point's tables open on, by the longest of these found in its key.
focus:
  present_simple: [present_simple]
  subject_verb_agreement: [present_simple]
  adverbs_of_frequency: [present_simple]
  past_simple: [past_simple]
  present_perfect: [present_perfect]
  present_perfect_or_past_simple: [present_perfect, past_simple]
  present_perfect_continuous: [present_perfect]
  past_perfect: [past_perfect]
  third_conditional: [past_perfect]
  second_conditional: [past_simple]
  reported_speech: [past_simple, past_perfect]
# Forms that are far more often another word in a sentence (left = not right) stay plain text.
not_tappable: [left, saw, found, felt, lay, lie, rose, will]
# Regular verbs: -ed in the past (a spelling given where it isn't simply -ed, -d or -ied).
regular:
  work: ~
  live: ~
  want: ~
  need: ~
  ask: ~
  call: ~
  help: ~
  like: ~
  love: ~
  start: ~
  finish: ~
  open: ~
  close: ~
  arrive: ~
  move: ~
  rent: ~
  book: ~
  order: ~
  study: ~
  try: ~
  carry: ~
  stop: stopped
  plan: planned
  travel: travelled
  cook: ~
  clean: ~
  watch: ~
  listen: ~
  answer: ~
  apply: ~
  visit: ~
  wait: ~
  change: ~
  use: ~
  explain: ~
  complain: ~
verbs:
  be: {base: be, past: was/were, participle: been, present: [am, are, is, are, are]}
  have: {base: have, past: had, participle: had, third_person: has}
  go: {base: go, past: went, participle: gone}
  do: {base: do, past: did, participle: done}
  make: {base: make, past: made, participle: made}
  take: {base: take, past: took, participle: taken}
  get: {base: get, past: got, participle: got}
  give: {base: give, past: gave, participle: given}
  come: {base: come, past: came, participle: come}
  see: {base: see, past: saw, participle: seen}
  buy: {base: buy, past: bought, participle: bought}
  pay: {base: pay, past: paid, participle: paid}
  leave: {base: leave, past: left, participle: left}
  find: {base: find, past: found, participle: found}
  tell: {base: tell, past: told, participle: told}
  write: {base: write, past: wrote, participle: written}
  speak: {base: speak, past: spoke, participle: spoken}
  break: {base: break, past: broke, participle: broken}
  choose: {base: choose, past: chose, participle: chosen}
  know: {base: know, past: knew, participle: known}
  bring: {base: bring, past: brought, participle: brought}
  think: {base: think, past: thought, participle: thought}
  send: {base: send, past: sent, participle: sent}
  spend: {base: spend, past: spent, participle: spent}
  lose: {base: lose, past: lost, participle: lost}
  forget: {base: forget, past: forgot, participle: forgotten}
