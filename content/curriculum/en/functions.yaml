defaults:
  kind: function
  language: en
  skill: speaking
  source_url: https://www.canada.ca/content/dam/ircc/migration/ircc/english/pdf/pub/language-benchmarks.pdf
  as_of: "2012"
nodes:
  - key: en.func.greet_introduce
    band: 4
    title: "Greet and introduce yourself"
    payload:
      exponents: ["Hi, I'm…", "Nice to meet you.", "I've just moved to Ashford."]
      lesson:
        rule: "Hello or hi + your name, then one detail about yourself; nice to meet you on first meeting."
        examples: ["Hi, I'm Sam. I've just moved to Ashford.", "Nice to meet you. I'm your new neighbour.", "I'm from Morocco and I work at the station."]
        common_errors:
          - {wrong: "Hello, my name is Sam and I am Sam.", right: "Hello, I'm Sam."}
          - {wrong: "I from Morocco.", right: "I'm from Morocco."}
  - key: en.func.ask_information
    band: 4
    title: "Ask for information"
    payload:
      places: [town_hall, library, job_centre]
      exponents: ["Excuse me, could you tell me…?", "Do you know where…?", "What time does… open?"]
      lesson:
        rule: "Start with excuse me; use indirect questions to be polite: do you know where…?, could you tell me when…?"
        examples: ["Excuse me, where's the town hall?", "Could you tell me what time the office opens?", "Do you know if the pool is open today?"]
        common_errors:
          - {wrong: "Do you know where is the town hall?", right: "Do you know where the town hall is?"}
          - {wrong: "Could you tell me when does it open?", right: "Could you tell me when it opens?"}
    requires: ["en.grammar.questions"]
  - key: en.func.make_request
    band: 4
    title: "Make polite requests"
    payload:
      places: [bank, cafe, shop, town_hall]
      exponents: ["Could I…?", "Would you mind…ing?", "I was wondering if…"]
      lesson:
        rule: "Ask politely with could I…?, would you mind…?, I'd like…; “I'd like” is usually more polite than “I want” when making a request."
        examples: ["I'd like an appointment, please.", "Could I pay by card?", "Would you mind sending me the form?"]
        common_errors:
          - {wrong: "Could I to pay by card?", right: "Could I pay by card?"}
          - {wrong: "Would you mind to send me the form?", right: "Would you mind sending me the form?"}
  - key: en.func.ask_clarification
    band: 4
    title: "Ask for repetition or clarification"
    payload:
      places: [clinic, bank]
      exponents: ["Sorry, could you say that again?", "What do you mean by…?", "Could you speak a bit more slowly?"]
      lesson:
        rule: "Say at once when you don't understand: sorry?, could you say that again?, what do you mean by…?"
        examples: ["Sorry, could you say that again more slowly?", "What do you mean by 'bills included'?", "Sorry, I didn't catch the last word."]
        common_errors:
          - {wrong: "Sorry, can you repeat more slow?", right: "Sorry, can you repeat that more slowly?"}
          - {wrong: "I don't understand what do you say.", right: "I don't understand what you're saying."}
  - key: en.func.make_appointment
    band: 4
    title: "Make or change an appointment"
    payload:
      places: [clinic, job_centre]
      exponents: ["I'd like to book an appointment for…", "Would Tuesday suit you?", "I need to cancel my appointment."]
      lesson:
        rule: "I'd like to make an appointment; is Tuesday at ten OK?; to change it: I need to rearrange my appointment."
        examples: ["I'd like to make an appointment with Dr Shah.", "Would Thursday at two be convenient?", "I need to rearrange my appointment on Monday."]
        common_errors:
          - {wrong: "I want to take an appointment.", right: "I'd like to make an appointment."}
          - {wrong: "Can I move my appointment at Tuesday?", right: "Can I move my appointment to Tuesday?"}
  - key: en.func.express_preference
    band: 4
    title: "Express preferences"
    payload:
      exponents: ["I'd rather…", "I prefer… to…", "I don't mind."]
      lesson:
        rule: "I prefer X to Y; I'd rather + verb; what I like most is…"
        examples: ["I prefer the train to the bus.", "I'd rather live near my work.", "What I like most is how quiet it is."]
        common_errors:
          - {wrong: "I prefer the train than the bus.", right: "I prefer the train to the bus."}
          - {wrong: "I'd rather to walk.", right: "I'd rather walk."}
  - key: en.func.describe_person_place
    band: 5
    title: "Describe people and places"
    payload:
      places: [newspaper]
      exponents: ["It's a lively area where…", "She seems…", "It's next to…"]
      lesson:
        rule: "Describe with it's a… area, there's/there are…, she's very…; give two or three concrete details."
        examples: ["It's a quiet area with lots of trees.", "There's a bakery on the corner.", "My neighbour is very kind and always smiling."]
        common_errors:
          - {wrong: "There is many trees in my area.", right: "There are many trees in my area."}
          - {wrong: "She is a very kindness person.", right: "She is a very kind person."}
    requires: ["en.grammar.relative_clauses"]
  - key: en.func.narrate_past
    band: 5
    title: "Narrate past events"
    payload:
      exponents: ["First…, then…, in the end…", "While I was…", "That day…"]
      lesson:
        rule: "Tell a story with first, then, after that, in the end; past simple for events, past continuous for the background."
        examples: ["First, I went to the bank, then I saw the flat.", "It was raining when I arrived.", "In the end, I signed the contract."]
        common_errors:
          - {wrong: "Yesterday I go to the bank.", right: "Yesterday I went to the bank."}
          - {wrong: "When I arrived, it were raining.", right: "When I arrived, it was raining."}
    requires: ["en.grammar.past_simple", "en.grammar.past_continuous"]
  - key: en.func.apologise
    band: 5
    title: "Apologise and respond to apologies"
    payload:
      places: [home]
      exponents: ["I'm really sorry about…", "I apologise for…", "Don't worry about it."]
      lesson:
        rule: "I'm sorry for + -ing / I'm sorry I…; reply with no problem, don't worry."
        examples: ["I'm sorry I'm late.", "Sorry about the noise last night.", "Don't worry, it happens."]
        common_errors:
          - {wrong: "I'm sorry for to be late.", right: "I'm sorry for being late."}
          - {wrong: "Sorry, is not my fault, is the bus.", right: "Sorry, the bus was late."}
  - key: en.func.complain_politely
    band: 6
    title: "Complain politely"
    payload:
      places: [home, shop]
      exponents: ["I'm afraid there's a problem with…", "I'm not happy with…", "I'd like this to be sorted out."]
      lesson:
        rule: "Complain politely: describe the problem, its effect, then ask for action with could you…?"
        examples: ["I'm writing to let you know about a problem with the heating.", "For a week the flat has been very cold.", "Could you send someone to fix it as soon as possible?"]
        common_errors:
          - {wrong: "The heating is rubbish, fix it!", right: "The heating isn't working. Could you get it fixed?"}
          - {wrong: "I want that you repair it.", right: "I'd like you to repair it."}
  - key: en.func.give_advice
    band: 6
    title: "Give advice"
    payload:
      exponents: ["If I were you, I'd…", "You should…", "Why don't you…?"]
      lesson:
        rule: "You should + verb; if I were you, I'd…; it might be a good idea to…"
        examples: ["You should keep a copy of the contract.", "If I were you, I'd ask for a receipt.", "It might be a good idea to arrive early."]
        common_errors:
          - {wrong: "You should to keep a copy.", right: "You should keep a copy."}
          - {wrong: "If I am you, I ask for a receipt.", right: "If I were you, I'd ask for a receipt."}
    requires: ["en.grammar.modals_obligation"]
  - key: en.func.express_opinion
    band: 6
    title: "Give opinions"
    payload:
      places: [newspaper]
      exponents: ["In my view,…", "I reckon…", "As far as I'm concerned,…"]
      lesson:
        rule: "I think, in my opinion, personally; give a reason with because or since."
        examples: ["In my opinion, the rent is too high.", "I think the area is safe because it's well lit.", "Personally, I think it's a good decision."]
        common_errors:
          - {wrong: "According to me, it's expensive.", right: "In my opinion, it's expensive."}
          - {wrong: "I am agree with this idea.", right: "I agree with this idea."}
  - key: en.func.agree_disagree
    band: 6
    title: "Agree and disagree"
    payload:
      exponents: ["I couldn't agree more.", "I see your point, but…", "I'm not so sure about that."]
      lesson:
        rule: "I agree; I'm not sure I agree; you're right, but…; soften disagreement."
        examples: ["I completely agree with you.", "You're right, but there's one problem.", "I'm not sure that's the best solution."]
        common_errors:
          - {wrong: "I am agree.", right: "I agree."}
          - {wrong: "You're right, but there's one problems.", right: "You're right, but there's one problem."}
  - key: en.func.compare_options
    band: 6
    title: "Compare options"
    payload:
      exponents: ["The advantage of… is that…", "Compared to…", "On the one hand…, on the other…"]
      lesson:
        rule: "Compare with -er/more… than, as… as, whereas, on the other hand; finish with a reasoned choice."
        examples: ["The first flat is bigger, but the second one is cheaper.", "The bus is as fast as the train.", "On the other hand, the train is more reliable in winter."]
        common_errors:
          - {wrong: "It is more cheaper than the other.", right: "It is cheaper than the other."}
          - {wrong: "The bus is as fast than the train.", right: "The bus is as fast as the train."}
    requires: ["en.grammar.comparatives"]
  - key: en.func.negotiate
    band: 7
    title: "Negotiate"
    payload:
      places: [home, shop]
      exponents: ["How about we meet halfway?", "I could accept that if…", "What if I…?"]
      lesson:
        rule: "Negotiate: propose, counter-propose, look for a compromise with would and could."
        examples: ["Would you accept £800 a month?", "I could sign for two years if the rent came down.", "How about we split the cost?"]
        common_errors:
          - {wrong: "I give 800, final.", right: "Would you accept £800?"}
          - {wrong: "Yes, if you sign for two year.", right: "Yes, if you sign for two years."}
    requires: ["en.grammar.second_conditional"]
  - key: en.func.hypothesise
    band: 7
    title: "Hypothesise"
    payload:
      exponents: ["Suppose…", "If that happened,…", "Imagine if…"]
      lesson:
        rule: "If + present, will for real possibilities; if + past, would for imagined ones."
        examples: ["If I get the job, I'll move.", "If I had more time, I'd volunteer.", "If the bus were late, I'd take a taxi."]
        common_errors:
          - {wrong: "If I would have time, I would come.", right: "If I had time, I would come."}
          - {wrong: "If I win, I would buy a house.", right: "If I won, I would buy a house."}
    requires: ["en.grammar.second_conditional"]
  - key: en.func.express_regret
    band: 7
    title: "Express regret"
    payload:
      exponents: ["I regret…ing", "I should have…", "If only I had…"]
      lesson:
        rule: "I should have + past participle; I wish I had…; if only I had…"
        examples: ["I should have read the contract.", "I wish I'd come earlier.", "If only I had known."]
        common_errors:
          - {wrong: "I should have readed the contract.", right: "I should have read the contract."}
          - {wrong: "If only I knew earlier, I would have come.", right: "If only I had known earlier, I would have come."}
    requires: ["en.grammar.wish_if_only"]
  - key: en.func.argue_point_of_view
    band: 8
    title: "Argue a point of view"
    payload:
      exponents: ["Firstly…, furthermore…, finally…", "There is no doubt that…", "Take, for example,…"]
      lesson:
        rule: "State your position, give two reasons with examples, then conclude: firstly, secondly, for these reasons."
        examples: ["I firmly believe that remote work is beneficial.", "Firstly, it reduces commuting; secondly, it helps concentration.", "For these reasons, I would recommend it."]
        common_errors:
          - {wrong: "I think yes because yes.", right: "I think so, for two reasons."}
          - {wrong: "Firstly it saves time, secondly is cheaper.", right: "Firstly, it saves time; secondly, it is cheaper."}
    requires: ["en.grammar.linking_words"]
  - key: en.func.persuade
    band: 8
    title: "Persuade"
    payload:
      exponents: ["You won't regret it.", "Just think how much you'd save…", "I understand your concerns, but…"]
      lesson:
        rule: "Persuade: show the benefit for the other person, answer the objection, invite action."
        examples: ["Think how much you'd learn.", "I know you're busy, but it's only on Saturdays.", "Come with me just once!"]
        common_errors:
          - {wrong: "You should to come; you'd enjoy it.", right: "You should come; you'd enjoy it."}
          - {wrong: "I know that you are no time.", right: "I know you don't have time."}
    requires: ["en.grammar.linking_words"]
  - key: en.func.concede_and_counter
    band: 9
    title: "Concede and counter-argue"
    payload:
      exponents: ["Admittedly…, but…", "While it's true that…, …", "That said,…"]
      lesson:
        rule: "Concede then counter: admittedly…, but; while it's true that…, however; even though…"
        examples: ["Admittedly, the project is expensive, but it will create jobs.", "While it's true that traffic will increase, local shops will benefit.", "Even though I understand your concerns, I still support it."]
        common_errors:
          - {wrong: "Admittedly it expensive, but it's useful.", right: "Admittedly, it's expensive, but it's useful."}
          - {wrong: "Despite it is expensive, it's useful.", right: "Despite being expensive, it's useful."}
    requires: ["en.grammar.linking_words"]
  - key: en.func.summarise
    band: 9
    title: "Summarise and paraphrase"
    payload:
      exponents: ["To sum up,…", "In other words,…", "So what you're saying is…"]
      lesson:
        rule: "Summarise: use “to sum up” or “in short”; keep the main idea and leave out details. Paraphrase: express the same meaning in different words; use “in other words”."
        examples: ["To sum up, the project is useful but costly.", "In other words, we have to wait six weeks.", "So what you're saying is that the deposit won't be returned?"]
        common_errors:
          - {wrong: "To sum it, the project is useful.", right: "To sum up, the project is useful."}
          - {wrong: "In other word, no.", right: "In other words, no."}
  - key: en.func.ask_give_directions
    band: 4
    title: "Ask for and give directions"
    payload:
      exponents: ["Excuse me, how do I get to…?", "Take the second turning on the left.", "It's about five minutes' walk."]
      lesson:
        rule: "Ask: how do I get to…?; give directions with imperatives and landmarks."
        examples: ["Excuse me, how do I get to the station?", "Take the second turning on the left.", "It's about five minutes' walk, opposite the bank."]
        common_errors:
          - {wrong: "Where is the way to the station?", right: "How do I get to the station?"}
          - {wrong: "You go to left after the bank.", right: "Turn left after the bank."}
  - key: en.func.invite_accept_decline
    band: 4
    title: "Invite, accept and decline"
    payload:
      exponents: ["Would you like to…?", "I'd love to.", "That's kind of you, but I'm busy that day."]
      lesson:
        rule: "Invite with would you like to…?; accept warmly; decline politely with thanks and a reason."
        examples: ["Would you like to come for dinner on Saturday?", "I'd love to, thanks!", "That's kind of you, but I'm busy that evening."]
        common_errors:
          - {wrong: "No, I don't want.", right: "That's kind of you, but I can't make it."}
          - {wrong: "Would you like coming to dinner?", right: "Would you like to come to dinner?"}
  - key: en.func.thank_respond
    band: 4
    title: "Thank and respond"
    payload:
      exponents: ["Thanks so much for your help.", "You're welcome.", "That's really kind of you."]
      lesson:
        rule: "Use 'Thank you for' or 'Thanks for' + noun or -ing.; reply you're welcome, no problem, my pleasure."
        examples: ["Thanks so much for your help.", "Thank you for calling me back.", "You're welcome, it was a pleasure."]
        common_errors:
          - {wrong: "Thank you for help me.", right: "Thank you for helping me."}
          - {wrong: "Thanks! — You welcome.", right: "Thanks! — You're welcome."}
  - key: en.func.telephone
    band: 5
    title: "On the phone"
    payload:
      places: [job_centre]
      exponents: ["Hello, could I speak to…?", "Who's calling, please?", "Can I leave a message?"]
      lesson:
        rule: "On the phone: say who you are, ask for the person, leave a message with your number."
        examples: ["Hello, could I speak to Ms Clarke, please?", "Who's calling, please?", "Can I leave a message? My number is 07700 900 144."]
        common_errors:
          - {wrong: "Can I leave her a massage?", right: "Can I leave her a message?"}
          - {wrong: "She will call back to me.", right: "She'll call me back."}
  - key: en.func.make_suggestions
    band: 5
    title: "Make suggestions"
    payload:
      exponents: ["How about…?", "Why don't we…?", "You could try…"]
      lesson:
        rule: "Suggest with how about + -ing?, why don't we…?, we could…"
        examples: ["How about meeting at the café?", "Why don't we share a taxi?", "We could sign on Monday."]
        common_errors:
          - {wrong: "How about to meet at the café?", right: "How about meeting at the café?"}
          - {wrong: "Why we don't share a taxi?", right: "Why don't we share a taxi?"}
  - key: en.func.ask_permission
    band: 5
    title: "Ask for permission"
    payload:
      exponents: ["Can I…?", "Do you mind if I…?", "Would it be all right if I opened the window?"]
      lesson:
        rule: "Ask permission with can I…?, do you mind if I…?, would it be all right if I + past?"
        examples: ["Can I sit here?", "Do you mind if I open the window?", "Would it be all right if I took a photo?"]
        common_errors:
          - {wrong: "Can I to open the window?", right: "Can I open the window?"}
          - {wrong: "Do you mind if I would open the window?", right: "Do you mind if I open the window?"}
  - key: en.func.sympathise_congratulate
    band: 5
    title: "Congratulate and sympathise"
    payload:
      exponents: ["Congratulations!", "I'm so sorry to hear that.", "Good luck with everything!"]
      lesson:
        rule: "Congratulate: congratulations on…, well done; Sympathise: I'm so sorry to hear that. Wish someone success: Good luck."
        examples: ["Congratulations on your new job!", "I'm so sorry to hear about your loss.", "Good luck with the exam!"]
        common_errors:
          - {wrong: "Congratulation for your job!", right: "Congratulations on your job!"}
          - {wrong: "I'm sorry to hear it, bad luck for you.", right: "I'm so sorry to hear that."}
  - key: en.func.express_certainty
    band: 6
    title: "Express certainty and probability"
    payload:
      exponents: ["I'm sure that…", "It's likely that…", "I doubt that…"]
      lesson:
        rule: "Certainty: I'm sure that…; probability: it's likely that…, it might…; doubt: I doubt that…"
        examples: ["I'm sure he'll come.", "It's likely that the office will be closed tomorrow.", "I doubt it'll rain."]
        common_errors:
          - {wrong: "I'm sure that he come.", right: "I'm sure that he'll come."}
          - {wrong: "It's probably that it rains.", right: "It'll probably rain."}
    requires: ["en.grammar.modals_of_deduction"]
  - key: en.func.give_instructions
    band: 6
    title: "Explain a process"
    payload:
      places: [library]
      exponents: ["First, you need to…", "After that,…", "Once that's done,…"]
      lesson:
        rule: "Explain a process step by step: first, then, once you've…, finally; use imperatives."
        examples: ["First, fill in the form online.", "Then print the confirmation page.", "Once you've done that, book an appointment."]
        common_errors:
          - {wrong: "First you must to fill the form.", right: "First, fill in the form."}
          - {wrong: "After you done it, book.", right: "Once you've done it, book an appointment."}
  - key: en.func.formal_register
    band: 7
    title: "Write in the right register"
    payload:
      exponents: ["Dear Sir or Madam,", "I am writing to enquire about…", "Yours faithfully,"]
      lesson:
        rule: "Formal letters: Dear Sir or Madam → Yours faithfully; Dear Mr Pike → Yours sincerely; no contractions or slang."
        examples: ["Dear Sir or Madam,", "I am writing to enquire about my deposit.", "Yours faithfully,"]
        common_errors:
          - {wrong: "Hi mate, I'm writing about…", right: "Dear Mr Pike, I am writing about…"}
          - {wrong: "Dear Sir or Madam, … Yours sincerely,", right: "Dear Sir or Madam, … Yours faithfully,"}
  - key: en.func.report_information
    band: 7
    title: "Report information"
    payload:
      exponents: ["According to…", "The article says that…", "I was told that…"]
      lesson:
        rule: "Report a source: according to…, the article says that…, I was told that…"
        examples: ["According to the landlord, the work will finish on Monday.", "The article says that rents have risen.", "I was told that the office closes at noon."]
        common_errors:
          - {wrong: "According to the landlord says…", right: "According to the landlord,…"}
          - {wrong: "I was said that it closes at noon.", right: "I was told that it closes at noon."}
    requires: ["en.grammar.reported_speech"]
  - key: en.func.structure_talk
    band: 8
    title: "Structure a talk"
    payload:
      exponents: ["First of all,…", "Moving on to…", "To sum up,…"]
      lesson:
        rule: "Structure a talk: announce the plan, signal each new part, conclude."
        examples: ["First of all, I'll describe the project.", "Moving on to the advantages,…", "To sum up, I'd encourage you to sign up."]
        common_errors:
          - {wrong: "Moving on the advantages,…", right: "Moving on to the advantages,…"}
          - {wrong: "To finish to conclude,…", right: "To conclude,…"}
    requires: ["en.grammar.linking_words"]
