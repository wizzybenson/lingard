# French grammar nodes. All rules and examples are original Lingard content.
defaults:
  kind: grammar
  language: fr
  source_url: https://www.canada.ca/content/dam/ircc/migration/ircc/francais/pdf/pub/competence-linguistique.pdf
  as_of: "2012"
nodes:
  - key: fr.grammar.present_regular
    band: 4
    title: Présent des verbes réguliers
    payload:
      lesson:
        rule: "Verbes en -er : radical + -e, -es, -e, -ons, -ez, -ent. Verbes en -ir (finir) : -is, -is, -it, -issons, -issez, -issent."
        examples: ["Je travaille au port.", "Nous finissons à six heures.", "Ils habitent près du marché."]
        common_errors:
          - {wrong: "Nous travaillez demain.", right: "Nous travaillons demain."}
          - {wrong: "Ils finit le travail.", right: "Ils finissent le travail."}
  - key: fr.grammar.present_irregular
    band: 4
    title: Présent des verbes irréguliers fréquents
    payload:
      lesson:
        rule: "Être, avoir, aller, faire, venir, prendre, pouvoir, vouloir ont des formes à mémoriser : je suis, j'ai, je vais, je fais, je viens, je prends, je peux, je veux."
        examples: ["Je vais à la banque.", "Vous faites quoi ce soir ?", "Elle prend le bus."]
        common_errors:
          - {wrong: "Je vas au travail.", right: "Je vais au travail."}
          - {wrong: "Vous faisez la cuisine.", right: "Vous faites la cuisine."}
  - key: fr.grammar.cest_il_est_il_y_a
    band: 4
    title: "C'est, il est, il y a"
    payload:
      lesson:
        rule: "C'est + nom avec déterminant ou + pronom, pour présenter ou identifier ; il/elle est + adjectif, ou + profession sans article ; il y a + nom, pour dire qu'une chose existe."
        examples: ["C'est mon voisin.", "Il est infirmier.", "Il y a une pharmacie près de la gare."]
        common_errors:
          - {wrong: "Il est un médecin.", right: "C'est un médecin."}
          - {wrong: "Il y en a une pharmacie près d'ici.", right: "Il y a une pharmacie près d'ici."}
  - key: fr.grammar.articles_gender
    band: 4
    title: Articles et genre
    payload:
      lesson:
        rule: "Défini : le, la, l', les. Indéfini : un, une, des. Partitif : du, de la, de l'. Après une négation, un, une, des et les articles partitifs deviennent généralement de / d' devant un complément direct : « Je n'ai pas de voiture. » Les articles définis restent inchangés : « Je n'aime pas le lait. » Après être, on garde l'article : « Ce n'est pas une voiture. »"
        examples: ["Je voudrais du pain.", "Il n'y a pas de lait.", "C'est une bonne idée."]
        common_errors:
          - {wrong: "Je n'ai pas du temps.", right: "Je n'ai pas de temps."}
          - {wrong: "La problème est la clé.", right: "Le problème est la clé."}
  - key: fr.grammar.adjectifs_accord
    band: 4
    title: "Accord et place des adjectifs"
    payload:
      lesson:
        rule: "L'adjectif s'accorde en genre et en nombre avec le nom : petit, petite, petits, petites. Il se place en général après le nom ; quelques adjectifs courts et fréquents se placent avant : beau, bon, grand, petit, jeune, vieux, nouveau."
        examples: ["Une voiture rouge.", "Un petit appartement calme.", "Les fenêtres sont ouvertes."]
        common_errors:
          - {wrong: "Une voiture rouge petite.", right: "Une petite voiture rouge."}
          - {wrong: "Les portes sont fermé.", right: "Les portes sont fermées."}
    prereq: [fr.grammar.articles_gender]
  - key: fr.grammar.possessifs_demonstratifs
    band: 4
    title: "Possessifs et démonstratifs"
    payload:
      lesson:
        rule: "Possessifs : mon, ma, mes ; ton, ta, tes ; son, sa, ses ; notre, nos ; votre, vos ; leur, leurs. Devant une voyelle, mon, ton, son même au féminin. Démonstratifs : ce (cet devant une voyelle), cette, ces."
        examples: ["Voici mon adresse.", "Cet appartement est encore libre.", "Ces clés sont à vous ?"]
        common_errors:
          - {wrong: "Voici ma adresse.", right: "Voici mon adresse."}
          - {wrong: "Ce appartement est libre.", right: "Cet appartement est libre."}
  - key: fr.grammar.prepositions_lieu
    band: 4
    title: "Prépositions de lieu, villes et pays"
    payload:
      lesson:
        rule: "À + ville (à Montréal) ; en + pays féminin ou commençant par une voyelle (en France, en Iran) ; au + pays masculin (au Canada, au Maroc) ; aux + pays pluriel (aux États-Unis). Chez + personne. Sur, sous, devant, derrière, à côté de, en face de."
        examples: ["J'habite au Canada, à Rivemont.", "Je vais chez le médecin demain.", "La banque est en face de la gare."]
        common_errors:
          - {wrong: "Je vais à Canada.", right: "Je vais au Canada."}
          - {wrong: "Je vais en Montréal.", right: "Je vais à Montréal."}
  - key: fr.grammar.negation
    band: 4
    title: "Négation : ne… pas, ne… jamais, ne… plus, ne… rien"
    payload:
      lesson:
        rule: "La négation entoure le verbe conjugué : ne + verbe + pas. Aux temps composés : ne + auxiliaire + pas + participe."
        examples: ["Je ne fume pas.", "Il n'a jamais vu la mer.", "Nous ne voulons rien."]
        common_errors:
          - {wrong: "Je ne ai pas compris.", right: "Je n'ai pas compris."}
          - {wrong: "Il n'a vu pas le film.", right: "Il n'a pas vu le film."}
  - key: fr.grammar.quantites
    band: 4
    title: "Exprimer une quantité"
    payload:
      lesson:
        rule: "Beaucoup de, peu de, assez de, trop de, un kilo de, une bouteille de + nom sans article (de devient d' devant une voyelle). Mais : la plupart des + nom."
        examples: ["J'ai beaucoup de travail cette semaine.", "Un kilo de pommes, s'il vous plaît.", "Il y a trop d'étapes."]
        common_errors:
          - {wrong: "J'ai beaucoup des amis ici.", right: "J'ai beaucoup d'amis ici."}
          - {wrong: "Un litre du lait.", right: "Un litre de lait."}
    prereq: [fr.grammar.articles_gender]
  - key: fr.grammar.questions
    band: 4
    title: "Poser des questions : intonation, est-ce que, inversion"
    payload:
      lesson:
        rule: "Trois registres : intonation (Vous venez ?), est-ce que (Est-ce que vous venez ?), inversion soutenue (Venez-vous ?)."
        examples: ["Est-ce que le bureau est ouvert ?", "À quelle heure part le train ?", "Pourriez-vous m'aider ?"]
        common_errors:
          - {wrong: "Où est-ce que tu habites est ?", right: "Où est-ce que tu habites ?"}
          - {wrong: "Quand vous partez-vous ?", right: "Quand partez-vous ?"}
  - key: fr.grammar.futur_proche
    band: 4
    title: Futur proche
    payload:
      lesson:
        rule: "Aller au présent + infinitif pour un projet proche : je vais signer le bail."
        examples: ["Je vais appeler le propriétaire.", "On va visiter l'appartement demain."]
        common_errors:
          - {wrong: "Je vais à signer.", right: "Je vais signer."}
  - key: fr.grammar.verbes_pronominaux
    band: 4
    title: "Verbes pronominaux"
    payload:
      lesson:
        rule: "Le pronom réfléchi suit le sujet : je me lève, tu te lèves, il se lève, nous nous levons, vous vous levez, ils se lèvent. À la négation, ne se place avant le pronom : je ne me lève pas."
        examples: ["Je me réveille à sept heures.", "Comment vous appelez-vous ?", "Nous nous préparons pour l'entretien."]
        common_errors:
          - {wrong: "Je lève à sept heures.", right: "Je me lève à sept heures."}
          - {wrong: "Nous se préparons.", right: "Nous nous préparons."}
    prereq: [fr.grammar.present_regular]
  - key: fr.grammar.passe_recent_en_train_de
    band: 4
    title: "Venir de et être en train de"
    payload:
      lesson:
        rule: "Venir de + infinitif : une action qui vient de se terminer. Être en train de + infinitif : une action en cours en ce moment."
        examples: ["Je viens d'arriver à Rivemont.", "Il est en train de remplir le formulaire.", "Nous venons de signer le bail."]
        common_errors:
          - {wrong: "Je viens de arrivé.", right: "Je viens d'arriver."}
          - {wrong: "Je suis en train travailler.", right: "Je suis en train de travailler."}
    prereq: [fr.grammar.present_irregular]
  - key: fr.grammar.passe_compose_avoir
    band: 5
    title: Passé composé avec avoir
    payload:
      lesson:
        rule: "Avoir au présent + participe passé. Le participe s'accorde avec un COD placé avant le verbe."
        examples: ["J'ai payé le loyer.", "Les clés ? Je les ai rendues hier."]
        common_errors:
          - {wrong: "J'ai prendu le métro.", right: "J'ai pris le métro."}
          - {wrong: "Je suis mangé au restaurant.", right: "J'ai mangé au restaurant."}
  - key: fr.grammar.passe_compose_etre
    band: 5
    title: Passé composé avec être
    payload:
      lesson:
        rule: "Les verbes aller, venir, arriver, partir, naître, mourir, rester et tomber prennent être. Entrer, sortir, monter, descendre et retourner prennent être lorsqu'ils sont employés sans complément direct, mais avoir avec un complément direct : « Elle est sortie », mais « Elle a sorti les poubelles ». Les verbes pronominaux prennent également être. Avec être, le participe s'accorde avec le sujet (elle est partie) ; pour les pronominaux, l'accord dépend de la construction (elles se sont inscrites, mais elles se sont parlé)."
        examples: ["Elle est arrivée à Rivemont lundi.", "Nous nous sommes inscrits au cours."]
        common_errors:
          - {wrong: "Elle a arrivé hier.", right: "Elle est arrivée hier."}
          - {wrong: "Ils sont parti tôt.", right: "Ils sont partis tôt."}
    prereq: [fr.grammar.passe_compose_avoir]
  - key: fr.grammar.imparfait
    band: 5
    title: Imparfait (description et habitude)
    payload:
      lesson:
        rule: "Radical du « nous » au présent sans -ons + -ais, -ais, -ait, -ions, -iez, -aient. Exception : être → ét- (j'étais, nous étions). Pour le décor, l'habitude, l'état ; le passé composé pour l'événement."
        examples: ["Quand j'étais petit, je jouais au foot.", "Il pleuvait quand je suis sorti."]
        common_errors:
          - {wrong: "Quand j'étais jeune, je jouait au soccer.", right: "Quand j'étais jeune, je jouais au soccer."}
    prereq: [fr.grammar.passe_compose_avoir]
  - key: fr.grammar.passe_compose_ou_imparfait
    band: 5
    title: "Passé composé ou imparfait ?"
    payload:
      lesson:
        rule: "L'imparfait pose le décor : description, état, habitude, action en cours. Le passé composé raconte les événements ponctuels qui font avancer l'histoire."
        examples: ["Je dormais quand le téléphone a sonné.", "Quand j'étais enfant, j'allais à l'école à pied.", "Hier, j'ai visité trois appartements."]
        common_errors:
          - {wrong: "Quand j'ai été petit, j'habitais à Rabat.", right: "Quand j'étais petit, j'habitais à Rabat."}
          - {wrong: "Hier soir, je regardais un film, puis je me couchais à 23 h.", right: "Hier soir, j'ai regardé un film, puis je me suis couché à 23 h."}
    prereq: [fr.grammar.passe_compose_avoir, fr.grammar.imparfait]
  - key: fr.grammar.expressions_de_temps
    band: 5
    title: "Depuis, il y a, pendant, dans"
    payload:
      lesson:
        rule: "Depuis + présent : une situation qui continue. Il y a + passé : le moment où une chose s'est passée. Pendant : la durée d'une activité ou d'une situation. Exemple : « Je vais rester ici pendant deux mois. » Dans : un moment à venir."
        examples: ["J'habite ici depuis deux ans.", "Je suis arrivé il y a trois mois.", "Je pars en vacances dans une semaine."]
        common_errors:
          - {wrong: "J'habite ici il y a deux ans.", right: "J'habite ici depuis deux ans."}
          - {wrong: "Je pars en vacances en une semaine.", right: "Je pars en vacances dans une semaine."}
    prereq: [fr.grammar.passe_compose_etre]
  - key: fr.grammar.comparatif_superlatif
    band: 5
    title: Comparatif et superlatif
    payload:
      lesson:
        rule: "Plus / moins / aussi + adjectif + que. Le plus / le moins + adjectif. Bon → meilleur, bien → mieux."
        examples: ["Cet appartement est plus calme que l'autre.", "C'est le quartier le plus cher de la ville."]
        common_errors:
          - {wrong: "Ce gâteau est plus bon que l'autre.", right: "Ce gâteau est meilleur que l'autre."}
          - {wrong: "Il parle plus bien que moi.", right: "Il parle mieux que moi."}
  - key: fr.grammar.imperatif
    band: 5
    title: Impératif
    payload:
      lesson:
        rule: "Trois personnes sans sujet : prends, prenons, prenez. Les verbes en -er perdent le -s au « tu » : parle !"
        examples: ["Prenez la deuxième rue à droite.", "Ne t'inquiète pas."]
        common_errors:
          - {wrong: "Parles plus lentement, s'il te plaît !", right: "Parle plus lentement, s'il te plaît !"}
  - key: fr.grammar.pronoms_cod_coi
    band: 6
    title: Pronoms compléments directs et indirects
    payload:
      lesson:
        rule: "COD : me, te, le, la, nous, vous, les. COI (à quelqu'un) : me, te, lui, nous, vous, leur. Ces pronoms se placent généralement avant le verbe conjugué (Je le connais) ou avant l'auxiliaire aux temps composés (Je lui ai écrit). Lorsqu'ils complètent un infinitif, ils se placent devant celui-ci (Je vais lui téléphoner). À l'impératif affirmatif, ils se placent après le verbe (Téléphone-lui)."
        examples: ["Je le connais depuis deux ans.", "Je lui ai envoyé un courriel."]
        common_errors:
          - {wrong: "Je connais le.", right: "Je le connais."}
          - {wrong: "Je les ai téléphoné.", right: "Je leur ai téléphoné."}
  - key: fr.grammar.pronoms_y_en
    band: 6
    title: Pronoms y et en
    payload:
      lesson:
        rule: "Y remplace à + chose ou un lieu ; en remplace de + nom ou une quantité."
        examples: ["Le marché ? J'y vais le samedi.", "Des pommes ? J'en voudrais trois."]
        common_errors:
          - {wrong: "J'ai besoin de ça, j'y ai besoin.", right: "J'en ai besoin."}
    prereq: [fr.grammar.pronoms_cod_coi]
  - key: fr.grammar.adverbes
    band: 6
    title: "Adverbes en -ment et place des adverbes"
    payload:
      lesson:
        rule: "Adjectif au féminin + -ment (lente → lentement) ; -ant → -amment, -ent → -emment (courant → couramment, évident → évidemment). Au passé composé, certains adverbes courants, comme « bien », « mal », « déjà » et « souvent », se placent généralement entre l'auxiliaire et le participe : j'ai bien compris. D'autres se placent après le participe : je suis rentré tard."
        examples: ["Parlez lentement, s'il vous plaît.", "J'ai déjà rempli le formulaire.", "Elle parle couramment l'arabe et le français."]
        common_errors:
          - {wrong: "Il parle rapidemment.", right: "Il parle rapidement."}
          - {wrong: "J'ai compris bien.", right: "J'ai bien compris."}
    prereq: [fr.grammar.passe_compose_avoir]
  - key: fr.grammar.indefinis_ne_que
    band: 6
    title: "Quelqu'un, personne, rien, aucun, chaque, ne… que"
    payload:
      lesson:
        rule: "Quelqu'un, quelque chose s'opposent à personne, rien (avec ne). Chaque + nom singulier ; aucun(e) + ne, au singulier. Ne… que signifie seulement."
        examples: ["Personne n'a appelé ce matin.", "Il n'y a aucun problème.", "Je n'ai que dix minutes."]
        common_errors:
          - {wrong: "Chaque jours, je prends le bus.", right: "Chaque jour, je prends le bus."}
          - {wrong: "Il n'y a aucuns problèmes.", right: "Il n'y a aucun problème."}
    prereq: [fr.grammar.negation]
  - key: fr.grammar.futur_simple
    band: 6
    title: Futur simple
    payload:
      lesson:
        rule: "Infinitif (sans le -e final pour les verbes en -re) ou radical irrégulier (ser-, aur-, ir-, fer-, pourr-, voudr-, viendr-) + -ai, -as, -a, -ons, -ez, -ont."
        examples: ["Je vous rappellerai demain.", "Quand tu arriveras, appelle-moi."]
        common_errors:
          - {wrong: "Quand j'arrivera demain, je t'appellerai.", right: "Quand j'arriverai demain, je t'appellerai."}
          - {wrong: "Je seras là.", right: "Je serai là."}
  - key: fr.grammar.conditionnel_present
    band: 6
    title: Conditionnel présent (politesse, souhait)
    payload:
      lesson:
        rule: "Radical du futur + terminaisons de l'imparfait : je voudrais, vous pourriez, il faudrait."
        examples: ["Je voudrais prendre rendez-vous.", "Pourriez-vous répéter, s'il vous plaît ?"]
        common_errors:
          - {wrong: "Je voudrai un café, s'il vous plaît.", right: "Je voudrais un café, s'il vous plaît."}
    prereq: [fr.grammar.futur_simple, fr.grammar.imparfait]
  - key: fr.grammar.relatifs_qui_que_ou
    band: 6
    title: "Pronoms relatifs : qui, que, où"
    payload:
      lesson:
        rule: "Qui = sujet du verbe qui suit ; que = complément d'objet direct (COD) du verbe de la proposition relative ; où = lieu ou temps."
        examples: ["La voisine qui habite en face est infirmière.", "Le studio que j'ai visité est petit.", "Le jour où je suis arrivé…"]
        common_errors:
          - {wrong: "L'homme que parle est mon patron.", right: "L'homme qui parle est mon patron."}
  - key: fr.grammar.si_present_futur
    band: 6
    title: "Hypothèse probable : si + présent → futur"
    payload:
      lesson:
        rule: "Si + présent, futur (ou impératif). Quand si introduit une condition, on n'emploie pas le futur dans la proposition introduite par si."
        examples: ["S'il fait beau, nous irons au parc.", "Si tu as besoin d'aide, appelle-moi."]
        common_errors:
          - {wrong: "Si tu viendras, on mangera ensemble.", right: "Si tu viens, on mangera ensemble."}
    prereq: [fr.grammar.futur_simple]
  - key: fr.grammar.si_imparfait
    band: 7
    title: "Hypothèse irréelle au présent : si + imparfait → conditionnel présent"
    payload:
      lesson:
        rule: "Si + imparfait, conditionnel présent. Pas de conditionnel après si lorsqu'il introduit la condition : « Si j'avais le temps, je viendrais. »"
        examples: ["Si j'avais plus de temps, je suivrais un cours du soir.", "Si vous refusiez, j'irais au tribunal."]
        common_errors:
          - {wrong: "Si j'aurais le temps, je viendrais.", right: "Si j'avais le temps, je viendrais."}
          - {wrong: "Si j'avais de l'argent, j'achèterai une voiture.", right: "Si j'avais de l'argent, j'achèterais une voiture."}
    prereq: [fr.grammar.imparfait, fr.grammar.conditionnel_present]
  - key: fr.grammar.relatif_dont
    band: 7
    title: Pronom relatif dont
    payload:
      lesson:
        rule: "Dont remplace un complément introduit par de : parler de, avoir besoin de, se souvenir de, le nom de."
        examples: ["Voici le document dont vous avez besoin.", "C'est la collègue dont je t'ai parlé."]
        common_errors:
          - {wrong: "Le livre que j'ai besoin.", right: "Le livre dont j'ai besoin."}
    prereq: [fr.grammar.relatifs_qui_que_ou]
  - key: fr.grammar.doubles_pronoms
    band: 7
    title: "Ordre des doubles pronoms"
    payload:
      lesson:
        rule: "Quand les pronoms se placent avant le verbe, l'ordre est : me, te, se, nous, vous ; le, la, les ; lui, leur ; y ; en : il me le donne, je le lui envoie, il y en a. Attention, cet ordre change à l'impératif affirmatif : donne-le-moi, donnez-le-nous."
        examples: ["Je vous l'envoie aujourd'hui.", "Le formulaire ? Je le lui ai déjà donné.", "Des places ? Il y en a encore."]
        common_errors:
          - {wrong: "Je lui le donne.", right: "Je le lui donne."}
          - {wrong: "Il en y a encore.", right: "Il y en a encore."}
    prereq: [fr.grammar.pronoms_cod_coi, fr.grammar.pronoms_y_en]
  - key: fr.grammar.pronoms_demonstratifs_possessifs
    band: 7
    title: "Celui, celle, le mien, la vôtre"
    payload:
      lesson:
        rule: "Celui, celle, ceux, celles remplacent un nom déjà dit, suivis de -ci, -là, de qui, que ou de. Le mien, la mienne, les miens, les miennes ; le vôtre, la vôtre, les vôtres ; le leur, la leur, les leurs."
        examples: ["Quel formulaire ? Celui de la mairie.", "Ce n'est pas ma clé, c'est la vôtre.", "Je préfère celle qui donne sur le parc."]
        common_errors:
          - {wrong: "Celle qui je préfère.", right: "Celle que je préfère."}
          - {wrong: "C'est la votre.", right: "C'est la vôtre."}
    prereq: [fr.grammar.relatifs_qui_que_ou]
  - key: fr.grammar.plus_que_parfait
    band: 7
    title: Plus-que-parfait
    payload:
      lesson:
        rule: "Avoir ou être à l'imparfait + participe passé : une action antérieure à une autre action passée."
        examples: ["Quand je suis arrivé, le train était déjà parti.", "Il m'a dit qu'il avait perdu ses clés."]
        common_errors:
          - {wrong: "Quand je suis arrivé, il est déjà parti.", right: "Quand je suis arrivé, il était déjà parti."}
    prereq: [fr.grammar.passe_compose_etre, fr.grammar.imparfait]
  - key: fr.grammar.subjonctif_present
    band: 7
    title: Subjonctif présent après la nécessité, la volonté, l'émotion
    payload:
      lesson:
        rule: "Il faut que, je veux que, je suis content que, avant que, pour que + subjonctif. En général, radical de « ils » au présent + -e, -es, -e, -ent pour je, tu, il/elle/on, ils/elles. Pour nous et vous, on utilise généralement le radical de « nous » au présent + -ions, -iez : que nous venions, que vous preniez. Certains verbes sont irréguliers : être, avoir, aller, faire, pouvoir, savoir…"
        examples: ["Il faut que vous signiez ici.", "Je voudrais que tu viennes avec moi."]
        common_errors:
          - {wrong: "Il faut que tu vas à la mairie.", right: "Il faut que tu ailles à la mairie."}
          - {wrong: "Je veux que je parte.", right: "Je veux partir."}
  - key: fr.grammar.gerondif
    band: 7
    title: Gérondif
    payload:
      lesson:
        rule: "En + participe présent (En + participe présent (forme de « nous » au présent sans -ons + -ant ; exceptions : étant, ayant, sachant) pour la simultanéité ou la manière ; même sujet que le verbe principal.) pour la simultanéité ou la manière ; même sujet que le verbe principal."
        examples: ["J'écoute la radio en conduisant.", "C'est en pratiquant qu'on progresse."]
        common_errors:
          - {wrong: "En sortant du bureau, la pluie a commencé.", right: "Quand je suis sorti du bureau, la pluie a commencé."}
  - key: fr.grammar.connecteurs_logiques
    band: 7
    title: Connecteurs logiques (cause, conséquence, opposition, concession)
    payload:
      lesson:
        rule: "Cause : parce que, puisque, car, comme. Conséquence : donc, c'est pourquoi, si bien que. Opposition : mais, pourtant, alors que. Concession : bien que (+ subjonctif), même si (+ indicatif)."
        examples: ["Puisque le bail est terminé, je demande mon dépôt.", "Bien qu'il soit tard, je vais finir ce rapport."]
        common_errors:
          - {wrong: "Bien qu'il est malade, il travaille.", right: "Bien qu'il soit malade, il travaille."}
  - key: fr.grammar.conditionnel_passe
    band: 8
    title: Conditionnel passé (regret, reproche)
    payload:
      lesson:
        rule: "Avoir ou être au conditionnel présent + participe passé : j'aurais dû, tu aurais pu, elle serait venue."
        examples: ["J'aurais dû vérifier le contrat.", "Vous auriez pu me prévenir."]
        common_errors:
          - {wrong: "J'aurais du partir plus tôt.", right: "J'aurais dû partir plus tôt."}
    prereq: [fr.grammar.conditionnel_present, fr.grammar.passe_compose_etre]
  - key: fr.grammar.futur_anterieur
    band: 8
    title: "Futur antérieur"
    payload:
      lesson:
        rule: "Avoir ou être au futur simple + participe passé : une action future terminée avant une autre. Pour situer explicitement une action dans l'avenir après quand, dès que ou lorsque, on emploie généralement le futur simple, ou le futur antérieur si l'action doit être achevée avant une autre. Le présent reste possible, notamment pour une habitude : « Quand je finis tôt, je rentre à pied. »"
        examples: ["Dès que j'aurai reçu ma carte, je vous l'enverrai.", "Quand vous serez arrivés, appelez-moi.", "J'aurai fini le dossier avant vendredi."]
        common_errors:
          - {wrong: "Quand j'aurais fini, je t'appellerai.", right: "Quand j'aurai fini, je t'appellerai."}
          - {wrong: "Quand je serai fini, je t'appellerai.", right: "Quand j'aurai fini, je t'appellerai."}
    prereq: [fr.grammar.futur_simple, fr.grammar.passe_compose_etre]
  - key: fr.grammar.accord_participe_avoir
    band: 8
    title: "Accord du participe passé avec avoir"
    payload:
      lesson:
        rule: "Avec avoir, le participe passé s'accorde avec le complément d'objet direct seulement quand celui-ci est placé avant le verbe (pronom la, les, ou relatif que)."
        examples: ["Les clés ? Je les ai trouvées.", "La lettre que j'ai écrite est partie hier.", "J'ai trouvé les clés dans la boîte."]
        common_errors:
          - {wrong: "La décision que j'ai pris.", right: "La décision que j'ai prise."}
          - {wrong: "J'ai trouvées les clés.", right: "J'ai trouvé les clés."}
    prereq: [fr.grammar.pronoms_cod_coi, fr.grammar.passe_compose_avoir]
  - key: fr.grammar.si_plus_que_parfait
    band: 8
    title: "Hypothèse irréelle au passé : si + plus-que-parfait → conditionnel passé"
    payload:
      lesson:
        rule: "Si + plus-que-parfait, conditionnel passé. Pour regretter ou imaginer un passé différent."
        examples: ["Si j'avais su, je serais venu plus tôt.", "Si vous m'aviez prévenu, j'aurais réparé le mur."]
        common_errors:
          - {wrong: "Si j'aurais su, je serais venu.", right: "Si j'avais su, je serais venu."}
    prereq: [fr.grammar.plus_que_parfait, fr.grammar.conditionnel_passe, fr.grammar.si_imparfait]
  - key: fr.grammar.subjonctif_vs_indicatif
    band: 8
    title: Subjonctif ou indicatif ? (opinion, certitude, doute)
    payload:
      lesson:
        rule: "Je pense que, je suis sûr que, il est évident que + indicatif ; je ne pense pas que, je doute que, il est possible que + subjonctif."
        examples: ["Je pense qu'il a raison.", "Je ne pense pas qu'il ait raison."]
        common_errors:
          - {wrong: "Je pense qu'il ait raison.", right: "Je pense qu'il a raison."}
          - {wrong: "Je doute qu'il vient.", right: "Je doute qu'il vienne."}
    prereq: [fr.grammar.subjonctif_present]
  - key: fr.grammar.subjonctif_conjonctions
    band: 8
    title: "Subjonctif après bien que, pour que, avant que, à condition que"
    payload:
      lesson:
        rule: "Bien que, pour que, afin que, avant que, à condition que, sans que + subjonctif. Après que, parce que, pendant que, dès que gardent l'indicatif. Avec le même sujet : pour, avant de, sans + infinitif."
        examples: ["Je vous appelle pour que vous soyez prêt.", "Bien qu'il fasse froid, le marché est ouvert.", "J'économise pour payer le dépôt."]
        common_errors:
          - {wrong: "Bien qu'il fait froid, le marché est ouvert.", right: "Bien qu'il fasse froid, le marché est ouvert."}
          - {wrong: "Je travaille pour que je paie le loyer.", right: "Je travaille pour payer le loyer."}
    prereq: [fr.grammar.subjonctif_present]
  - key: fr.grammar.discours_rapporte
    band: 8
    title: Discours rapporté au passé
    payload:
      lesson:
        rule: "Après un verbe introducteur au passé, si l'on se place au moment des paroles rapportées : présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel présent. Ces changements ne sont pas toujours obligatoires : on peut conserver le présent pour un fait toujours valable ou le futur pour un événement encore à venir."
        examples: ["Il a dit qu'il viendrait.", "Elle m'a demandé si j'avais rempli le formulaire."]
        common_errors:
          - {wrong: "Elle m'a demandé que je venais.", right: "Elle m'a demandé si je venais."}
    prereq: [fr.grammar.plus_que_parfait, fr.grammar.conditionnel_present]
  - key: fr.grammar.voix_passive
    band: 8
    title: Voix passive
    payload:
      lesson:
        rule: "Être au temps voulu + participe passé accordé avec le sujet ; Le complément d'agent est généralement introduit par « par », parfois par « de » : « Elle est appréciée de tous »."
        examples: ["La décision a été prise par le conseil.", "Les candidats seront convoqués lundi."]
        common_errors:
          - {wrong: "La loi a été voté hier.", right: "La loi a été votée hier."}
  - key: fr.grammar.infinitif_passe_participe_present
    band: 8
    title: "Infinitif passé et participe présent"
    payload:
      lesson:
        rule: "Après + infinitif passé (après avoir signé, après être arrivé) pour une action antérieure, avec le même sujet. À l'écrit, le participe présent en -ant (ayant, étant) exprime la cause ou décrit."
        examples: ["Après avoir signé le bail, il a reçu les clés.", "Étant malade, elle n'est pas venue.", "Après être arrivés, nous avons cherché un logement."]
        common_errors:
          - {wrong: "Après signer le bail, il a reçu les clés.", right: "Après avoir signé le bail, il a reçu les clés."}
          - {wrong: "Après être signé le contrat, il est parti.", right: "Après avoir signé le contrat, il est parti."}
    prereq: [fr.grammar.gerondif]
  - key: fr.grammar.concordance_des_temps
    band: 9
    title: Concordance des temps dans le récit
    payload:
      lesson:
        rule: "Dans un récit au passé, articuler passé composé (événements), imparfait (cadre), plus-que-parfait (antériorité) et conditionnel (futur dans le passé)."
        examples: ["Elle savait qu'elle partirait, car on lui avait proposé un poste.", "Quand je suis arrivé, il pleuvait et le bureau avait déjà fermé."]
        common_errors:
          - {wrong: "Il savait qu'il réussira.", right: "Il savait qu'il réussirait."}
    prereq: [fr.grammar.discours_rapporte]
  - key: fr.grammar.subjonctif_passe
    band: 9
    title: Subjonctif passé
    payload:
      lesson:
        rule: "Avoir ou être au subjonctif présent + participe passé, pour une action antérieure au verbe principal."
        examples: ["Je suis ravi que vous ayez accepté.", "Bien qu'il soit parti tôt, il est arrivé en retard."]
        common_errors:
          - {wrong: "Je suis content que tu es venu.", right: "Je suis content que tu sois venu."}
    prereq: [fr.grammar.subjonctif_vs_indicatif]
  - key: fr.grammar.relatifs_composes
    band: 9
    title: "Lequel, auquel, duquel"
    payload:
      lesson:
        rule: "Après une préposition, pour une chose : lequel, laquelle, lesquels, lesquelles. À + lequel = auquel (auxquels, auxquelles) ; de + lequel = duquel, quand de fait partie d'une locution (près duquel). Pour une personne, on préfère à qui, avec qui."
        examples: ["Le dossier sur lequel je travaille est urgent.", "C'est la raison pour laquelle j'ai démissionné.", "Le projet auquel je participe commence lundi."]
        common_errors:
          - {wrong: "C'est la raison pour que j'ai démissionné.", right: "C'est la raison pour laquelle j'ai démissionné."}
          - {wrong: "Le projet à lequel je participe.", right: "Le projet auquel je participe."}
    prereq: [fr.grammar.relatif_dont]
  - key: fr.grammar.passe_simple
    band: 9
    title: "Reconnaître le passé simple à l'écrit"
    payload:
      lesson:
        rule: "Le passé simple est le temps du récit écrit (romans, biographies, certains articles) : il parla, ils finirent, elle fut, ils eurent, il vint. On ne l'emploie presque jamais à l'oral ; il faut surtout le reconnaître pour comprendre un texte."
        examples: ["Il entra, regarda autour de lui et sourit.", "En 1608, Champlain fonda la ville de Québec.", "Ils vécurent longtemps près du fleuve."]
        common_errors:
          - {wrong: "Ils finissèrent le travail à midi.", right: "Ils finirent le travail à midi."}
          - {wrong: "Elle fu élue mairesse en 1990.", right: "Elle fut élue mairesse en 1990."}
    prereq: [fr.grammar.concordance_des_temps]
  - key: fr.grammar.accord_participe_pronominaux
    band: 9
    title: "Accord du participe des verbes pronominaux"
    payload:
      lesson:
        rule: "Avec un verbe pronominal réfléchi ou réciproque, le participe s'accorde avec le COD placé avant, souvent se : elles se sont lavées. Si se est indirect (se parler, se téléphoner, se dire) et qu'aucun COD ne précède, ou si le COD vient après, il ne s'accorde pas : elles se sont parlé, elle s'est lavé les mains. Les verbes toujours pronominaux (s'enfuir, se souvenir) s'accordent généralement avec le sujet."
        examples: ["Elles se sont inscrites hier.", "Ils se sont parlé au téléphone.", "Elle s'est lavé les mains."]
        common_errors:
          - {wrong: "Elles se sont parlées pendant une heure.", right: "Elles se sont parlé pendant une heure."}
          - {wrong: "Elle s'est lavée les mains.", right: "Elle s'est lavé les mains."}
    prereq: [fr.grammar.accord_participe_avoir, fr.grammar.passe_compose_etre]
  - key: fr.grammar.nominalisation
    band: 9
    title: Nominalisation (style écrit)
    payload:
      lesson:
        rule: "Transformer un verbe en nom pour condenser l'information : augmenter → l'augmentation, décider → la décision."
        examples: ["L'augmentation des loyers inquiète les locataires.", "Après la signature du contrat…"]
        common_errors:
          - {wrong: "L'augmenter des loyers inquiète les locataires.", right: "L'augmentation des loyers inquiète les locataires."}
  - key: fr.grammar.mise_en_relief
    band: 10
    title: "Mise en relief : c'est… qui / ce que… c'est"
    payload:
      lesson:
        rule: "Souligner un élément : c'est + élément + qui/que ; ce qui/ce que + verbe, c'est…"
        examples: ["C'est la sécurité qui m'inquiète.", "Ce que je propose, c'est un compromis."]
        common_errors:
          - {wrong: "C'est la sécurité que m'inquiète.", right: "C'est la sécurité qui m'inquiète."}
  - key: fr.grammar.hypothese_concession_nuancees
    band: 10
    title: "Nuancer : à moins que, pour peu que, quand bien même"
    payload:
      lesson:
        rule: "À moins que (+ subjonctif, souvent avec ne explétif), pour peu que (+ subjonctif) et quand bien même (+ conditionnel) nuancent une condition ou une concession dans un argument soutenu."
        examples: ["Nous signerons, à moins que vous ne trouviez mieux.", "Quand bien même il serait d'accord, le budget ne suffirait pas.", "Pour peu qu'on l'écoute, il propose de bonnes idées."]
        common_errors:
          - {wrong: "Quand bien même il est d'accord, le budget ne suffirait pas.", right: "Quand bien même il serait d'accord, le budget ne suffirait pas."}
          - {wrong: "À moins que vous trouvez mieux.", right: "À moins que vous ne trouviez mieux."}
    prereq: [fr.grammar.subjonctif_conjonctions]
  - key: fr.grammar.articulateurs_soutenus
    band: 10
    title: "Articulateurs du discours argumenté"
    payload:
      lesson:
        rule: "Pour enchaîner des arguments à l'écrit et à l'oral soutenu : en effet (confirme ou explique), or (introduit un fait qui change la donne), néanmoins et toutefois (opposent), en revanche (contraste), dès lors et par conséquent (conséquence)."
        examples: ["Le projet est coûteux ; néanmoins, il créera des emplois.", "Le loyer devait baisser. Or, il a augmenté de 10 %.", "Les transports sont saturés ; dès lors, il faut investir."]
        common_errors:
          - {wrong: "Le projet est utile. En effet, il coûte très cher.", right: "Le projet est utile. Néanmoins, il coûte très cher."}
          - {wrong: "Les transports sont saturés ; dès lors qu'il faut investir.", right: "Les transports sont saturés ; dès lors, il faut investir."}
    prereq: [fr.grammar.connecteurs_logiques]
