      - {question: "(26)", accepted: [nozzle], band: 7}
      - {question: "(27)", accepted: [plastic base, base], band: 6}

  - id: en-rm-b-s3
    part: section3
    band: 8
    task_type: true_false_not_given
    shuffle: false
    options: ["TRUE", "FALSE", "NOT GIVEN"]
    instructions: "Questions 28–34. Do the following statements agree with the information in the text? Choose TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this."
    stimulus: |
      WHY WE NEVER FORGET A SONG

      Most people have had the experience of hearing a song on the radio that they have not heard for twenty years and finding that they can still sing every word. The same people may struggle to remember what they read in a newspaper last week. Why should song lyrics be so much easier to remember than ordinary language?

      Part of the answer lies in rhythm. A melody divides words into regular units, and those units act like a frame: if you remember one part of a line, the rhythm tells you how many syllables must come next, which narrows down the possibilities. Rhyme works in a similar way. In experiments, people who were asked to recall lists of words remembered more when the words were set to a simple tune than when they were spoken, although the advantage disappeared if the tune was complicated or unfamiliar.

      Repetition matters too. Popular songs often repeat their chorus four or five times, and listeners hear the same song many times over weeks or months. Psychologists have long known that information which is repeated at intervals, rather than all at once, is remembered far better, and the way we listen to music follows this pattern almost exactly.

      Emotion is a third factor. Music has a strong effect on mood, and memories formed at moments of strong feeling tend to last longer. This may explain why many people remember the songs of their teenage years so clearly: adolescence is a time of intense emotions, and music often plays a central part in young people's social lives.

      These findings have practical uses. Teachers have long used songs to help young children learn the alphabet or the days of the week, and some language teachers now use music to help adult learners remember vocabulary and grammar. There is also growing interest in music in the care of people with dementia. Even when patients have lost much of their memory for recent events, many can still sing songs from their youth, and some care homes report that singing sessions improve residents' mood and make them more willing to talk.

      Researchers are careful not to claim too much, however. Remembering the words of a song is not the same as understanding them; children who can sing the alphabet perfectly may still not know which letter comes after "k" without singing from the beginning. And while music seems to help people remember words, there is little evidence so far that it improves memory in general.
