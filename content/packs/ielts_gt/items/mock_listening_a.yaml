  - id: en-lm-a-p4
    part: part4
    band: 8
    task_type: note_completion
    instructions: "Questions 31–40. Complete the notes below. Write ONE WORD ONLY for each answer."
    stimulus: |
      M1: Today I want to look at a trend that has grown remarkably over the last twenty years: keeping honeybees in cities. When people first hear about it, they're usually surprised that bees can survive in cities at all. In fact, urban bees often do better than bees in the countryside, and the main reason is variety. Modern farmland is often planted with a single crop over a huge area, so bees there have plenty to eat for a few weeks and then very little. In a city, parks, gardens, street trees and even window boxes flower at different times, so there is food from early spring to late autumn.
      A second advantage is temperature. Cities are usually a few degrees warmer than the land around them, the so-called heat island effect, and this means urban colonies can become active earlier in the year.
      So who keeps bees in cities? Hobbyists, of course, but also businesses. Hotels and office blocks have put hives on their roofs, partly to produce honey for their own restaurants, but mainly, it has to be said, for publicity. Some critics call this greenwashing: it looks good, but it may do little for the environment.
      And that brings me to the problems. The first is competition. Honeybees are just one of hundreds of bee species, and most of the others are wild bees that don't live in hives at all. Researchers in several European cities have found that where the number of hives rises quickly, wild bees can struggle, because there simply aren't enough flowers to go round. In one city, the number of hives went up four times in ten years, while the number of flowers hardly changed.
      The second problem is disease. When hives are kept close together, infections spread more easily between colonies, and many new beekeepers don't have the training to recognise the signs early.
      So what's being done? Several cities now ask beekeepers to register their hives, so that numbers can be monitored. Others have introduced courses that new keepers must complete before they're allowed a hive. But many experts argue that the most effective step is simply to plant more. If the problem is a shortage of flowers, the answer is to increase the supply, and here the choice of plant matters. Native wildflowers support far more species than the decorative plants often chosen for gardens.
      Finally, a word about the honey itself. City honey is often said to taste stronger than country honey, because it comes from such a mixture of plants. And although people worry about pollution, tests have generally found the levels in city honey to be well below safety limits.
      For next week, please read chapter six, which looks at the history of beekeeping.
