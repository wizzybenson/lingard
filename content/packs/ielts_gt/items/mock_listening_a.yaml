  - id: en-lm-a-p3
    part: part3
    band: 7
    task_type: multiple_choice
    instructions: "Questions 21–24. Choose the correct letter, A, B or C."
    stimulus: |
      F2: Come in, both of you. So, you wanted to talk about your project for the retail management module?
      F1: Yes. We've decided to look at why people in Ashford choose the market over the supermarkets, or why they don't.
      F2: That's a good local topic. How are you planning to collect your data?
      M1: We were going to put a questionnaire online, but we've changed our minds. We think the people who actually use the market are less likely to fill in an online form, so we'll interview shoppers at the market itself.
      F2: Sensible. How many?
      F1: We're aiming for fifty, on two different days, a Wednesday and a Saturday, because the people who shop on Saturdays are very different from the weekday crowd.
      F2: Good. Have you thought about what could go wrong?
      M1: The weather, mainly. If it rains, fewer people come, and nobody wants to stop and talk.
      F1: And some of the stall holders might not like us standing near their stalls, so we wrote to the market manager to ask permission first. She's already replied and said yes, as long as we don't block the walkways.
      F2: Excellent. That's exactly the kind of thing examiners look for. Now, the literature review. What have you read?
      M1: Quite a lot on supermarkets, but there's much less on street markets. The most useful thing was actually a report from the council on the history of the market.
      F2: Make sure you say in your review why there's so little research. That's a finding in itself.
      F1: OK. And what we expect to find is that price matters less than people imagine. When we did a pilot with ten shoppers, most of them talked about freshness and about knowing the stall holders personally.
      M1: Though I think convenience will come up a lot for the supermarkets. You know, late opening, easy parking.
      F2: Then design your questions so that you don't push people towards your own ideas. Who's doing what?
      F1: I'll write the questions, because I ran the pilot. Tom's better with numbers, so he'll do the analysis.
      M1: And we'll both do the interviews, obviously. Lucy's going to write the introduction and the review, and I'll write up the results.
      F2: And the presentation?
      F1: We'll share that.
      F2: Fine. Just remember the deadline has moved. It's the twelfth of December now, not the fifth.
