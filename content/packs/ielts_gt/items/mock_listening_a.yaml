# IELTS General Training Listening, paper A: the official four parts, ten questions each (ielts.org, 2026-10-20).
# Original content written for Lingard. Scripts are rendered by TTS, one voice per tagged speaker (M1, F1, F2…).
# Bands are CLB levels: Part 1 is easiest, Part 4 hardest, as in the real test.
defaults: {pack: ielts_gt, language: en, skill: listening, section: listening, plays: 1}
sets:
  - id: en-lm-a-p1
    part: part1
    band: 5
    task_type: form_completion
    instructions: "Questions 1–6. Complete the form below. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer."
    stimulus: |
      F1: Good morning, Ashford Community Centre, Mia speaking. How can I help?
      M1: Hello. I saw a leaflet about your evening courses, and I'd like to sign up for one if there are still places.
      F1: Certainly. Which course were you interested in?
      M1: The photography one. Digital photography for beginners, I think it's called.
      F1: Yes, that starts next month. Let me take some details. Can I have your surname?
      M1: It's Okafor. O-K-A-F-O-R.
      F1: And your first name?
      M1: Daniel.
      F1: Thank you, Daniel. And your address?
      M1: Flat 3, 27 Mill Lane. That's here in Ashford.
      F1: Twenty-seven Mill Lane. And the postcode?
      M1: A-S-4, 9-T-D.
      F1: Lovely. And the best number to reach you on?
      M1: My mobile is 07700 900 418.
      F1: 07700 900 418. Now, how did you hear about the course?
      M1: A friend of mine told me about it. She did the painting class last year. Oh, and then I saw the leaflet in the library.
      F1: I'll put "friend", then, since that came first. Now, the course runs on Tuesday evenings.
      M1: Tuesday? The leaflet said Thursday.
      F1: It did, but we've had to move it because the main hall is booked on Thursdays now. It's Tuesdays from seven until half past nine.
      M1: That's fine. Tuesdays actually suit me better.
      F1: The fee is ninety-five pounds for the ten weeks, but there's a discount if you're a member of the centre.
      M1: I'm not a member. How much is membership?
      F1: It's twenty pounds a year, and members pay seventy-five for the course.
      M1: So it comes to the same either way. I'll join anyway. I might take another class later in the year.
      F1: Good idea. You'll need to bring a camera. It doesn't have to be expensive. A phone is fine for the first few weeks, but by week four you'll need one where you can change the settings by hand.
      M1: I've got an old camera of my father's. I'll check it still works.
      F1: And please bring a notebook. The tutor, Mr Hale, likes everyone to write down the settings they use.
      M1: OK. Is there anywhere to park?
      F1: There's a small car park behind the building, but it's usually full in the evenings. Most people use the one at the supermarket opposite. It's free after six.
      M1: Great, that's easy. Thanks very much.
