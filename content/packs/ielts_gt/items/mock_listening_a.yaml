    stimulus: |
      F1: Good evening, everyone, and thank you for coming to this meeting about Riverside Park. I'm Helen Marsh, and I've managed the park for the council for the last six years. As most of you know, the park has been closed since March for improvement work, and I'm pleased to say it will reopen on the first of June. That's two weeks later than we'd planned, I'm afraid, because the heavy rain in April held up the work on the paths.
      So what's new? The biggest change, and the one that took most of the budget, is the lake. It's been cleaned and made deeper, and the old wooden bridge has been replaced with a stone one. We had hoped to bring back the rowing boats, but sadly the cost of insurance has made that impossible for now.
      Let me take you round the new plan. You'll come in through the south gate, which is still the main entrance, and you'll be on the main path heading north. The first thing you'll see, on your left, is the new children's playground, in the corner of the park nearest the entrance. Opposite the playground, on the right of the main path, is a new outdoor gym. That was a request from many of you in last year's survey.
      Walk on up the path and you come to the café, which is in the middle of the park, just south of the lake. It's been completely rebuilt. To the left of the café, on the western side of the park, you'll find the toilets, which are now open all day rather than just at weekends.
      Now, at the top of the park there are two areas, one on each side of the lake. On the west side, in the north-west corner, is the wildlife garden, which local schools helped to plant. And across the lake, in the north-east corner, we've put the picnic area, with twelve new tables.
      A few rules have changed. Dogs are now welcome everywhere except the playground and the wildlife garden, but they must be kept on a lead near the lake. Cycling is allowed on the main path only. And barbecues, which I know is a popular question, are still not permitted anywhere in the park, because of the risk of fire.
      Finally, we're looking for volunteers to help in the wildlife garden on Saturday mornings. You don't need any experience. The most important thing is that you can come regularly. If you're interested, please speak to me afterwards, or leave your name at the café.
