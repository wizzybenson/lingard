      - {question: "Spice Route", options: [A, B, C, D, E, F, G], answer: 6, band: 7}
      - {question: "Green Bowl", options: [A, B, C, D, E, F, G], answer: 1, band: 6}
      - {question: "Hartley's Cheeses", options: [A, B, C, D, E, F, G], answer: 0, band: 7}
      - {question: "Ashford College stall", options: [A, B, C, D, E, F, G], answer: 2, band: 6}
