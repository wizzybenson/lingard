# IELTS General Training Listening, paper B (original, written for Lingard). Covers the task types paper A does not:
# note and table completion (Part 1), matching and sentence completion (Part 2), flow-chart completion (Part 3),
# sentence completion and short answers (Part 4). Bands are CLB levels.
defaults: {pack: ielts_gt, language: en, skill: listening, section: listening, plays: 1}
sets:
  - id: en-lm-b-p1
    part: part1
    band: 5
    task_type: note_completion
    instructions: "Questions 1–5. Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer."
    stimulus: |
      M1: Good afternoon, Hillside Van Hire, this is Jack.
      F1: Hi. I'm moving house next month and I need to hire a van for a day. Could you tell me what you've got?
      M1: Of course. When's the move?
      F1: Saturday the fourteenth.
      M1: The fourteenth. And roughly how much are you moving?
      F1: It's a two-bedroom flat, but I haven't got much furniture. A sofa, a bed, a table, and lots of boxes.
      M1: Then I'd suggest the medium van. Most people moving from a two-bedroom place find the small one isn't quite big enough.
      F1: OK. And do I need a special licence?
      M1: No, an ordinary car licence is fine for the small and medium vans. You only need a different licence for the large truck.
      F1: Good. Do you deliver the van, or do I collect it?
      M1: You collect it from our depot on Station Road. We open at half past seven on Saturdays.
      F1: Seven thirty, great. And I can pay when I collect it?
      M1: We take a deposit when you book, and the rest on the day. The deposit is fifty pounds, which you get back when the van is returned undamaged.
      F1: Fine. Can you tell me the prices, then?
      M1: Sure. For a full day, the small van is forty-five pounds, the medium is sixty, and the large truck is ninety-five. Those prices include insurance, but you pay for fuel yourself. We give you the van with a full tank and you return it full.
      F1: And mileage?
      M1: The first hundred miles are free with the small and medium vans. After that it's twenty pence a mile. With the truck, there's no free mileage, I'm afraid.
      F1: That's fine, it's only about thirty miles. Do you hire out anything else? Like trolleys?
      M1: Yes, we've got sack trolleys for eight pounds a day, and we sell boxes in packs of ten for twelve pounds. And blankets to protect the furniture are free if you ask.
      F1: Perfect. I'll take a medium van and a trolley, please. My name's Grace Whitfield.
    questions:
      - {question: "Date of move: Saturday ______", response: text, accepted: [14th, "14", fourteenth], word_limit: 1, band: 4}
      - {question: "Recommended van: the ______ van", response: text, accepted: [medium], word_limit: 1, band: 4}
      - {question: "Licence: an ordinary ______ licence is fine", response: text, accepted: [car], word_limit: 1, band: 5}
      - {question: "Collect the van from the depot on ______ Road", response: text, accepted: [Station], word_limit: 1, band: 5}
      - {question: "Deposit: £______ (returned if no damage)", response: text, accepted: ["50", fifty], word_limit: 1, band: 5}
