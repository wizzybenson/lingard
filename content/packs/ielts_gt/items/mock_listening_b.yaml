  - id: en-lm-b-p3
    part: part3
    band: 7
    task_type: multiple_choice
    instructions: "Questions 21–24. Choose the correct letter, A, B or C."
    stimulus: |
      F2: So, Priya, Sam, how's the presentation on food waste coming along?
      F1: Quite well, I think. We've decided to focus on what happens in restaurants rather than in people's homes.
      F2: Why restaurants?
      M1: Partly because there's already a lot of research on household waste, and partly because Priya works part-time in a restaurant, so we can get real figures.
      F2: That's a real advantage. Have you got permission from the restaurant?
      F1: Yes, the manager's happy for us to use the data, as long as we don't name the restaurant.
      F2: Fine. And how are you going to structure the talk?
      M1: We thought we'd start with a short video, about a minute, showing a week's waste from the kitchen. It's quite shocking.
      F2: Good, but keep it short. Then?
      F1: Then we explain the process we followed. First, we weighed all the food thrown away every night for two weeks. Then we sorted it into three groups: food spoiled before it was cooked, food left over in the kitchen, and food left on customers' plates.
      M1: And the biggest group by far was the food left on plates. Almost half.
      F2: Interesting. So what did you suggest?
      F1: Well, we put that to the manager, and she agreed to try smaller portions, with free extra helpings if people wanted them.
      M1: And she started offering boxes so customers could take leftovers home. We measured again for another two weeks after the changes.
      F2: And the result?
      F1: The waste from plates fell by about a third. The next step, which we'll mention at the end, is to look at the stock ordering, because that's where most of the spoiled food comes from.
      F2: Excellent. One thing: make sure you explain the limits of your study. Two weeks in one restaurant isn't a large sample.
      M1: We know. We'll say that in the conclusion.
