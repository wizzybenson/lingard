  - id: en-lm-b-p2
    part: part2
    band: 6
    task_type: matching
    shuffle: false
    instructions: "Questions 11–15. What does the speaker say about each stall? Choose FIVE answers from the list, A–G. A has won a prize  B is new this year  C is run by students  D only accepts cash  E has a long queue in the evening  F gives free samples  G is moving to a different place"
    stimulus: |
      M1: Good morning and welcome to Ashford Local Radio. I'm here to tell you about this weekend's Ashford Food Festival, which takes over the market square from Friday evening until Sunday afternoon. There are more than forty stalls this year, so I'll just mention a few highlights.
      Let's start with Bayside Bakery. If you've been before, you'll know them for their sourdough, and this year they're giving away free tastings of a new rye loaf, so do stop by.
      Then there's Spice Route, the Indian street food stall. Last year it was right at the back of the square, which a lot of people found a bit hidden, so this year it's been given a spot near the fountain.
      A real first for the festival is the Green Bowl, which serves salads and grain bowls. It's the first time they've taken part, and they're hoping to open a café in town next year.
      I should mention Hartley's Cheeses too. Mr Hartley's blue cheese was named best in the region at the county show in May, so expect a lot of interest.
      And finally, the Ashford College catering stall. All the food is cooked and served by catering students from the college, and the money goes back into their course.
      Now, some practical information. The festival opens at five on Friday, and from nine till five on Saturday and Sunday. Entry is free, but there's a suggested donation of two pounds, which goes to the town's food bank. Most stalls take cards, but a few smaller ones don't, so it's worth bringing some cash.
      Parking in the town centre will be very limited, so the council is running a free park-and-ride bus from the leisure centre every fifteen minutes. And if you're cycling, there's extra bike parking on Church Street.
      For families, there's a children's tent with cooking activities each morning. Places are limited, so you need to sign up at the information point when you arrive. And on Sunday at two o'clock, there's a cooking competition for local chefs, judged by festival visitors, so come along and vote.
    questions:
