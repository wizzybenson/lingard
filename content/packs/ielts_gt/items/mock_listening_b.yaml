  - id: en-lm-b-p4
    part: part4
    band: 8
    task_type: sentence_completion
    instructions: "Questions 31–35. Complete the sentences below. Write ONE WORD ONLY for each answer."
    stimulus: |
      F1: In today's lecture I want to talk about sleep, and in particular about why so many adults in developed countries don't get enough of it.
      Let's begin with how much sleep we actually need. For most adults, the figure is between seven and nine hours a night. But surveys in several countries suggest that around a third of adults regularly sleep less than seven hours. Interestingly, people are often poor judges of their own sleep: when researchers compare what people report with what sleep monitors record, people tend to overestimate how long they sleep.
      Why are we sleeping less? One obvious factor is light. Before electric lighting, people's sleep followed the sun much more closely. Today, bright screens in the evening delay the release of melatonin, the hormone that tells the body it's time to sleep. A second factor is work. Longer commutes and shift work mean many people simply don't have time for eight hours in bed. And a third is what researchers call social jet lag: people go to bed much later at weekends than on weekdays, which confuses the body clock in the same way as flying across time zones.
      What are the consequences? In the short term, lack of sleep affects concentration and mood, and it slows reaction times. Studies of drivers have found that going without sleep for around eighteen hours affects driving about as much as drinking alcohol. In the long term, poor sleep has been linked with weight gain, heart disease and a weaker immune system, although the exact causes are still being studied.
      So what can be done? The advice from sleep scientists is surprisingly simple. The most important thing is regularity: going to bed and getting up at the same time every day, including weekends. The bedroom should be cool, dark and quiet. Caffeine should be avoided in the afternoon, because its effects can last for six hours or more. And if you can't sleep, it's better to get up and do something calm in another room than to lie in bed worrying.
      Some employers have started to take sleep seriously too. A few companies now offer later start times for staff who are naturally late sleepers, and some have introduced quiet rooms where employees can take a short nap. Whether these ideas spread will depend on whether they can be shown to improve productivity.
    questions:
      - {question: "Most adults need between seven and ______ hours of sleep a night.", response: text, accepted: [nine, "9"], word_limit: 1, band: 6}
      - {question: "People tend to ______ how long they sleep.", response: text, accepted: [overestimate], word_limit: 1, band: 8}
      - {question: "Screens in the evening delay the release of a ______ called melatonin.", response: text, accepted: [hormone], word_limit: 1, band: 8}
      - {question: "Different bedtimes at weekends cause social ______ lag.", response: text, accepted: [jet], word_limit: 1, band: 8}
      - {question: "In the short term, lack of sleep slows ______ times.", response: text, accepted: [reaction], word_limit: 1, band: 8}
      - question: "According to sleep scientists, what is the most important thing for good sleep?"
        task_type: short_answer
        instructions: "Questions 36–40. Answer the questions below. Write NO MORE THAN THREE WORDS for each answer."
        response: text
        accepted: [regularity]
        word_limit: 3
        band: 8
