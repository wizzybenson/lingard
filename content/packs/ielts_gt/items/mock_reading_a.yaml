    stimulus: |
      BRIGHTWELL LOGISTICS: ANNUAL LEAVE, A GUIDE FOR NEW STAFF

      Your entitlement
      Full-time staff receive 25 days of paid annual leave each year, in addition to public holidays. Part-time staff receive the same entitlement calculated in proportion to the hours they work. In your first year, leave builds up month by month, so you may not be able to take a long holiday until you have been with us for several months.

      Booking leave
      All requests must be made through the staff portal, not by email or in person. Your line manager will normally reply within five working days. Requests for more than two consecutive weeks need the approval of the operations director as well as your line manager. During our busiest period, from mid-November to the end of December, no more than two people from each team may be on leave at the same time, and requests are dealt with in the order they are received.

      Carrying leave over
      You may carry up to five unused days into the following year, but these must be taken by the end of March. Any days not taken by then will be lost. In exceptional circumstances, such as long-term sickness, your manager may agree to a longer period.

      Buying and selling leave
      Each January, staff can choose to buy up to five extra days of leave, paid for through a small deduction from their monthly salary. It is not possible to sell leave back to the company.
