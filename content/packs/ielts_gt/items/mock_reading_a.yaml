    stimulus: |
      ASHFORD CENTRAL LIBRARY: CHANGES FROM 1 SEPTEMBER

      Opening hours
      From 1 September the library will open at 9 am instead of 10 am from Monday to Friday, following requests from parents who want to visit after taking their children to school. To make this possible, it will close at 7 pm on weekdays, one hour earlier than now. Saturday hours (9 am–5 pm) are unchanged, and the library will remain closed on Sundays.

      Borrowing
      Members will be able to borrow up to fifteen items at a time, an increase from ten. The loan period stays at three weeks. Late fees for children's books have been removed completely; adult members will still pay 25p per item per day.

      Self-service
      Four new self-service machines will be installed by the main entrance. Staff will be on hand to help during the first month. The old machine on the first floor will be removed.

      Study room
      The quiet study room on the second floor will now need to be booked in advance, either online or at the front desk. Bookings are for a maximum of three hours. The room has been fitted with new desks and power sockets.
