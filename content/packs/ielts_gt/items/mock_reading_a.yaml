      WORKING SAFELY IN THE WAREHOUSE

      Everyone who works in or visits the warehouse floor must wear a high-visibility vest and safety boots. Vests are kept in the cupboard next to the security office; boots are issued during your first week, and you should not go onto the floor until you have received them.

      Forklift trucks are the greatest single risk in the building. Pedestrians must stay inside the areas marked with green lines, and must never walk behind a reversing vehicle. If you need to cross a loading bay, wait until the driver has seen you and signalled that it is safe.

      Manual handling causes more injuries in our industry than any other activity. Before lifting anything, check its weight on the label. Items over 20 kg must be lifted by two people or with a trolley. If you have had a back injury in the past, tell your supervisor, who will arrange a short assessment with our occupational health adviser.

      All accidents, however minor, must be recorded in the accident book at the first-aid station. Near misses, where nobody was hurt but someone could have been, should also be reported, using the form on the staff portal. These reports help us to find risks before they cause harm, and nobody will be blamed for reporting honestly.

      Fire alarms are tested every Monday at 10 am. If the alarm sounds at any other time, leave the building by the nearest exit and go to the assembly point in the staff car park. Do not stop to collect personal belongings.
