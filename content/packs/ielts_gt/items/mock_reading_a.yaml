      THE RETURN OF THE NIGHT TRAIN

      A  For much of the twentieth century, the sleeper train was the ordinary way to cross Europe. Business travellers left one capital after dinner and woke up in another in time for breakfast meetings; families spent the first night of their holidays rocking gently through the countryside. By the early 2000s, however, the network was disappearing. Cheap flights, faster daytime trains and the high cost of running carriages that are used only once a day made sleeper services unprofitable, and one operator after another cancelled its routes.

      B  The decline was not simply a matter of passenger numbers. Night trains are expensive in ways that are not obvious to the traveller. A sleeper carriage carries far fewer people than a daytime carriage of the same length, because beds take up more space than seats. Staff must work through the night and are paid accordingly. And because each country charges its own fee for the use of its tracks, a train crossing four borders pays four separate bills, often without any discount for running at night, when the tracks are otherwise empty.

      C  What changed was public opinion about flying. From around 2018, concern about the climate made many travellers in northern and western Europe look for alternatives to short flights. Swedish even gave the world a new word, flygskam, or "flight shame". A night train between two cities a thousand kilometres apart produces only a small fraction of the emissions of the same journey by air, and, crucially, it does not waste a day of the traveller's life, because the journey happens while they sleep.

      D  Operators were quick to notice. Austria's national railway, which had kept some sleeper routes running when others gave up, expanded its network and bought second-hand carriages from operators that had closed. New private companies appeared, promising modern compartments, better food and online booking that was as simple as booking a flight. Several governments, keen to show progress on climate targets, offered subsidies or reduced track charges for night services.

      E  The revival has not been smooth. Second-hand carriages break down; new ones take years to build. Some routes launched with great publicity have been suspended within a year, either because the operator could not find enough reliable rolling stock or because engineering work closed the line at night, which is when most maintenance is done. Passengers have complained of cancelled trains, broken air-conditioning and tickets that cost more than a flight and a hotel combined.

      F  Price remains the central problem. A bed in a shared compartment may be reasonable, but a private cabin for a couple can cost several hundred euros, and airlines can still sell seats very cheaply because aviation fuel is taxed lightly or not at all on international routes. Supporters of night trains argue that the competition is unfair, and that until the true environmental cost of flying is reflected in ticket prices, rail will struggle to compete on cost alone.

      G  Even so, the long-term outlook is more hopeful than it has been for decades. The European Union has set out plans to make cross-border rail easier to book and to remove some of the obstacles created by different national rules. Manufacturers are developing carriages designed specifically for night travel, with more compact private cabins. For the traveller who values time as much as money, and who would rather fall asleep in one city and wake up in another than queue at an airport, the night train may at last have found its moment again.
