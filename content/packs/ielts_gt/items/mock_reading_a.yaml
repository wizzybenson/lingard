    instructions: "Questions 1–7. Look at the six advertisements, A–F. Which advertisement mentions each of the following? Write the correct letter, A–F. You may use any letter more than once."
    stimulus: |
      ASHFORD ADULT LEARNING: EVENING AND WEEKEND CLASSES

      A  Conversational Spanish
      Ten Monday evenings, 7–9 pm, Ashford College, room 12. For people who already know a little Spanish and want to speak with more confidence. £85. Free for anyone receiving Jobseeker's Allowance.

      B  Bread and Pastry
      Six Saturday mornings in the college's training kitchen. All ingredients are provided, and you take home everything you bake. Please tell us about any food allergies when you book. £120.

      C  Introduction to Bookkeeping
      Learn to keep simple accounts for a small business or club. Twelve Wednesday evenings. Students who complete the course and pass a short online test receive a certificate recognised by local employers. £140.

      D  Family Swimming
      Sunday mornings at the Riverside Leisure Centre. Parents and children (ages 4–10) learn together in the small pool. Children must be accompanied at all times. £6 per family per session; no need to book.

      E  Gardening for Beginners
      Eight Thursday afternoons at the community allotments on Hill Road. Wear old clothes and strong shoes. Tools are lent free of charge. Places are limited to ten, so book early. £60.

      F  Digital Skills Drop-in
      Every Tuesday, 10 am–12 noon, Ashford Central Library. Bring your own phone or laptop, or use ours. Help with email, online banking and filling in forms. Free; no booking required.
