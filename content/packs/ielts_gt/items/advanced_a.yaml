# test's range, for learners aiming at the highest bands. Original texts and questions written for Lingard.
defaults: {pack: ielts_gt, language: en}
sets:
  - id: en-adv-r1
    skill: reading
    section: reading
    part: section3
    band: 9
    task_type: multiple_choice
    shuffle: false
    instructions: "Questions 28–34. Choose the correct letter, A, B, C or D."
    stimulus: &reuse |
      SECOND LIVES: THE QUIET RISE OF ADAPTIVE REUSE

      For most of the twentieth century, the fate of an unwanted building was simple: it was demolished and something new was put in its place. Old factories, warehouses and railway stations were seen as obstacles to progress, and their removal was rarely questioned. Today, a growing number of architects, developers and city councils are taking a different view. Rather than starting again, they are adapting existing structures to new uses, a practice known as adaptive reuse.

      The arguments in its favour are partly cultural. Buildings give neighbourhoods their character, and residents often feel a strong attachment to structures they have known all their lives, even when those structures have long stopped serving their original purpose. A disused textile mill converted into flats or a power station turned into a gallery preserves a link with the past that a new building cannot provide.

      Increasingly, however, the most persuasive arguments are environmental. Much of the carbon associated with a building is emitted before anyone moves in, through the manufacture of concrete, steel and glass and the work of construction itself. This "embodied carbon" is already spent in an existing building; demolishing it and building again means spending it a second time. Some studies suggest that a new, highly energy-efficient building may take decades to make up for the emissions caused by its construction, by which time it may itself be approaching the end of its useful life.

      Adaptive reuse is not without its difficulties. Old buildings were designed for purposes very different from their new ones, and converting them can be technically demanding. Floors built to carry heavy machinery may be ideal for offices, but windows placed for industrial lighting may leave parts of a new apartment in permanent shade. Bringing old structures up to modern standards of fire safety, accessibility and insulation can be expensive, and unexpected problems, such as contaminated soil or weakened foundations, are often discovered only once work has begun. Developers frequently complain that these uncertainties make reuse projects harder to finance than new construction, whose costs are easier to predict.

      Regulation has not always helped. In many countries, building codes were written with new construction in mind, and applying them to a nineteenth-century warehouse can be awkward or even impossible. Some cities have responded by introducing more flexible rules for existing buildings, allowing alternative solutions as long as safety is not compromised. Others have gone further, requiring developers to assess whether an existing building could be reused before permission to demolish it is granted.

      Critics warn against treating reuse as a solution in every case. Some buildings are genuinely unsuitable for conversion, and preserving them at great expense may divert resources from projects that would do more good. There is also a risk that converted buildings, with their exposed brick and high ceilings, become fashionable and expensive, contributing to the very rise in housing costs that cities are struggling to control.

      Even so, the direction of change is clear. As governments set targets to reduce emissions from construction, the question asked about an old building is shifting from "Why should we keep it?" to "Why should we knock it down?" For a profession long associated with creating the new, learning to work with what already exists may prove to be one of its most important challenges.
    questions:
      - question: "According to the first paragraph, in the past old industrial buildings were usually"
        options: ["protected as part of a city's history.", "replaced without much debate.", "converted into housing.", "sold to private developers."]
        answer: 1
        band: 8
      - question: "What does the writer say about the cultural case for adaptive reuse?"
        options: ["It matters more than the environmental case.", "It depends on how old a building is.", "It rests on people's emotional connection to familiar buildings.", "It is mainly supported by architects."]
        answer: 2
        band: 9
      - question: "The term \"embodied carbon\" refers to emissions that"
        options: ["a building produces while it is being heated.", "result from producing materials and constructing the building.", "are saved when a building is well insulated.", "are caused by demolishing a building."]
        answer: 1
        band: 9
      - question: "Why might a new energy-efficient building not be the greener choice?"
        options: ["Its efficiency is often exaggerated.", "It may need repairs more frequently.", "Its construction emissions can take decades to offset.", "It usually uses more land than an old building."]
        answer: 2
        band: 10
      - question: "According to developers, reuse projects are harder to finance because"
        options: ["banks prefer modern architecture.", "their final costs are less predictable.", "they take longer to receive permission.", "old buildings are expensive to buy."]
        answer: 1
        band: 9
      - question: "Some cities now require developers to"
        options: ["convert every industrial building they own.", "follow the same rules as for new construction.", "consider reuse before they are allowed to demolish.", "pay a tax on embodied carbon."]
        answer: 2
        band: 9
      - question: "What is the writer's overall view of adaptive reuse?"
        options: ["It should replace new construction entirely.", "It is a passing fashion in architecture.", "It is increasingly important, though not always appropriate.", "Its environmental benefits have been disproved."]
        answer: 2
        band: 10
