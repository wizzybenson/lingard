  - id: en-adv-l1
    skill: listening
    section: listening
    part: part4
    band: 9
    task_type: note_completion
    instructions: "Questions 31–40. Complete the notes below. Write ONE WORD ONLY for each answer."
    stimulus: |
      F1: Good morning. Today's lecture is about something every language does constantly, and which most speakers hardly notice: borrowing words from other languages. Linguists sometimes call these loanwords, and English is famous for having borrowed on an enormous scale.
      Why do languages borrow at all? The most obvious reason is need. When speakers meet a new object or idea, it's often easier to adopt the existing name than to invent one. That's why so many words for foods have travelled with the foods themselves: chocolate, coffee and tea all arrived in English together with the products. A second reason is prestige. If one language is associated with power, learning or fashion, speakers of other languages may borrow its words even when they already have perfectly good ones of their own. For several centuries after 1066, French was the language of the English ruling class, and you can still see the result today. The animals in the field have English names, cow and pig, while the meat on the table has French ones, beef and pork.
      Borrowed words rarely stay exactly as they were. They're usually adapted to the sounds of the new language, and their meanings often shift. Sometimes a word becomes narrower: a general word in the original language comes to describe one particular thing. Sometimes the reverse happens and the meaning broadens.
      Not every borrowing is welcomed. Some countries have official bodies which recommend native alternatives to foreign terms, particularly in technology. These efforts have had mixed success. Ordinary speakers tend to use whatever word they hear most often, and in fields that change fast, the foreign term is frequently established before an alternative can be proposed.
      Is borrowing a threat to a language? Most linguists would say no. A language that borrows heavily can remain perfectly healthy, provided people continue to use it in every area of life. The real danger comes when speakers stop passing a language on to their children, which is a question of social pressure, not of vocabulary.
      Next week we'll look at the opposite process: how languages create new words from their own resources.
    questions:
      - {question: "Borrowed words are also called ______", response: text, accepted: [loanwords, loan-words], word_limit: 1, band: 8}
      - {question: "First reason for borrowing: ______ for a name for something new", response: text, accepted: [need], word_limit: 1, band: 8}
      - {question: "Words for ______ often arrived together with the products", response: text, accepted: [foods, food], word_limit: 1, band: 9}
      - {question: "Second reason: ______ of the other language", response: text, accepted: [prestige], word_limit: 1, band: 9}
      - {question: "After 1066, French was spoken by the ruling ______", response: text, accepted: [class], word_limit: 1, band: 9}
      - {question: "Meat has French names, such as pork and ______", response: text, accepted: [beef], word_limit: 1, band: 9}
      - {question: "Borrowed words are adapted to the ______ of the new language", response: text, accepted: [sounds], word_limit: 1, band: 9}
      - {question: "Some countries' official bodies propose alternatives, especially in ______", response: text, accepted: [technology], word_limit: 1, band: 10}
      - {question: "Speakers tend to use the word they hear most ______", response: text, accepted: [often, frequently], word_limit: 1, band: 10}
      - {question: "The real danger: people no longer pass a language on to their ______", response: text, accepted: [children], word_limit: 1, band: 10}
