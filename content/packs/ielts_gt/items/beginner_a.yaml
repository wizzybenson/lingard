# Beginner practice (CLB 4–5): short everyday notices and messages for learners starting out. They fill section 1 and
# part 1 of a mock, and serve placement and the Phone. Original content written for Lingard.
defaults: {pack: ielts_gt, language: en}
items:
  - {id: en-b-r01, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 4, stimulus: "MILL LANE SURGERY — Flu jabs for over-65s on Saturday 9am–12pm. No appointment needed. Bring your NHS number.", question: "Who can get a flu jab on Saturday morning?", options: ["Anyone with an appointment", "People over 65", "Children under 5", "Surgery staff only"], answer: 1}
  - {id: en-b-r02, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 4, stimulus: "Hi Tom, the boiler man is coming at 2 tomorrow. I'm at work, so please leave the key with Mrs Patel at number 7. Thanks! Ana", question: "What does Ana want Tom to do?", options: ["Repair the boiler", "Give the key to a neighbour", "Call the boiler company", "Stay at home all day"], answer: 1}
  - {id: en-b-r03, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 4, stimulus: "STATION CAR PARK: £4 per day, £15 per week. Pay at the machine or by app. Machines take cards only.", question: "How can you pay at the machine?", options: ["With coins", "With a card", "With notes", "Only with the app"], answer: 1}
  - {id: en-b-r04, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 4, stimulus: "FREE ENGLISH CONVERSATION CLUB — Thursdays 6–7pm, Ashford Library, Room 2. All levels welcome. Tea and biscuits provided.", question: "What do you need to pay for the club?", options: ["£2 a week", "Nothing", "A library card", "The price of tea"], answer: 1}
  - {id: en-b-r05, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 5, stimulus: "Bin collection changes: from 1 June, recycling will be collected every other Tuesday instead of every Friday. General waste is still collected weekly on Fridays.", question: "What changes in June?", options: ["General waste is collected on Tuesdays", "Recycling is collected less often and on a different day", "Bins are collected every day", "Recycling is no longer collected"], answer: 1}
  - {id: en-b-r06, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 5, stimulus: "SALE — 30% off all winter coats this weekend only. Gloves and scarves: buy one, get one free. Not valid with other offers.", question: "What is true about the offer?", options: ["Coats are half price", "You get a free scarf with every coat", "The coat discount lasts only for the weekend", "You can combine it with other offers"], answer: 2}
  - {id: en-b-r07, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 5, stimulus: "Dear residents, the lift will be out of service from Monday to Wednesday for repairs. Please use the stairs. Residents who need help with shopping can call the office on 01233 400200.", question: "Why might a resident call the office?", options: ["To repair the lift", "To get help with shopping", "To complain about the stairs", "To book a parking space"], answer: 1}
  - {id: en-b-r08, skill: reading, section: reading, part: section1, task_type: gt_reading_mcq, band: 5, stimulus: "JOB: Kitchen assistant, Copper Kettle Café. 20 hours a week, mornings. No experience needed — training given. Apply in person with your CV.", question: "How should you apply for this job?", options: ["By email", "By phone", "By going to the café", "Online"], answer: 2}
  - {id: en-b-l01, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 4, stimulus: "Hi, it's Sarah from the letting agency. The viewing of the flat on Mill Lane is now on Thursday at four o'clock, not Wednesday. See you there.", question: "When is the viewing now?", options: ["Wednesday at 4", "Thursday at 4", "Thursday at 2", "Wednesday at 2"], answer: 1}
  - {id: en-b-l02, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 4, stimulus: "Welcome to Ashford Library. Please note that the computer room closes thirty minutes before the library. The library closes at seven tonight.", question: "What time does the computer room close tonight?", options: ["6:00", "6:30", "7:00", "7:30"], answer: 1}
  - {id: en-b-l03, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 4, stimulus: "M1: Can I have a large coffee and a cheese sandwich, please?\nF1: Sorry, we've run out of cheese. We've got ham or egg.\nM1: Egg, then, please.", question: "What does the man order?", options: ["A cheese sandwich", "A ham sandwich", "An egg sandwich", "Only a coffee"], answer: 2}
  - {id: en-b-l04, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 4, stimulus: "This is a message for Mr Ahmed. Your new bank card has been sent to your home address. It should arrive within five working days.", question: "Where will the bank card arrive?", options: ["At the bank", "At his work", "At his home", "At the post office"], answer: 2}
  - {id: en-b-l05, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 5, stimulus: "F1: The swimming lessons are on Mondays and Wednesdays.\nM1: I work late on Mondays. Is there another day?\nF1: There's a Saturday class at ten, but it's for beginners only.\nM1: That's fine, I'm a beginner.", question: "Which class will the man probably take?", options: ["Monday", "Wednesday", "Saturday", "None"], answer: 2}
  - {id: en-b-l06, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 5, stimulus: "Passengers for London, please note that this train will not stop at Maidstone today. If you are travelling to Maidstone, please change at Tonbridge.", question: "What should passengers for Maidstone do?", options: ["Stay on the train", "Change trains at Tonbridge", "Take a bus from London", "Wait for tomorrow's train"], answer: 1}
  - {id: en-b-l07, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 5, stimulus: "Hello, I'm calling from the dentist's. We need to move your check-up because the dentist is ill. Could you come on the twelfth instead of the tenth, same time?", question: "Why is the appointment moving?", options: ["The patient is ill", "The dentist is ill", "The surgery is closed for repairs", "The patient asked for a new date"], answer: 1}
  - {id: en-b-l08, skill: listening, section: listening, part: part1, task_type: listening_mcq, band: 5, stimulus: "F1: How much is a monthly bus pass?\nM1: It's sixty pounds, or forty-five if you're a student.\nF1: I'm not a student, but I'm over sixty.\nM1: Then it's free with a senior card.", question: "How much will the woman pay for the pass?", options: ["£60", "£45", "Nothing", "£15"], answer: 2}
