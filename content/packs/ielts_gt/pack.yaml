id: ielts_gt
name: IELTS General Training
language: en
scale: {type: band, min: 0, max: 9, step: 0.5}
clb_conversion: content/crs/ielts_gt_to_clb.yaml
overall: mean_of_four_rounded_to_half   # IELTS rounds the mean to the nearest half band (.25 up, .75 up)
skills: {listening: listening, reading: reading, writing: writing, speaking: speaking}
sections:
  - id: listening
    skill: listening
    minutes: 30
    transfer_minutes: {paper: 10, computer: 2}
    items: 40
    order: 1
    plays: 1            # each recording is heard once
    parts:              # ielts.org: 4 parts, 10 questions each, of increasing difficulty
      - {id: part1, kind: conversation_everyday, items: 10, task_types: [form_completion, note_completion, table_completion, multiple_choice]}
      - {id: part2, kind: monologue_everyday, items: 10, task_types: [multiple_choice, matching, map_labelling, sentence_completion]}
      - {id: part3, kind: conversation_training, items: 10, task_types: [multiple_choice, multi_choice, matching, sentence_completion, flow_chart_completion]}
      - {id: part4, kind: lecture, items: 10, task_types: [note_completion, sentence_completion, short_answer]}
  - id: reading
    skill: reading
    minutes: 60
    items: 40
    order: 2
    text_types: [notices, advertisements, timetables, workplace_documents, general_interest_article]
    parts:              # ielts.org: 3 sections of increasing difficulty, 2,150–2,375 words in all
      - {id: section1, kind: everyday_short_texts, items: 14, task_types: [true_false_not_given, matching_information, sentence_completion, short_answer]}
      - {id: section2, kind: workplace_texts, items: 13, task_types: [matching_features, note_completion, short_answer, multiple_choice, diagram_label_completion]}
      - {id: section3, kind: general_interest_long_text, items: 13, task_types: [matching_headings, multiple_choice, true_false_not_given, summary_completion]}
  - id: writing
    skill: writing
    minutes: 60
    order: 3
    tasks:
      # ielts.org: "the letter may be personal, semi-formal or formal in style"; the essay may ask the candidate to
      # give an opinion, discuss ideas, or outline a problem and a solution. Advantages/disadvantages and two-part
      # questions are the usual framings of "evaluate and discuss" and get their own prompts.
      - {id: task1_letter, kind: letter, min_words: 150, suggested_minutes: 20, weight: 1,
         rubric: [task_achievement, coherence_cohesion, lexical_resource, grammatical_range_accuracy],
         variants: [personal, semi_formal, formal]}
      - {id: task2_essay, kind: essay, min_words: 250, suggested_minutes: 40, weight: 2,
         rubric: [task_response, coherence_cohesion, lexical_resource, grammatical_range_accuracy],
         variants: [opinion, discussion, advantages_disadvantages, problem_solution, two_part]}
  - id: speaking
    skill: speaking
    minutes: [11, 14]
    order: 4
    parts:
      - {id: interview, minutes: [4, 5]}
      - {id: long_turn, minutes: [3, 4], prep_minutes: 1, talk_minutes: [1, 2]}
      - {id: discussion, minutes: [4, 5]}
    rubric: [fluency_coherence, lexical_resource, grammatical_range_accuracy, pronunciation]
scale_description: "IELTS bands 0–9 in half bands"
scene_alignment: {default: ielts_gt.speaking.interview, persuasive: ielts_gt.speaking.discussion}
sources:
  - {source_url: "https://www.britishcouncil.es/en/exam/ielts/general", as_of: "2026-10-14"}
  - {source_url: "https://www.idp.com/malaysia/ielts/test-format/", as_of: "2026-10-14"}
  - {source_url: "https://takeielts.britishcouncil.org/sites/default/files/ielts_guide_for_teachers.pdf", as_of: "2026-10-14"}
  - {source_url: "https://ielts.org/take-a-test/test-types/ielts-general-training-test/ielts-general-training-format-listening", as_of: "2026-10-20"}
  - {source_url: "https://ielts.org/take-a-test/test-types/ielts-general-training-test/ielts-general-training-format-reading", as_of: "2026-10-20"}
source_url: https://www.britishcouncil.es/en/exam/ielts/general
as_of: "2026-10-14"
