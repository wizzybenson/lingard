# IELTS Speaking practice tasks for mocks (original). Keys are the pack's speaking part ids.
# interview: Part 1 (4–5 min) familiar topics; long_turn: Part 2 cue card (1 min to prepare, 1–2 min to talk);
# discussion: Part 3 (4–5 min) abstract questions linked to the Part 2 topic.
# Each task is played live with the examiner: "facts" are all she may state, "tactics" tell her how to run the part.
examiner: {npc_key: examiner_ruth, location_key: ashford.station_quarter.test_centre}
interview:
  - prompt: "Part 1. The examiner will ask you about where you live and about your free time. Answer naturally and give some detail."
    targets: [en.func.express_preference]
    tactics:
      - "You are the IELTS speaking examiner running Part 1. Ask these questions one at a time, in order, with only a brief neutral acknowledgement between them, and never give your own opinion: Do you live in a house or a flat? What do you like most about your neighbourhood? Is there anything you would change about it? What do you usually do at weekends? Do you prefer spending free time alone or with other people? Why?"
    facts:
      - "This is Part 1 of the IELTS speaking test."
      - "Part 1 lasts about four to five minutes."
  - prompt: "Part 1. The examiner will ask you about your work or studies and about food. Answer naturally and give some detail."
    targets: [en.func.express_preference]
    tactics:
      - "You are the IELTS speaking examiner running Part 1. Ask these questions one at a time, in order, with only a brief neutral acknowledgement between them, and never give your own opinion: Do you work or are you a student? Why did you choose this work or subject? What is the most difficult part of it? What kind of food do you enjoy? Do you often cook at home? Has your diet changed since you were a child?"
    facts:
      - "This is Part 1 of the IELTS speaking test."
      - "Part 1 lasts about four to five minutes."
  - prompt: "Part 1. The examiner will ask you about transport and the weather. Answer naturally and give some detail."
    targets: [en.func.express_preference]
    tactics:
      - "You are the IELTS speaking examiner running Part 1. Ask these questions one at a time, in order, with only a brief neutral acknowledgement between them, and never give your own opinion: How do you usually travel around your town? Is public transport good where you live? What's your favourite kind of weather? Does the weather affect your mood?"
    facts:
      - "This is Part 1 of the IELTS speaking test."
      - "Part 1 lasts about four to five minutes."
long_turn:
  - prompt: "Part 2. Describe a time when you helped someone. You should say: who you helped, what the situation was, how you helped them, and explain how you felt about helping this person. You have one minute to prepare, then talk for one to two minutes."
    targets: [en.func.narrate_past]
    tactics:
      - "You are the IELTS speaking examiner running Part 2. Say that the candidate has one minute to prepare and should start when ready, then let them speak for up to two minutes without interrupting. When they stop, ask one short rounding-off question: Do you often help people like this?"
    facts:
      - "This is Part 2 of the IELTS speaking test."
      - "The candidate has one minute to prepare and should speak for one to two minutes."
  - prompt: "Part 2. Describe a skill you would like to learn. You should say: what the skill is, why you want to learn it, how you would learn it, and explain how it would change your life. You have one minute to prepare, then talk for one to two minutes."
    targets: [en.func.describe_person_place]
    tactics:
      - "You are the IELTS speaking examiner running Part 2. Say that the candidate has one minute to prepare and should start when ready, then let them speak for up to two minutes without interrupting. When they stop, ask one short rounding-off question: Is this skill popular where you live?"
    facts:
      - "This is Part 2 of the IELTS speaking test."
      - "The candidate has one minute to prepare and should speak for one to two minutes."
  - prompt: "Part 2. Describe a place in your town where people like to meet. You should say: where it is, what it looks like, what people do there, and explain why it is popular. You have one minute to prepare, then talk for one to two minutes."
    targets: [en.func.describe_person_place]
    tactics:
      - "You are the IELTS speaking examiner running Part 2. Say that the candidate has one minute to prepare and should start when ready, then let them speak for up to two minutes without interrupting. When they stop, ask one short rounding-off question: Do you go there often yourself?"
    facts:
      - "This is Part 2 of the IELTS speaking test."
      - "The candidate has one minute to prepare and should speak for one to two minutes."
discussion:
  - prompt: "Part 3. The examiner will discuss helping others with you. Give reasons and examples for your views."
    targets: [en.func.express_opinion]
    tactics:
      - "You are the IELTS speaking examiner running Part 3. Ask these questions one at a time and follow up once on each answer (why? can you give an example? is that always true?), never giving your own opinion: Why do some people volunteer more than others? Should schools require students to do community work? How has technology changed the way people help each other?"
    facts:
      - "This is Part 3 of the IELTS speaking test."
      - "Part 3 lasts about four to five minutes."
  - prompt: "Part 3. The examiner will discuss learning new skills with you. Give reasons and examples for your views."
    targets: [en.func.express_opinion]
    tactics:
      - "You are the IELTS speaking examiner running Part 3. Ask these questions one at a time and follow up once on each answer (why? can you give an example? is that always true?), never giving your own opinion: Is it easier for children or adults to learn something new? Will people need to change careers more often in the future? What role should employers play in training workers?"
    facts:
      - "This is Part 3 of the IELTS speaking test."
      - "Part 3 lasts about four to five minutes."
  - prompt: "Part 3. The examiner will discuss public spaces with you. Give reasons and examples for your views."
    targets: [en.func.express_opinion]
    tactics:
      - "You are the IELTS speaking examiner running Part 3. Ask these questions one at a time and follow up once on each answer (why? can you give an example? is that always true?), never giving your own opinion: Why are public spaces important in a city? Who should pay for parks and squares? How might town centres change in the next twenty years?"
    facts:
      - "This is Part 3 of the IELTS speaking test."
      - "Part 3 lasts about four to five minutes."
