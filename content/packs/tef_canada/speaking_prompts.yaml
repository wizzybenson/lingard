# Sujets d'expression orale pour les examens blancs (originaux). Clés : identifiants des sections du pack.
# section_a (5 min) : obtenir des renseignements à partir d'un document, en posant une dizaine de questions.
# section_b (10 min) : présenter un document à un ami et le convaincre, en répondant à ses objections.
section_a:
  - "Vous avez lu cette annonce : « Club de randonnée de Rivemont — sorties tous les dimanches, tous niveaux, renseignements au 418 555 0144. » Vous téléphonez pour obtenir des renseignements (niveau, horaires, prix, équipement, transport…). Posez une dizaine de questions."
  - "Vous avez vu cette affiche : « Cours de français du soir pour adultes — inscriptions ouvertes au Centre communautaire Saint-Roch. » Vous appelez pour en savoir plus (dates, durée, niveau, coût, certificat…). Posez une dizaine de questions."
  - "Vous lisez cette petite annonce : « Chambre à louer dans grand appartement près du Vieux-Port, idéal pour étudiant ou jeune travailleur. » Vous appelez le propriétaire pour vous renseigner (loyer, charges, colocataires, règles, date de disponibilité…). Posez une dizaine de questions."
section_b:
  - "Vous avez lu cette annonce : « Devenez bénévole au festival d'été de Rivemont : trois jours de musique, accès gratuit aux concerts pour les bénévoles. » Vous présentez cette offre à un ami et vous essayez de le convaincre de s'inscrire avec vous. Il n'est pas convaincu : répondez à ses objections."
  - "Vous avez lu cet article : « Les jardins communautaires : cultiver ses légumes en ville, une parcelle pour 30 $ par saison. » Vous présentez ce projet à un ami et vous essayez de le convaincre de prendre une parcelle avec vous. Il hésite : répondez à ses objections."
  - "Vous avez lu cette publicité : « Abonnement annuel au transport en commun : 20 % de rabais pour les inscriptions avant le 31 août. » Vous présentez cette offre à un ami qui va au travail en voiture et vous essayez de le convaincre de changer ses habitudes. Il n'est pas d'accord : répondez à ses objections."
