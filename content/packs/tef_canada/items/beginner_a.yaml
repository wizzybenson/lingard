# Pour débuter (NCLC 4–5) : documents et messages courts de la vie quotidienne. Ils servent aux examens blancs
# (documents, messages), au test de placement et au téléphone. Contenu original écrit pour Lingard.
defaults: {pack: tef_canada, language: fr}
items:
  - {id: fr-b-ce01, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 4, stimulus: "PISCINE MUNICIPALE — Bain libre : lundi, mercredi et vendredi de 18 h à 20 h. Bonnet obligatoire.", question: "Que faut-il apporter à la piscine ?", options: ["Une serviette", "Un bonnet de bain", "Une carte de crédit", "Des lunettes"], answer: 1}
  - {id: fr-b-ce02, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 4, stimulus: "Coucou Samir ! Je finis le travail à 17 h. On se retrouve devant le cinéma à 18 h ? Apporte les billets ! Nadia", question: "Qu'est-ce que Samir doit apporter ?", options: ["Les billets", "Le repas", "Un parapluie", "De l'argent"], answer: 0}
  - {id: fr-b-ce03, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 4, stimulus: "ÉPICERIE CHEZ PAUL — Livraison gratuite à partir de 50 $ d'achat. Commandes par téléphone avant midi.", question: "Quand la livraison est-elle gratuite ?", options: ["Toujours", "Le matin seulement", "À partir de 50 $ d'achat", "Le dimanche"], answer: 2}
  - {id: fr-b-ce04, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 4, stimulus: "Avis : le bureau de poste de la rue Saint-Jean sera fermé du 24 au 26 décembre. Réouverture le 27 à 9 h.", question: "Quand le bureau de poste rouvre-t-il ?", options: ["Le 24 décembre", "Le 26 décembre", "Le 27 décembre", "Le 1er janvier"], answer: 2}
  - {id: fr-b-ce05, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 5, stimulus: "Chers parents, la sortie au musée prévue vendredi est reportée à cause de la tempête. Les élèves auront classe normalement. Une nouvelle date vous sera communiquée.", question: "Que se passera-t-il vendredi ?", options: ["Les élèves iront au musée", "L'école sera fermée", "Les élèves auront cours comme d'habitude", "Les parents viendront à l'école"], answer: 2}
  - {id: fr-b-ce06, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 5, stimulus: "À louer : 4 et demi, rue des Remparts, chauffé, éclairé, près du métro. Animaux non acceptés. Libre le 1er juillet.", question: "Qu'est-ce qui est inclus dans le loyer ?", options: ["L'électricité et le chauffage", "Le stationnement", "Internet", "Les meubles"], answer: 0}
  - {id: fr-b-ce07, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 5, stimulus: "Bonjour Madame Diallo, votre colis n'a pas pu être livré car vous étiez absente. Vous pouvez le récupérer au comptoir postal de la pharmacie, avec une pièce d'identité, à partir de demain.", question: "Que doit faire Madame Diallo ?", options: ["Attendre une nouvelle livraison", "Aller chercher le colis avec une pièce d'identité", "Appeler la pharmacie", "Payer des frais de livraison"], answer: 1}
  - {id: fr-b-ce08, skill: reading, section: comprehension_ecrite, part: ce_documents, task_type: ce_document, band: 5, stimulus: "Offre d'emploi : aide-cuisinier, Café du Quai. 25 heures par semaine, de jour. Formation offerte. Présentez-vous avec votre CV, du lundi au vendredi, entre 14 h et 16 h.", question: "Comment faut-il postuler ?", options: ["Par courriel", "En ligne", "En se présentant au café avec son CV", "Par téléphone"], answer: 2}
  - {id: fr-b-co01, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 4, stimulus: "Bonjour, c'est Julie du garage. Votre voiture est prête. Vous pouvez venir la chercher demain matin, à partir de huit heures.", question: "Quand la personne peut-elle aller chercher sa voiture ?", options: ["Ce soir", "Demain matin", "Demain soir", "La semaine prochaine"], answer: 1}
  - {id: fr-b-co02, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 4, stimulus: "Attention s'il vous plaît : le magasin fermera dans quinze minutes. Merci de vous diriger vers les caisses.", question: "Que doivent faire les clients ?", options: ["Revenir demain", "Aller payer bientôt", "Attendre à l'entrée", "Appeler un employé"], answer: 1}
  - {id: fr-b-co03, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 4, stimulus: "Salut, c'est Marc. Je suis désolé, je ne peux pas venir au match ce soir, je suis malade. On se voit samedi ?", question: "Pourquoi Marc appelle-t-il ?", options: ["Pour acheter des billets", "Pour annuler une sortie", "Pour inviter quelqu'un au restaurant", "Pour demander un rendez-vous chez le médecin"], answer: 1}
  - {id: fr-b-co04, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 4, stimulus: "Bonjour, ici la clinique. Votre rendez-vous de lundi est déplacé à mardi, même heure. Merci de nous rappeler si ce n'est pas possible.", question: "Quel est le nouveau jour du rendez-vous ?", options: ["Lundi", "Mardi", "Mercredi", "Jeudi"], answer: 1}
  - {id: fr-b-co05, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 5, stimulus: "Mesdames et messieurs, en raison de travaux, la ligne verte du métro est interrompue entre les stations Vieux-Port et Saint-Roch. Des autobus vous attendent à la sortie.", question: "Comment les passagers peuvent-ils continuer leur trajet ?", options: ["À pied", "En taxi", "En autobus", "Par une autre ligne de métro"], answer: 2}
  - {id: fr-b-co06, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 5, stimulus: "Bonjour Monsieur Tremblay, c'est l'agence de location. Le propriétaire accepte votre demande, mais il faudrait signer le bail avant vendredi. Pouvez-vous passer au bureau jeudi ?", question: "Que doit faire Monsieur Tremblay ?", options: ["Payer le loyer jeudi", "Passer signer le bail avant vendredi", "Visiter un autre appartement", "Rappeler le propriétaire"], answer: 1}
  - {id: fr-b-co07, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 5, stimulus: "F1 : Bonjour, je voudrais m'inscrire au cours de cuisine du jeudi.\nM1 : Désolé, il est complet. Mais il reste des places le mardi soir.\nF1 : Le mardi, ça me va.", question: "Quel cours la femme va-t-elle suivre ?", options: ["Le jeudi", "Le mardi", "Le samedi", "Aucun"], answer: 1}
  - {id: fr-b-co08, skill: listening, section: comprehension_orale, part: co_messages, task_type: co_document, band: 5, stimulus: "Bonjour, ici la bibliothèque. Le livre que vous avez réservé est arrivé. Il sera gardé pour vous pendant sept jours à l'accueil.", question: "Combien de temps le livre sera-t-il gardé ?", options: ["Trois jours", "Cinq jours", "Une semaine", "Un mois"], answer: 2}
