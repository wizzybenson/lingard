# TEF Canada, compréhension écrite, épreuve A : 40 questions, 60 minutes, QCM (le français des affaires, 2026-10-20).
# Activités depuis décembre 2023 : documents du quotidien, phrases et textes lacunaires, lecture rapide de textes courts
# et de graphiques, articles de presse. Contenu original écrit pour Lingard. Niveaux : NCLC.
defaults: {pack: tef_canada, language: fr, skill: reading, section: comprehension_ecrite}
