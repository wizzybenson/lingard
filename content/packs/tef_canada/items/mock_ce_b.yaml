  - id: fr-cem-b-a1
    part: ce_articles
    task_type: article_detail
    band: 7
    stimulus: |
      DES AÎNÉS ET DES ÉTUDIANTS SOUS LE MÊME TOIT

      Depuis l'automne, une quinzaine d'étudiants de l'université de Rivemont vivent chez des personnes âgées. Le principe de ce programme d'habitation intergénérationnelle : l'étudiant obtient une chambre à un loyer très réduit, en échange d'une présence le soir et de petits services, comme faire les courses ou aider à utiliser une tablette.

      « Je cherchais un logement abordable près du campus, et je me retrouve avec une grand-mère d'adoption », raconte Samuel, 22 ans, qui partage la maison de Mme Fortin, 81 ans. Celle-ci souligne surtout la sécurité : « Je dors mieux en sachant qu'il y a quelqu'un dans la maison. »

      Les jumelages sont préparés avec soin par un organisme communautaire, qui rencontre chaque candidat et vérifie ses références. Les deux parties signent une entente qui précise les attentes de chacun : heures de présence, partage de la cuisine, visites. Selon la coordonnatrice, ce cadre est la clé du succès : « Les malentendus viennent presque toujours d'attentes qui n'ont pas été dites. »

      Le programme a ses limites. Il ne remplace pas les soins à domicile, et les étudiants ne sont pas des aidants professionnels. Mais devant la crise du logement et l'isolement de nombreux aînés, ses responsables espèrent doubler le nombre de jumelages l'an prochain.
    questions:
      - question: "Que reçoivent les étudiants dans ce programme ?"
        options: ["Un salaire", "Un logement à faible coût", "Des cours gratuits", "Une bourse d'études"]
        answer: 1
        band: 6
      - question: "Pour Mme Fortin, le principal avantage est…"
        options: ["l'argent du loyer.", "l'aide pour le ménage.", "le sentiment de sécurité.", "la compagnie pour sortir."]
        answer: 2
      - question: "Quel est le rôle de l'organisme communautaire ?"
        options: ["Payer les loyers", "Préparer et encadrer les jumelages", "Former les étudiants aux soins", "Construire des logements"]
        answer: 1
      - question: "Selon la coordonnatrice, la plupart des problèmes viennent…"
        options: ["du manque d'argent.", "de la différence d'âge.", "d'attentes non exprimées.", "du bruit des étudiants."]
        answer: 2
        band: 8
      - question: "Quelle limite du programme l'article mentionne-t-il ?"
        options: ["Il coûte trop cher à la Ville", "Il ne remplace pas les soins professionnels", "Il est réservé aux étudiants étrangers", "Il n'existe qu'en été"]
        answer: 1
        band: 8
  - id: fr-cem-b-a2
    part: ce_articles
    task_type: article_opinion
    band: 8
    stimulus: |
      FAUT-IL INTERDIRE LES TÉLÉPHONES À L'ÉCOLE ?

      Plusieurs provinces ont interdit les téléphones cellulaires en classe, et les premiers bilans semblent encourageants : les enseignants décrivent des élèves plus attentifs et des récréations plus animées. Il faut toutefois se garder de conclure trop vite. Ces impressions, aussi sincères soient-elles, ne remplacent pas des études rigoureuses, et celles-ci sont encore rares.

      Les opposants à l'interdiction rappellent que le téléphone peut aussi être un outil pédagogique : dictionnaire, calculatrice, appareil photo pour une sortie scientifique. Ils craignent surtout qu'on traite le symptôme plutôt que la cause. Si les jeunes passent trop de temps devant leurs écrans, c'est d'abord en dehors de l'école que cela se joue, à la maison, le soir et la nuit.

      À mon sens, l'interdiction en classe est une mesure raisonnable, à condition qu'on ne s'arrête pas là. Apprendre aux élèves à gérer leur attention et à se méfier des applications conçues pour les rendre dépendants serait bien plus utile à long terme que de confisquer des appareils. L'école ne peut pas tout, mais elle peut au moins donner aux jeunes les moyens de comprendre ce qui se passe dans leur poche.
    questions:
      - question: "Selon l'auteur, les premiers résultats de l'interdiction…"
        options: ["sont prouvés scientifiquement.", "semblent positifs mais restent à confirmer.", "sont décevants.", "sont inconnus."]
        answer: 1
      - question: "Quel argument les opposants avancent-ils ?"
        options: ["Le téléphone peut servir à apprendre", "Les élèves n'utilisent pas leur téléphone en classe", "L'interdiction coûte trop cher", "Les parents sont contre"]
        answer: 0
        band: 7
      - question: "D'après les opposants, le problème principal se situe…"
        options: ["en classe.", "pendant les récréations.", "en dehors de l'école.", "dans les transports."]
        answer: 2
      - question: "Quelle est la position de l'auteur ?"
        options: ["Il rejette l'interdiction.", "Il l'approuve, mais la juge insuffisante.", "Il veut interdire les téléphones aussi à la maison.", "Il n'a pas d'opinion."]
        answer: 1
        task_type: article_inference
        band: 9
      - question: "Que propose l'auteur en plus de l'interdiction ?"
        options: ["Confisquer les téléphones le soir", "Enseigner aux jeunes à gérer leur attention", "Offrir des tablettes aux élèves", "Punir les parents"]
        answer: 1
        task_type: article_inference
        band: 8
  - id: fr-cem-b-a3
    part: ce_articles
    task_type: article_inference
    band: 9
    stimulus: |
      LA SECONDE VIE DES OBJETS

      Il y a dix ans, le café de réparation du quartier Saint-Roch ne comptait que quatre bénévoles et une table pliante. Aujourd'hui, il accueille chaque samedi une centaine de visiteurs venus faire réparer un grille-pain, une lampe ou un pantalon décousu. On n'y paie rien ; on y apprend surtout à réparer soi-même, sous l'œil d'un bénévole.

      Derrière cette réussite se cache une critique de notre mode de consommation. Beaucoup d'appareils sont conçus de telle façon qu'il est presque impossible de les ouvrir, et les pièces de rechange, quand elles existent, coûtent parfois plus cher qu'un appareil neuf. Les bénévoles constatent que les objets anciens sont souvent plus faciles à réparer que les récents.

      Les choses commencent pourtant à bouger. Une loi adoptée récemment oblige les fabricants à rendre disponibles les pièces et les manuels de réparation pendant plusieurs années. Les associations saluent ce progrès, tout en soulignant que la loi ne s'applique qu'à certains produits et que les contrôles restent limités.

      Pour les fondateurs du café, l'enjeu dépasse l'environnement. « Quand quelqu'un répare lui-même sa lampe, il repart avec plus qu'un objet qui fonctionne : il repart avec la confiance qu'il peut comprendre les choses qui l'entourent. »
    questions:
      - question: "Comment le café de réparation a-t-il évolué ?"
        options: ["Il a fermé faute de bénévoles", "Il est devenu payant", "Il accueille beaucoup plus de monde", "Il ne répare plus que des vêtements"]
        answer: 2
        band: 7
      - question: "Selon les bénévoles, les objets récents…"
        options: ["sont plus solides.", "sont souvent plus difficiles à réparer.", "ont des pièces bon marché.", "ne tombent jamais en panne."]
        answer: 1
        band: 8
      - question: "Quelle réserve les associations expriment-elles au sujet de la nouvelle loi ?"
        options: ["Elle est trop sévère pour les fabricants", "Elle ne vise pas tous les produits", "Elle interdit les cafés de réparation", "Elle n'est pas encore votée"]
        answer: 1
        band: 9
      - question: "Pour les fondateurs, le plus important est…"
        options: ["d'économiser de l'argent.", "de protéger l'environnement seulement.", "de redonner confiance aux gens dans leurs capacités.", "de vendre des objets réparés."]
        answer: 2
        band: 9
