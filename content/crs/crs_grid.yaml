# Express Entry Comprehensive Ranking System. Keys: with_spouse / single.
source_url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/check-score/crs-criteria.html
as_of: "2026-06-22"
verified_at: "2026-10-14"
notes:
  - Arranged-employment points were removed on 2025-03-25.
  - Lingard shows this only as a simulated score for motivation; not an official assessment.

