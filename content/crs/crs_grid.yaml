education:  # [with_spouse, single]
  less_than_secondary: [0, 0]
  secondary: [28, 30]
  one_year_post_secondary: [84, 90]
  two_year_post_secondary: [91, 98]
  bachelors: [112, 120]
  two_or_more: [119, 128]
  masters: [126, 135]
