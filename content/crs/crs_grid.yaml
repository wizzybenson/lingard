  - {min_clb: 7, points: [3, 3]}
  - {min_clb: 5, points: [1, 1]}
second_language_cap: [22, 24]

canadian_work_years:  # years → [with_spouse, single]; 5 means 5 or more
  0: [0, 0]
  1: [35, 40]
  2: [46, 53]
  3: [56, 64]
  4: [63, 72]
  5: [70, 80]

spouse:
  education: {less_than_secondary: 0, secondary: 2, one_year_post_secondary: 6, two_year_post_secondary: 7, bachelors: 8, two_or_more: 9, masters: 10, phd: 10}
  language_per_ability:
    - {min_clb: 9, points: 5}
    - {min_clb: 7, points: 3}
    - {min_clb: 5, points: 1}
  canadian_work_years: {0: 0, 1: 5, 2: 7, 3: 8, 4: 9, 5: 10}

transferability:
  cap: 100
  education_tier:  # education → tier (0 none, 1 one-year+, 2 two-or-more/masters/phd)
    less_than_secondary: 0
    secondary: 0
    one_year_post_secondary: 1
    two_year_post_secondary: 1
    bachelors: 1
    two_or_more: 2
    masters: 2
    phd: 2
  education_language: {tier1: [13, 25], tier2: [25, 50]}        # [CLB7+ some<9, CLB9+ all]
  education_canadian_work: {tier1: [13, 25], tier2: [25, 50]}   # [1 yr, 2+ yrs]
  foreign_work_language: {one_to_two: [13, 25], three_plus: [25, 50]}
  foreign_work_canadian_work: {one_to_two: [13, 25], three_plus: [25, 50]}
  certificate_language: {clb5_some_under7: 25, clb7_all: 50}
  pair_cap: 50

additional:
  sibling: 15
  french_nclc7_english_clb4_or_less: 25
  french_nclc7_english_clb5_plus: 50
  canadian_education_one_two_years: 15
  canadian_education_three_plus_years: 30
  provincial_nomination: 600
  cap: 600
