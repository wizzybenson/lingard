# Rivemont: a fictional francophone city in Canada. All names, places and stories are original.
key: rivemont
name: Rivemont
language: fr
locale: fr-FR
country: Canada
school: École du Vieux-Port
palette: {sky: ["#f6d7b0", "#8fb8de"], far: "#6d8fb3", mid: "#b5835a", near: "#5b4636", water: "#3e6f97"}
districts:
  - key: rivemont.vieux_port
    name: Le Vieux-Port
    min_band: 1
    order: 1
    description: Le quartier d'arrivée, entre le fleuve et la vieille ville ; on y loue son premier logement.
    locations:
      - key: rivemont.vieux_port.apartment_3b
        name: Appartement 3B, 14 rue des Remparts
        description: Un deux-pièces lumineux au troisième étage, avec une petite fissure dans le mur du salon.
        x: 0.22
        y: 0.38
        layer_art: [rivemont/vieux_port/apartment_bg.png, rivemont/vieux_port/apartment_mid.png]
        hotspots:
          - {key: martin, kind: npc, label: Martin Lefebvre, npc_key: landlord_martin, x: 0.6, y: 0.55}
          - {key: crack, kind: object, label: La fissure, x: 0.3, y: 0.4, text: "Une fissure fine d'environ vingt centimètres."}
          - {key: lease, kind: object, label: Le bail, x: 0.75, y: 0.7, text: "Bail du 1er octobre au 30 septembre. Dépôt : 900 $."}
      - key: rivemont.vieux_port.cafe_quai
        name: Café du Quai
        description: Un petit café face au fleuve, tenu par Chloé depuis dix ans.
        x: 0.55
        y: 0.62
        layer_art: [rivemont/vieux_port/cafe_bg.png, rivemont/vieux_port/cafe_mid.png]
        hotspots:
          - {key: chloe, kind: npc, label: Chloé Gagnon, npc_key: cafe_chloe, x: 0.45, y: 0.5}
          - {key: menu, kind: sign, label: Le menu, x: 0.8, y: 0.3, text: "Café 3,25 $ · Croissant 2,75 $ · Soupe du jour 6,50 $"}
          - {key: notice_board, kind: sign, label: Tableau d'affichage, x: 0.15, y: 0.35, text: "Cherche colocataire, quartier Saint-Roch. Cours de français du soir à l'École du Vieux-Port."}
      - key: rivemont.vieux_port.banque
        name: Caisse populaire du Vieux-Port
        description: Une agence bancaire de quartier où l'on ouvre son premier compte canadien.
        x: 0.78
        y: 0.3
        layer_art: [rivemont/vieux_port/bank_bg.png, rivemont/vieux_port/bank_mid.png]
        hotspots:
          - {key: karim, kind: npc, label: Karim Benali, npc_key: bank_karim, x: 0.5, y: 0.52}
          - {key: brochure, kind: sign, label: Brochure, x: 0.2, y: 0.6, text: "Compte nouvel arrivant : aucuns frais mensuels pendant un an."}
  - key: rivemont.saint_roch
    name: Saint-Roch
    min_band: 6
    order: 2
    description: "Le quartier des commerces et du travail : on y cherche un emploi, un médecin et de quoi réparer."
    locations:
      - key: rivemont.saint_roch.centre_emploi
        name: Centre d'emploi Saint-Roch
        description: Un bureau au rez-de-chaussée, plein de dépliants, où l'on prépare son CV et ses entrevues.
        x: 0.25
        y: 0.45
        layer_art: [rivemont/saint_roch/emploi_bg.png, rivemont/saint_roch/emploi_mid.png]
        hotspots:
          - {key: nadia, kind: npc, label: Nadia Tremblay, npc_key: conseillere_nadia, x: 0.55, y: 0.5}
          - {key: offres, kind: sign, label: Offres de la semaine, x: 0.2, y: 0.3, text: "Commis d'épicerie (temps partiel) · Réceptionniste bilingue · Aide-cuisinier. Entrevues le jeudi."}
          - {key: atelier, kind: sign, label: Atelier CV, x: 0.8, y: 0.35, text: "Atelier CV : mardi 14 h, gratuit, sur inscription."}
      - key: rivemont.saint_roch.clinique
        name: Clinique médicale Saint-Roch
        description: Une clinique de quartier avec une salle d'attente toujours pleine le matin.
        x: 0.6
        y: 0.3
        layer_art: [rivemont/saint_roch/clinique_bg.png, rivemont/saint_roch/clinique_mid.png]
        hotspots:
          - {key: julien, kind: npc, label: Julien Roy, npc_key: receptionniste_julien, x: 0.5, y: 0.55}
          - {key: affiche, kind: sign, label: Affiche, x: 0.2, y: 0.35, text: "Sans rendez-vous : de 8 h à 11 h. Apportez votre carte d'assurance maladie."}
      - key: rivemont.saint_roch.quincaillerie
        name: Quincaillerie Bouchard
        description: Une vieille quincaillerie familiale où l'on trouve de tout, des vis aux conseils.
        x: 0.8
        y: 0.6
        layer_art: [rivemont/saint_roch/quincaillerie_bg.png, rivemont/saint_roch/quincaillerie_mid.png]
        hotspots:
          - {key: denis, kind: npc, label: Denis Bouchard, npc_key: quincaillier_denis, x: 0.45, y: 0.5}
          - {key: location, kind: sign, label: Location d'outils, x: 0.75, y: 0.3, text: "Location à la journée : perceuse 15 $, échelle 10 $."}
          - {key: enduit, kind: object, label: Enduit de rebouchage, x: 0.25, y: 0.65, text: "Pot d'enduit de rebouchage, 12 $ : pour les petites fissures."}
  - key: rivemont.haute_ville
    name: La Haute-Ville
    min_band: 8
    order: 3
    description: "Le quartier civique, sur la colline : on y défend ses idées, on y lit le journal et on y règle ses démarches."
    locations:
      - key: rivemont.haute_ville.hotel_de_ville
        name: Hôtel de ville de Rivemont
        description: Un grand bâtiment de pierre où se tiennent les consultations publiques et les démarches administratives.
        x: 0.3
        y: 0.35
        layer_art: [rivemont/haute_ville/hotel_de_ville_bg.png, rivemont/haute_ville/hotel_de_ville_mid.png]
        hotspots:
          - {key: sophie, kind: npc, label: Sophie Lavoie, npc_key: fonctionnaire_sophie, x: 0.5, y: 0.55}
          - {key: consultation, kind: sign, label: Avis de consultation, x: 0.2, y: 0.3, text: "Consultation publique : projet de piste cyclable rue des Remparts. Mardi 19 h, salle du conseil."}
      - key: rivemont.haute_ville.bibliotheque
        name: Bibliothèque Gabrielle-Roy
        description: La bibliothèque municipale, avec une salle où se tient chaque mois un débat citoyen.
        x: 0.62
        y: 0.55
        layer_art: [rivemont/haute_ville/bibliotheque_bg.png, rivemont/haute_ville/bibliotheque_mid.png]
        hotspots:
          - {key: antoine, kind: npc, label: Antoine Girard, npc_key: bibliothecaire_antoine, x: 0.45, y: 0.5}
          - {key: debat, kind: sign, label: Débat du mois, x: 0.78, y: 0.3, text: "Débat citoyen : faut-il limiter les loyers dans le Vieux-Port ? Premier jeudi du mois, 18 h 30."}
      - key: rivemont.haute_ville.echo
        name: Rédaction de L'Écho de Rivemont
        description: Les bureaux du journal local, encombrés de piles de journaux et de tasses de café.
        x: 0.82
        y: 0.3
        layer_art: [rivemont/haute_ville/echo_bg.png, rivemont/haute_ville/echo_mid.png]
        hotspots:
          - {key: emilie, kind: npc, label: Émilie Côté, npc_key: journaliste_emilie, x: 0.5, y: 0.5}
          - {key: une, kind: object, label: La une du jour, x: 0.25, y: 0.6, text: "« Loyers : les nouveaux arrivants en première ligne »"}
