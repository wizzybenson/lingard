# Read aloud once to create the learner's voice clone (decision 0021). Original for Lingard. Any accent and any
# mistakes are fine: only the timbre of the voice is kept.
text: >-
  Bonjour, je m'appelle comme vous voulez, et j'apprends le français. Le matin, je prends un café, puis je pars
  au travail en bus. En chemin, je regarde la ville : les boulangeries, les marchés, les gens pressés. Le soir,
  j'aime cuisiner pour mes amis, écouter de la musique et me promener au bord de l'eau. Un jour, je parlerai
  français sans hésiter, au bureau, à la banque ou chez le médecin. Pour l'instant, je lis lentement, et ce
  n'est pas grave : chaque jour, je fais un petit pas de plus.
