      tongue: "Part en arrière et glisse vers l'avant et le haut."
      voice: "Oui."
      steps:
        - "Commencez par le « o » ouvert de « door » et glissez vers « i »."
      check: "« Boy », « coin », « noise »."
    confusions: {}
  aʊ:
    example: "now"
    en:
      lips: "Start open, end rounded."
      tongue: "Starts low and glides back and up."
      voice: "On."
      steps:
        - "Start with an open \"a\" and glide to \"oo\": \"a-oo\"."
      check: "'\"Now\", \"house\", \"out\".'"
    fr:
