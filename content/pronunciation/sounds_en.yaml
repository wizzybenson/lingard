        - "Round your lips firmly and say a long \"aw\"."
      check: "'\"Door\", \"walk\", \"four\", \"saw\": long and round, no \"r\" at the end.'"
    fr:
      lips: "Arrondies et projetées."
      tongue: "En arrière, mi-haute."
      voice: "Oui."
      steps:
        - "Arrondissez fermement les lèvres et dites un long « o » ouvert."
      check: "« Door », « walk », « four », « saw » : long et rond, sans « r » final."
    confusions:
      ɒ:
        en: "The vowel was short, so it sounded like \"not\". Hold it longer with rounder lips."
        fr: "La voyelle était courte, on entend « not ». Tenez-la plus longtemps, lèvres plus rondes."
      ɜː:
