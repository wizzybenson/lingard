        fr: "La langue était trop en avant, on entend « s ». Arrondissez les lèvres et reculez la langue."
  ʒ:
    example: "measure"
    en:
      lips: "Rounded and pushed forward."
      tongue: "Same as \"sh\"."
      voice: "On."
      steps:
        - "Make \"shh\", then turn your voice on."
      check: "The middle sound of \"measure\" and \"television\"."
    fr:
      lips: "Arrondies et projetées."
      tongue: "Comme pour « sh »."
