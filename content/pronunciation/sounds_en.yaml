    confusions:
      əʊ:
        en: "The vowel glided, so it sounded like \"note\". Keep it short and still."
        fr: "La voyelle a glissé, on entend « note ». Gardez-la courte et immobile."
      ʌ:
        en: "Your lips were unrounded, so it sounded like \"nut\". Round them a little."
