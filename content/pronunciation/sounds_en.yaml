        en: "Your tongue went back, so it sounded like \"cut\". Keep it forward and open wide."
        fr: "La langue a reculé, on entend « cut ». Gardez-la en avant et ouvrez grand."
      ɛ:
        en: "Your jaw was not open enough, so it sounded like \"pen\". Drop your jaw."
        fr: "La mâchoire n'était pas assez ouverte, on entend « pen ». Baissez la mâchoire."
      ɑː:
        en: "Your tongue went back and the vowel got long. Keep it short and forward."
        fr: "La langue a reculé et la voyelle s'est allongée. Gardez-la courte et en avant."
  ʌ:
    example: "cut"
    en:
      lips: "Relaxed, neutral."
      tongue: "Central and low-mid."
      jaw: "Half open."
      voice: "On."
      steps:
        - "Relax your mouth and say a short \"uh\"."
      check: "'\"Cut\", \"bus\", \"love\", \"money\" all have this vowel.'"
    fr:
      lips: "Détendues, neutres."
      tongue: "Au centre, assez basse."
      jaw: "Mi-ouverte."
      voice: "Oui."
      steps:
        - "Relâchez la bouche et dites un « a » court et sourd, entre « a » et « eu »."
      check: "« Cut », « bus », « love », « money » ont tous cette voyelle."
    confusions:
      æ:
        en: "Your tongue went forward and your jaw opened too far, so it sounded like \"cat\". Relax it back to the middle."
        fr: "La langue est partie en avant et la mâchoire s'est trop ouverte, on entend « cat ». Ramenez-la au centre."
      ɒ:
        en: "Your lips rounded, so it sounded like \"cot\". Keep the lips relaxed."
