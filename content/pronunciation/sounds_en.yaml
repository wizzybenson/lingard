      lips: "Start relaxed, end rounded."
      tongue: "Starts in the middle and glides back and up."
      voice: "On."
      steps:
        - "Start with \"uh\" and glide to \"oo\": \"uh-oo\"."
      check: "British \"no\" glides; French \"o\" does not."
    fr:
      lips: "Détendues au début, rondes à la fin."
      tongue: "Part du centre et glisse vers l'arrière et le haut."
      voice: "Oui."
      steps:
        - "Commencez par « eu » et glissez vers « ou » : « eu-ou »."
      check: "Le « no » britannique glisse ; le « o » français, non."
    confusions:
