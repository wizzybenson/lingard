      tongue: "In the middle of the mouth, mid-height."
      voice: "On."
      steps:
        - "Relax everything and say a long \"er\"."
        - "No \"r\" sound in British English: \"bird\", \"work\", \"her\"."
      check: "It is close to French \"eu\" in \"peur\", but with unrounded lips."
    fr:
      lips: "Détendues, ni arrondies ni étirées."
      tongue: "Au milieu de la bouche, à mi-hauteur."
      voice: "Oui."
      steps:
        - "Relâchez tout et dites un long « eu » sans arrondir les lèvres."
        - "Pas de « r » en anglais britannique : « bird », « work », « her »."
      check: "Proche du « eu » de « peur », mais lèvres non arrondies."
    confusions:
      ɔː:
        en: "Your lips rounded, so it sounded like \"walk\" instead of \"work\". Keep them relaxed."
        fr: "Les lèvres se sont arrondies, on entend « walk » au lieu de « work ». Gardez-les détendues."
      ɑː:
        en: "Your jaw was too open, so it sounded like \"heart\" instead of \"hurt\". Close it a little."
