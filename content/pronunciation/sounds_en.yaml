# The ladder for each drill (decision 0028): learn → hear the difference → words → pairs → phrases → sentence, then
# spaced reviews. A drill's key is its curriculum node when it has one; pairs come from the node's minimal_pairs plus
# these.
drills:
  - key: en.pron.th_sounds
    sounds: [θ, ð]
    words: [think, three, thin, bath, mouth, they, this, the, mother, brother]  # not "thank": native takes of it alone were heard with a t
    pairs: [[thick, sick], [thing, sing], [mouth, mouse], [path, pass], [thin, tin], [thank, tank], [both, boat], [then, den], [those, doze], [breathe, breed]]
    phrases: [thank you, this one, the other three, with them]
    sentence: "I think they thanked their mother."
  - key: en.pron.short_long_vowels
    sounds: [ɪ, iː, ʊ, uː]
    words: [ship, sheep, sit, seat, fill, feel, full, fool, pull, pool]
    pairs: [[sit, seat], [fill, feel], [pull, pool]]
    phrases: [a cheap ship, sit in the seat, a full pool]
    sentence: "A ship, not a sheep."
  - key: en.pron.ae_vs_uh
    sounds: [æ, ʌ]
    words: [cat, cut, hat, hut, match, much, bag, bug, cap, cup]
    phrases: [a black cat, a cup of tea, much better]
    sentence: "That cat drank from my cup."
  - key: en.gym.e_ae
    sounds: [ɛ, æ]
    words: [pen, pan, bed, bad, men, man, said, sad, head, had]
    pairs: [[pen, pan], [bed, bad], [men, man], [said, sad]]
    phrases: [a bad bed, ten men, my head]
    sentence: "Ten men had a bad head."
  - key: en.gym.long_vowels
    sounds: [ɑː, ɔː, ɜː]
    words: [car, park, father, door, walk, four, bird, work, her, first]
    pairs: [[hurt, heart], [walk, work], [four, fur], [born, burn], [firm, farm], [stir, star], [bird, bard]]
    phrases: [a long walk, the first bird, park the car]
    sentence: "Her first walk in the park was short."
  - key: en.gym.o_vowels
    sounds: [ɒ, əʊ]
    words: [not, note, hot, home, stop, go, coffee, phone, job, road]
    pairs: [[not, note], [cost, coast], [want, won't]]
    phrases: [a hot coffee, go home, on the phone]
    sentence: "Don't stop, go home."
  - key: en.gym.diphthongs
    sounds: [eɪ, aɪ, ɔɪ, aʊ]
    words: [day, rain, my, time, boy, coin, now, house, late, five]
    phrases: [nice day, my house, five boys, right now]
    sentence: "I'll stay at my house today."
  - key: en.pron.schwa
    sounds: [ə]
    words: [about, banana, sofa, today, again, doctor, problem, support, collect, Canada]
    phrases: [a cup of tea, fish and chips, at the station, from London]
    sentence: "I'd like a cup of tea, please."
  - key: en.pron.p_vs_b
    sounds: [p, b]
    words: [pen, ben, pack, back, pill, bill, pay, bay, paper, baby]
    phrases: [pay the bill, a big pen, back pack]
    sentence: "Pen, not Ben."
  - key: en.gym.t_d
    sounds: [t, d]
    words: [time, tea, two, tie, die, bet, bed, ten, den, today]
    pairs: [[tie, die], [bet, bed], [ten, den]]
    phrases: [ten past two, a good day, at the door]
    sentence: "It's ten to two today."
  - key: en.gym.k_g
    sounds: [k, ɡ]
    words: [coat, goat, back, bag, cold, gold, cap, gap, came, game]
    pairs: [[coat, goat], [back, bag], [cold, gold]]
    phrases: [a big cake, a cold glass, get a cab]
    sentence: "Can you get the big cake?"
  - key: en.pron.v_vs_f
    sounds: [v, f]
    words: [van, fan, very, ferry, five, leave, have, "off", view, fine]
    phrases: [five vans, very fine, have a view]
    sentence: "Very, not ferry."
  - key: en.pron.w_vs_v
    sounds: [w, v]
    words: [wine, vine, west, vest, wet, vet, water, way, very, we]
    phrases: [we went west, a very wet vest, white wine]
    sentence: "We visited a very wet village."
  - key: en.pron.final_s_z
    sounds: [s, z]
    words: [bus, buzz, rice, rise, place, plays, price, prize, cats, dogs]
    phrases: [two buses, she plays, the price is right]
    sentence: "She buys rice and peas."
  - key: en.gym.sh_ch_j
    sounds: [ʃ, tʃ, dʒ]
    words: [ship, chip, share, chair, cheap, jeep, wash, watch, choose, juice]
    pairs: [[ship, chip], [share, chair], [cheap, jeep], [wash, watch], [chin, gin], [choke, joke], [rich, ridge], [chain, Jane]]
    phrases: [fish and chips, a cheap chair, orange juice]
    sentence: "She chose a cheap chair."
  - key: en.gym.ng
    sounds: [ŋ]
    words: [sing, thing, long, ring, morning, singer, young, wrong, bring, evening]
    pairs: [[sin, sing], [thin, thing], [ran, rang]]
    phrases: [good morning, the wrong thing, bring it]
    sentence: "We sing in the evening."
  - key: en.gym.h
    sounds: [h]
    words: [hat, heat, hold, house, happy, hello, help, hungry, hotel, behind]
    pairs: [[hat, at], [heat, eat], [hold, old]]
    phrases: [hello Harry, help her, at home]
    sentence: "Harry's hotel is behind the house."
  - key: en.gym.r_l
    sounds: [ɹ, l]
    words: [red, right, light, road, load, very, sorry, lorry, rice, lice]
    pairs: [[right, light], [road, load], [rice, lice], [pray, play]]
    phrases: [turn right, a red light, a long road]
    sentence: "Turn right at the red light."
  - key: en.gym.y
    sounds: [j]
    words: ["yes", yellow, you, youth, young, year, music, few, beautiful, yesterday]  # not "use" (s or z) or "new" (many drop its y)
    pairs: [[year, ear], [yet, jet], [yolk, joke], [yam, jam], [yell, jell], [yes, ess]]
    phrases: [yes you can, a yellow car, young people, a beautiful year]
    sentence: "Yes, you can use my yellow pen."
  - key: en.pron.ed_endings
    sounds: []
    words: [walked, played, wanted, stopped, called, needed, watched, lived, started, looked]
    phrases: [I walked home, she played well, we wanted more]
    sentence: "I walked, then played, then started again."
  - key: en.pron.consonant_clusters
    sounds: []
    words: [street, spring, strong, months, texts, twelfth, asked, crisps, splash, school]
    phrases: [six months, a strong street, she asked]
    sentence: "She asked for six strong crisps."
  - key: en.pron.connected_speech
    sounds: []
    phrases: [an apple, pick it up, turn it off, not at all, an hour ago, get out of it]
    sentence: "Pick it up and turn it off."
  - key: en.pron.word_stress
    sounds: []
    words: [photograph, photographer, important, information, comfortable, interesting, hotel, today, record, present]
    phrases: [a photograph, a photographer, photographic, an important day, a comfortable hotel]
    sentence: "The photographer took an important photograph."
    focus: stress
  - key: en.pron.sentence_stress
    sounds: []
    phrases: [I want to go, what do you want, I'd like a coffee]
    sentence: "I'd like a large coffee, please."
    focus: emphasis
  - key: en.pron.intonation
    sounds: []
    phrases: ["Are you coming?", "Is it ready?", "Really?", "You're coming.", "It's ready."]
    sentence: "Can you help me with my bags?"
    focus: intonation
  - key: en.gym.rhythm
    sounds: []
    phrases: [cats chase mice, the cats chase mice, the cats will chase the mice, the cats have been chasing the mice]
    sentence: "The cats have been chasing the mice."
    focus: rhythm
