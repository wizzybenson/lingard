      ɹ:
        en: "Your tongue tip did not touch, so it sounded like \"r\" (right). Touch the ridge."
        fr: "La pointe n'a pas touché, on entend « r » (right). Touchez la bosse."
      w:
        en: "Your tongue tip did not touch and the lips rounded. Touch the ridge with the tip."
        fr: "La pointe n'a pas touché et les lèvres se sont arrondies. Touchez la bosse avec la pointe."
  ɹ:
    example: "red"
    en:
      lips: "Slightly rounded."
      tongue: "The tip curls up toward the ridge but never touches anything."
      voice: "On."
      steps:
        - "Round your lips a little and raise the tongue tip toward the ridge, without touching."
        - "Glide into the vowel. No tap, no roll, no gargle."
      check: "In British English an \"r\" is only said before a vowel; in \"car\" and \"park\" it is silent."
    fr:
      lips: "Légèrement arrondies."
      tongue: "La pointe se relève vers la bosse mais ne touche rien."
      voice: "Oui."
      steps:
        - "Arrondissez un peu les lèvres et levez la pointe vers la bosse, sans toucher."
        - "Glissez vers la voyelle. Pas de frappe, pas de roulement, pas de gargarisme."
      check: "En anglais britannique, le « r » ne se dit que devant une voyelle ; dans « car » et « park » il est muet."
    confusions:
      ʁ:
        en: "That was a French \"r\" from the throat. Make it with the tongue tip, curled up and not touching."
        fr: "C'était un « r » français, de la gorge. Faites-le avec la pointe de la langue, relevée sans toucher."
      r:
        en: "Your tongue tip rolled. Keep it still and not touching anything."
        fr: "La pointe a roulé. Gardez-la immobile, sans rien toucher."
      ɾ:
        en: "Your tongue tip tapped the ridge. Keep it close but not touching."
        fr: "La pointe a tapé la bosse. Approchez-la sans toucher."
      l:
        en: "Your tongue tip touched the ridge, so it sounded like \"l\" (light). Do not let it touch."
        fr: "La pointe a touché la bosse, on entend « l » (light). Ne la laissez pas toucher."
  j:
    example: "yes"
    en:
      tongue: "The middle of the tongue rises close to the hard palate, as for a very short \"ee\"."
      voice: "On."
      steps:
        - "Start from a quick \"ee\" and glide into the vowel."
      check: "'\"Yet\" and \"jet\" differ: \"y\" is smooth, with no stop.'"
    fr:
      tongue: "Le milieu de la langue monte près du palais dur, comme un « i » très bref."
      voice: "Oui."
      steps:
        - "Partez d'un « i » rapide et glissez vers la voyelle."
      check: "« Yet » et « jet » sont différents : le « y » est doux, sans arrêt."
    confusions:
      dʒ:
        en: "Your tongue closed first, so it sounded like \"j\" (jet). Glide smoothly from \"ee\"."
        fr: "La langue a fermé d'abord, on entend « j » (jet). Glissez doucement depuis « i »."
  ɪ:
    example: "ship"
    en:
      lips: "Relaxed."
      tongue: "High and forward, but lower and looser than for \"ee\"."
      voice: "On."
      steps:
        - "Say \"ee\", then relax your tongue and lips and make it short."
        - "It is a quick, lazy sound."
      check: "'\"Ship\" is short and relaxed; \"sheep\" is long and tense.'"
    fr:
      lips: "Détendues."
      tongue: "Haute et en avant, mais plus basse et plus relâchée que pour « i »."
      voice: "Oui."
      steps:
        - "Dites « i », puis relâchez la langue et les lèvres, et faites-le court."
        - "C'est un son bref et paresseux, qui n'existe pas en français."
      check: "« Ship » est court et relâché ; « sheep » est long et tendu."
    confusions:
      iː:
        en: "The vowel was long and tense, so it sounded like \"ee\" (sheep). Make it short and relaxed."
        fr: "La voyelle était longue et tendue, on entend « sheep ». Faites-la courte et relâchée."
      i:
        en: "The vowel was tense, like French \"i\". Relax your tongue and lips."
        fr: "La voyelle était tendue comme le « i » français. Relâchez la langue et les lèvres."
      ɛ:
        en: "Your jaw was too open, so it sounded like \"e\" (pet). Close it a little."
        fr: "La mâchoire était trop ouverte, on entend « e » (pet). Fermez-la un peu."
  iː:
    example: "sheep"
    en:
      lips: "Spread, in a smile."
      tongue: "High and forward, tense."
      voice: "On."
      steps:
        - "Smile and say \"ee\"."
        - "Hold it about twice as long as the vowel in \"ship\"."
      check: "Feel the tension in your tongue."
    fr:
      lips: "Étirées, un sourire."
      tongue: "Haute et en avant, tendue."
      voice: "Oui."
      steps:
        - "Souriez et dites « i »."
        - "Tenez-le environ deux fois plus longtemps que la voyelle de « ship »."
      check: "La langue est tendue."
    confusions:
      ɪ:
        en: "The vowel was short and relaxed, so it sounded like \"ship\". Smile, and hold it longer."
        fr: "La voyelle était courte et relâchée, on entend « ship ». Souriez et tenez-la plus longtemps."
  ʊ:
    example: "full"
    en:
      lips: "Slightly rounded, relaxed."
      tongue: "Back and high, but loose."
      voice: "On."
      steps:
        - "Say \"oo\", then relax your lips and make it short."
      check: "'\"Full\" is short and relaxed; \"fool\" is long with tight lips.'"
    fr:
      lips: "Légèrement arrondies, détendues."
      tongue: "En arrière et haute, mais relâchée."
      voice: "Oui."
      steps:
        - "Dites « ou », puis relâchez les lèvres et faites-le court."
      check: "« Full » est court et relâché ; « fool » est long, lèvres serrées."
    confusions:
      uː:
        en: "The vowel was long with tight lips, so it sounded like \"fool\". Make it short and loose."
        fr: "La voyelle était longue, lèvres serrées : on entend « fool ». Faites-la courte et relâchée."
      u:
        en: "The vowel was tense, like French \"ou\". Relax your lips."
        fr: "La voyelle était tendue comme le « ou » français. Relâchez les lèvres."
  uː:
    example: "fool"
    en:
      lips: "Tightly rounded and pushed forward."
      tongue: "Back and high."
      voice: "On."
      steps:
        - "Round your lips tightly and say \"oo\"."
        - "Hold it long."
      check: "About twice as long as the vowel in \"full\"."
    fr:
      lips: "Bien arrondies et projetées."
      tongue: "En arrière et haute."
      voice: "Oui."
      steps:
        - "Arrondissez bien les lèvres et dites « ou »."
        - "Tenez-le longtemps."
      check: "Environ deux fois plus long que la voyelle de « full »."
    confusions:
      ʊ:
        en: "The vowel was short, so it sounded like \"full\". Hold it longer, with tight lips."
        fr: "La voyelle était courte, on entend « full ». Tenez-la plus longtemps, lèvres serrées."
  ɛ:
    example: "pen"
    en:
      lips: "Relaxed, slightly spread."
      tongue: "Forward, mid-height."
      jaw: "Half open."
      voice: "On."
      steps:
        - "Say \"e\" as in \"pen\", short."
      check: "Between \"pin\" and \"pan\"."
    fr:
      lips: "Détendues, un peu étirées."
      tongue: "En avant, à mi-hauteur."
      jaw: "Mi-ouverte."
      voice: "Oui."
      steps:
        - "Dites « è », court, comme dans « pen »."
      check: "Entre « pin » et « pan »."
    confusions:
      æ:
        en: "Your jaw was too open, so it sounded like \"pan\". Close it a little."
        fr: "La mâchoire était trop ouverte, on entend « pan ». Fermez-la un peu."
      ɪ:
        en: "Your jaw was too closed, so it sounded like \"pin\". Open it a little."
        fr: "La mâchoire était trop fermée, on entend « pin ». Ouvrez-la un peu."
  æ:
    example: "cat"
    en:
      lips: "Spread."
      tongue: "Low and forward, the tip behind your lower teeth."
      jaw: "Wide open."
      voice: "On."
      steps:
        - "Open your jaw wide and keep your tongue forward and flat."
        - "Say \"a\" as in \"cat\"."
      check: "Your jaw drops more than for \"pen\"."
    fr:
      lips: "Étirées."
      tongue: "Basse et en avant, la pointe derrière les dents du bas."
      jaw: "Grande ouverte."
      voice: "Oui."
      steps:
        - "Ouvrez grand la mâchoire, langue en avant et à plat."
        - "Dites le « a » de « cat »."
      check: "La mâchoire descend plus que pour « pen »."
    confusions:
