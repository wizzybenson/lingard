    fr:
      lips: "Ouvertes et détendues."
      tongue: "En arrière et basse."
      jaw: "Grande ouverte."
      voice: "Oui."
      steps:
        - "Ouvrez grand, comme chez le médecin, et dites un long « a » grave."
        - "En anglais britannique, pas de « r » à la fin de « car »."
      check: "Long et profond."
    confusions:
      æ:
        en: "Your tongue was too far forward, so it sounded like \"cat\". Pull it back and hold the vowel longer."
