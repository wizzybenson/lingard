# Sound gym (Accent Studio, decision 0028): how each Southern British English sound is made, what to change when it
# comes out as another sound, and the drills that train it. Original for Lingard. Explanations exist in each interface
# language (en, fr); "heard_as" keys are recogniser symbols (content/pronunciation/recognizer_inventory_<lang>.txt).
# Articulation follows standard descriptions of SSBE (e.g. Cruttenden, Gimson's Pronunciation of English).
source_url: https://www.internationalphoneticassociation.org/content/full-ipa-chart
as_of: "2026-10-22"
language: en
music: [stress, emphasis, rhythm, intonation]  # the parts of the music judged (every word of two or more syllables has its stressed syllable)

# The model for melody drills (focus: intonation) is rendered with these instructions and kept only once its ending is
# measured to rise (a question) or fall (a statement): the everyday narrator read some questions flat (2026-10-22).
melody_model:  # melody drills use yes/no questions, which rise in both languages; wh-questions are left out
  question: "Speak standard Southern British English (RP), clearly, at a natural pace. This is a yes/no question: your voice rises clearly at the end."
  statement: "Speak standard Southern British English (RP), clearly, at a natural pace. This is a statement: your voice falls at the end."

phonemes:
  θ:
    example: "think"
    en:
      tongue: "The tip rests lightly between or just behind your upper front teeth."
      voice: "Off."
      air: "Flows continuously over the tongue; nothing stops it."
      steps:
        - "Put the tip of your tongue lightly against the bottom of your upper teeth; you can let it show a little."
        - "Blow air over it without using your voice."
      check: "In a mirror you should see the tip of your tongue. Touch your throat; no buzz."
    fr:
      tongue: "La pointe posée légèrement entre les dents du haut ou juste derrière."
      voice: "Non."
      air: "Passe en continu sur la langue, rien ne l'arrête."
      steps:
        - "Posez la pointe de la langue sous les dents du haut ; elle peut dépasser un peu."
        - "Soufflez dessus sans la voix."
      check: "Dans un miroir, on voit la pointe de la langue. Touchez la gorge : aucune vibration."
    confusions:
      s:
        en: "Your tongue stayed behind your teeth, so it sounded like \"s\" (sink). Bring the tip forward to touch your upper teeth."
        fr: "Votre langue est restée derrière les dents, on entend « s » (sink). Avancez la pointe jusqu'aux dents du haut."
      t:
        en: "Your tongue stopped the air, so it sounded like \"t\" (tree). Let the air keep flowing over the tongue."
        fr: "Votre langue a bloqué l'air, on entend « t » (tree). Laissez l'air passer en continu sur la langue."
      f:
        en: "You used your lip, so it sounded like \"f\". Use the tongue against the teeth instead."
        fr: "Vous avez utilisé la lèvre, on entend « f ». Utilisez la langue contre les dents."
  ð:
    example: "they"
    en:
      tongue: "The tip rests lightly between or just behind your upper front teeth."
      voice: "On, a buzz."
      air: "Flows continuously over the tongue."
      steps:
        - "Put the tip of your tongue against the bottom of your upper teeth."
        - "Turn your voice on and let the air flow; the tip of your tongue tickles."
      check: "Touch your throat. It buzzes, and you can see your tongue tip."
    fr:
      tongue: "La pointe posée légèrement entre les dents du haut ou juste derrière."
      voice: "Oui, ça vibre."
      air: "Passe en continu sur la langue."
      steps:
        - "Posez la pointe de la langue sous les dents du haut."
        - "Ajoutez la voix et laissez passer l'air ; la pointe chatouille."
      check: "Touchez la gorge : elle vibre, et on voit la pointe de la langue."
    confusions:
      d:
        en: "Your tongue stopped the air, so it sounded like \"d\" (day). Let the air flow over the tongue."
        fr: "Votre langue a bloqué l'air, on entend « d » (day). Laissez l'air passer sur la langue."
      z:
        en: "Your tongue stayed behind your teeth, so it sounded like \"z\". Bring the tip forward to the teeth."
        fr: "Votre langue est restée derrière les dents, on entend « z ». Avancez la pointe jusqu'aux dents."
      v:
        en: "You used your lip, so it sounded like \"v\". Use the tongue against the teeth."
        fr: "Vous avez utilisé la lèvre, on entend « v ». Utilisez la langue contre les dents."
  p:
    example: "pen"
    en:
      lips: "Pressed together, then opened."
      voice: "Off."
      air: "At the start of a word or a stressed syllable, a strong puff of air follows."
      steps:
        - "Close your lips and build up air behind them."
        - "Open them with a puff; a paper in front of your mouth should jump."
      check: "Hold your hand in front of your mouth for \"pen\"; you feel the air. For \"Ben\" you barely do."
    fr:
      lips: "Fermées, puis ouvertes."
      voice: "Non."
      air: "En début de mot ou de syllabe accentuée, un fort souffle suit."
      steps:
        - "Fermez les lèvres et accumulez l'air derrière."
        - "Ouvrez avec un souffle ; une feuille devant la bouche doit bouger."
      check: "Main devant la bouche pour « pen » : vous sentez l'air. Pour « Ben », presque pas."
    confusions:
      b:
        en: "Your voice was on and there was no puff, so it sounded like \"b\" (Ben). Voice off, and release with a puff of air."
        fr: "Votre voix était là sans souffle, on entend « b » (Ben). Sans la voix, et relâchez avec un souffle."
  b:
    example: "Ben"
    en:
      lips: "Pressed together, then opened."
      voice: "On."
      air: "No puff."
      steps:
        - "Close your lips and let your throat buzz."
        - "Open them gently, with no burst of air."
      check: "A paper in front of your mouth barely moves."
    fr:
      lips: "Fermées, puis ouvertes."
      voice: "Oui."
      air: "Pas de souffle."
      steps:
        - "Fermez les lèvres et faites vibrer la gorge."
        - "Ouvrez doucement, sans souffle."
      check: "Une feuille devant la bouche bouge à peine."
    confusions:
      p:
        en: "There was a puff of air and no voice, so it sounded like \"p\" (pen). Hum, and open gently."
        fr: "Il y avait un souffle sans voix, on entend « p » (pen). Faites vibrer, et ouvrez doucement."
  t:
    example: "tea"
    en:
      tongue: "The tip touches the ridge just behind your upper front teeth."
      voice: "Off."
      air: "At the start of a stressed syllable, a puff of air follows."
      steps:
        - "Touch the ridge behind your upper teeth with your tongue tip."
        - "Release with a puff of air."
      check: "Your tongue is on the ridge, not on the teeth."
    fr:
      tongue: "La pointe touche la bosse juste derrière les dents du haut."
      voice: "Non."
      air: "En début de syllabe accentuée, un souffle suit."
      steps:
        - "Touchez la bosse derrière les dents du haut avec la pointe."
        - "Relâchez avec un souffle."
      check: "La langue est sur la bosse, pas sur les dents."
    confusions:
      d:
        en: "Your voice was on and there was no puff, so it sounded like \"d\". Voice off, with a puff of air."
        fr: "La voix était là sans souffle, on entend « d ». Sans la voix, avec un souffle."
  d:
    example: "day"
    en:
      tongue: "The tip touches the ridge just behind your upper front teeth."
      voice: "On."
      steps:
        - "Touch the ridge behind your upper teeth and let your throat buzz."
        - "Release gently."
      check: "At the end of a word (\"bed\"), keep the voice on; do not turn it into \"t\"."
    fr:
      tongue: "La pointe touche la bosse derrière les dents du haut."
      voice: "Oui."
      steps:
        - "Touchez la bosse derrière les dents du haut et faites vibrer la gorge."
        - "Relâchez doucement."
      check: "En fin de mot (« bed »), gardez la voix ; ne le transformez pas en « t »."
    confusions:
      t:
        en: "There was no voice, so it sounded like \"t\" (bet). Keep your throat buzzing."
        fr: "Il n'y avait pas de voix, on entend « t » (bet). Gardez la vibration."
  k:
    example: "coat"
    en:
      tongue: "The back of the tongue presses against the soft palate."
      voice: "Off."
      air: "A puff of air at the start of a stressed syllable."
      steps:
        - "Close with the back of your tongue."
        - "Release with a puff of air."
      check: "Hand in front of your mouth for \"coat\"; you feel the air."
    fr:
      tongue: "Le dos de la langue appuie contre le palais mou."
      voice: "Non."
      air: "Un souffle en début de syllabe accentuée."
      steps:
        - "Fermez avec le dos de la langue."
        - "Relâchez avec un souffle."
      check: "Main devant la bouche pour « coat » : vous sentez l'air."
    confusions:
      ɡ:
        en: "Your voice was on, so it sounded like \"g\" (goat). Voice off, with a puff."
        fr: "La voix était là, on entend « g » (goat). Sans la voix, avec un souffle."
  ɡ:
    example: "goat"
    en:
      tongue: "The back of the tongue presses against the soft palate."
      voice: "On."
      steps:
        - "Close with the back of your tongue and let your throat buzz."
        - "Release gently."
      check: "At the end of a word (\"bag\"), keep the voice; do not turn it into \"k\"."
    fr:
      tongue: "Le dos de la langue appuie contre le palais mou."
      voice: "Oui."
      steps:
        - "Fermez avec le dos de la langue et faites vibrer la gorge."
        - "Relâchez doucement."
      check: "En fin de mot (« bag »), gardez la voix ; pas de « k »."
    confusions:
      k:
        en: "There was no voice, so it sounded like \"k\" (back). Keep your throat buzzing."
        fr: "Il n'y avait pas de voix, on entend « k » (back). Gardez la vibration."
  f:
    example: "fan"
    en:
      lips: "Your upper teeth rest lightly on your lower lip."
      voice: "Off."
      air: "Flows continuously between teeth and lip."
      steps:
        - "Rest your upper teeth on your lower lip."
        - "Blow air through without your voice."
      check: "Your lips never touch each other."
    fr:
      lips: "Les dents du haut posées légèrement sur la lèvre du bas."
      voice: "Non."
      air: "Passe en continu entre les dents et la lèvre."
      steps:
        - "Posez les dents du haut sur la lèvre du bas."
        - "Soufflez sans la voix."
      check: "Les lèvres ne se touchent jamais."
    confusions:
      v:
        en: "Your voice was on, so it sounded like \"v\" (van). Voice off."
        fr: "La voix était là, on entend « v » (van). Sans la voix."
      p:
        en: "Your lips closed, so it sounded like \"p\". Keep the air flowing between teeth and lip."
        fr: "Les lèvres se sont fermées, on entend « p ». Laissez l'air passer entre les dents et la lèvre."
  v:
    example: "van"
    en:
      lips: "Your upper teeth rest lightly on your lower lip."
      voice: "On, a buzz."
      air: "Flows continuously between teeth and lip."
      steps:
        - "Rest your upper teeth on your lower lip."
        - "Blow air through with your voice on; your lip tickles."
      check: "Touch your throat. It buzzes, and your lips never touch each other."
    fr:
      lips: "Les dents du haut posées légèrement sur la lèvre du bas."
      voice: "Oui, ça vibre."
      air: "Passe en continu entre les dents et la lèvre."
      steps:
        - "Posez les dents du haut sur la lèvre du bas."
        - "Soufflez avec la voix ; la lèvre chatouille."
      check: "La gorge vibre, et les lèvres ne se touchent jamais."
    confusions:
      f:
        en: "There was no voice, so it sounded like \"f\" (fan). Turn your voice on."
        fr: "Il n'y avait pas de voix, on entend « f » (fan). Ajoutez la voix."
      w:
        en: "Your lips rounded and your teeth did not touch, so it sounded like \"w\" (wine). Rest your top teeth on your lower lip."
        fr: "Les lèvres se sont arrondies sans les dents, on entend « w » (wine). Posez les dents du haut sur la lèvre du bas."
      b:
        en: "Your lips closed, so it sounded like \"b\". Use your teeth on your lower lip."
        fr: "Les lèvres se sont fermées, on entend « b ». Utilisez les dents sur la lèvre du bas."
  w:
    example: "wine"
    en:
      lips: "Tightly rounded, then open quickly into the vowel."
      tongue: "Back and high, as for \"oo\"."
      voice: "On."
      steps:
        - "Round your lips as if to say \"oo\"."
        - "Open them quickly into the next vowel. Your teeth never touch your lips."
      check: "In a mirror, your lips start as a small circle."
    fr:
      lips: "Bien arrondies, puis qui s'ouvrent vite vers la voyelle."
      tongue: "En arrière et haute, comme pour « ou »."
      voice: "Oui."
      steps:
        - "Arrondissez les lèvres comme pour « ou »."
        - "Ouvrez-les vite vers la voyelle suivante. Les dents ne touchent jamais les lèvres."
      check: "Dans un miroir, les lèvres commencent en petit cercle."
    confusions:
      v:
        en: "Your teeth touched your lip, so it sounded like \"v\" (vine). Use only rounded lips."
        fr: "Les dents ont touché la lèvre, on entend « v » (vine). Utilisez seulement les lèvres arrondies."
  s:
    example: "bus"
    en:
      tongue: "The tip close to the ridge behind your upper teeth, a narrow groove down the middle."
      voice: "Off."
      air: "A thin, sharp hiss."
      steps:
        - "Bring your teeth almost together."
        - "Blow a thin hiss over the tongue."
      check: "Touch your throat; no buzz."
    fr:
      tongue: "La pointe près de la bosse derrière les dents du haut, un petit sillon au milieu."
      voice: "Non."
      air: "Un sifflement fin et aigu."
      steps:
        - "Rapprochez les dents."
        - "Soufflez un sifflement fin sur la langue."
      check: "Touchez la gorge : aucune vibration."
    confusions:
      z:
        en: "Your voice was on, so it sounded like \"z\" (buzz). Voice off."
        fr: "La voix était là, on entend « z » (buzz). Sans la voix."
      θ:
        en: "Your tongue touched your teeth, so it sounded like \"th\". Keep it just behind the teeth."
        fr: "La langue a touché les dents, on entend « th ». Gardez-la juste derrière les dents."
      ʃ:
        en: "Your tongue went back and your lips rounded, so it sounded like \"sh\". Bring the tongue forward."
        fr: "La langue a reculé et les lèvres se sont arrondies, on entend « sh ». Avancez la langue."
  z:
