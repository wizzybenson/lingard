      ɔ:
        en: "The vowel was too closed. Open your jaw more."
        fr: "La voyelle était trop fermée. Ouvrez davantage."
  ɑː:
    example: "car"
    en:
      lips: "Open and relaxed."
      tongue: "Back and low."
      jaw: "Wide open."
      voice: "On."
      steps:
        - "Open wide, as at the doctor's, and say a long \"ah\"."
        - "In British English there is no \"r\" at the end of \"car\"."
