      jaw: "Starts open and closes."
      tongue: "Starts low and glides up toward \"ee\"."
      voice: "On."
      steps:
        - "Start with an open \"a\" and glide to \"ee\": \"a-ee\"."
      check: "'\"My\", \"time\", \"five\", \"light\".'"
    fr:
