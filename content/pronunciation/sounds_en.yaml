        - "At the end of a word, let the back of the tongue sink a little."
      check: "The tip touches the ridge every time, even at the end of \"feel\"."
    fr:
      tongue: "La pointe sur la bosse derrière les dents du haut. Avant une voyelle (« light ») la langue est haute et claire ; après une voyelle (« feel », « milk ») le dos de la langue descend pour un son plus sombre."
