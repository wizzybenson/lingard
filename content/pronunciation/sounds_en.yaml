      ʌ:
        en: "The vowel was too short. Hold it longer, with the jaw wide open."
        fr: "La voyelle était trop courte. Tenez-la plus longtemps, mâchoire grande ouverte."
  ɔː:
    example: "door"
    en:
      lips: "Rounded and pushed forward."
      tongue: "Back, mid-high."
      voice: "On."
