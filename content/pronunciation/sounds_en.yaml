        fr: "La voyelle est restée immobile, comme le « o » français. Partez du centre et glissez vers « ou »."
      ɒ:
        en: "The vowel was short and open, so it sounded like \"not\". Glide to \"oo\"."
        fr: "La voyelle était courte et ouverte, on entend « not ». Glissez vers « ou »."
      ɔː:
