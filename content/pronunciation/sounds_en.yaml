      tongue: "Part basse et glisse vers l'arrière et le haut."
      voice: "Oui."
      steps:
        - "Commencez par un « a » ouvert et glissez vers « ou » : « a-ou »."
      check: "« Now », « house », « out »."
    confusions:
      ɔː:
        en: "The vowel started too round. Start with an open \"a\"."
        fr: "La voyelle a commencé trop arrondie. Commencez par un « a » ouvert."
  əʊ:
    example: "note"
