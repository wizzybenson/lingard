# Read aloud once to create the learner's voice clone (decision 0021). Original for Lingard. Any accent and any
# mistakes are fine: only the timbre of the voice is kept.
text: >-
  Hello, I'm learning English, and this is my voice. In the morning I have a cup of tea, then I take the bus
  to work. On the way I look out at the city: the bakeries, the markets, the people in a hurry. In the evening
  I like cooking for my friends, listening to music and walking by the river. One day I will speak English
  without stopping to think, at work, at the bank or at the doctor's. For now I read slowly, and that's fine:
  every day I take one more small step.
