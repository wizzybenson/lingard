# Sign in as the shared local test learner (LINGARD_TEST_NAME/PIN in .env, passed in by run.sh).
appId: app.lingard
---
- launchApp
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Welcome to Lingard"
    commands:
      - tapOn:
          id: "sign-in-name"
      - eraseText
      - inputText: ${MAESTRO_LINGARD_TEST_NAME}
      - pressKey: Enter          # Return moves to the PIN field
      - eraseText
      - inputText: ${MAESTRO_LINGARD_TEST_PIN}   # the sixth digit signs in
- extendedWaitUntil:
    visible: "Where to today?"
    timeout: 30000
- takeScreenshot: 01-city
