# Exam Hall in English: start an IELTS General Training mock and work through the first listening sets. No paid calls
# (the recordings are spoken by the server's narrator only when played).
appId: app.lingard
---
- runFlow: sign-in.yaml
- tapOn: "Exam Hall, tab.*"
- runFlow:  # the hall shows the exam in focus; the pill by the title switches to the other
    when:
      visible: "Switch to IELTS General Training"
    commands:
      - tapOn: "Switch to IELTS General Training"
- extendedWaitUntil:
    visible: "IELTS General Training"
    timeout: 10000
- tapOn: "Start a full mock"
- extendedWaitUntil:
    visible: "Listening.*"
    timeout: 20000
- takeScreenshot: mock-ielts-01-first-set
- tapOn:
    id: "choice-1"
- tapOn: "Next.*"
- extendedWaitUntil:
    visible: "Next · 0/.*"
    timeout: 10000
- takeScreenshot: mock-ielts-02-second-set
