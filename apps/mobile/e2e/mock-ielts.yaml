# Exam Hall in English: start an IELTS General Training mock and work through the first listening sets. No paid calls
# (the recordings are spoken by the server's narrator only when played).
appId: app.lingard
---
- runFlow: sign-in.yaml
- tapOn: "Exam Hall, tab.*"
- scrollUntilVisible:
    element: "Desk.*"
    direction: DOWN
- tapOn: "Start a full mock"  # at the bottom of the hall only the IELTS card's button is on screen
- extendedWaitUntil:
    visible: "Listening.*"
    timeout: 20000
- takeScreenshot: mock-ielts-01-first-set
- tapOn:
    id: "choice-1"
- tapOn: "Next.*"
- extendedWaitUntil:
    visible: "Next · 0/.*"
    timeout: 10000
- takeScreenshot: mock-ielts-02-second-set
