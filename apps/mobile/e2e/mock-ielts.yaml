# Exam Hall in English: start an IELTS General Training mock and work through the first listening sets. No paid calls
# (the recordings are spoken by the server's narrator only when played).
appId: app.lingard
---
- runFlow: sign-in.yaml
- scrollUntilVisible:  # English in focus: the city pill on Today switches it (clear of the dev build's menu button)
    element: "Switch to (Ashford|Rivemont)"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible: "Switch to Ashford"
    commands:
      - tapOn: "Switch to Ashford"
- tapOn: "Exam Hall, tab.*"
- extendedWaitUntil:
    visible: "IELTS General Training"
    timeout: 10000
- tapOn: "Start a full mock"
- extendedWaitUntil:
    visible: "Listening.*"
    timeout: 20000
- takeScreenshot: mock-ielts-01-first-set
- runFlow:  # each mock is assembled afresh: the first set may be multiple choice or notes to complete
    when:
      visible:
        id: "choice-1"
    commands:
      - tapOn:
          id: "choice-1"
- tapOn: "Next.*"
- extendedWaitUntil:
    visible: "Next · 0/.*"
    timeout: 10000
- takeScreenshot: mock-ielts-02-second-set
