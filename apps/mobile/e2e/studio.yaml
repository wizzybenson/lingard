# Accent Studio (free: nothing is played or scored): the sound gym and a drill's ladder. Works on any account: a fresh
# one opens on "Learn" (how the sounds are made, the mouth map); a climbed one on a later rung.
appId: app.lingard
---
- runFlow: sign-in.yaml
- openLink: lingard://studio
- extendedWaitUntil:
    visible: "Today's workout.*"
    timeout: 20000
- takeScreenshot: 30-studio
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Playback speed.*|Learn how the sound is made.*|Now inside phrases.*|Say each word.*|Say both words.*|The whole sentence.*|Say each one.*"
    timeout: 20000
- takeScreenshot: 31-drill
- runFlow:
    when:
      visible: "Learn how the sound is made.*"
    commands:
      - scrollUntilVisible:
          element: "Do this"
          direction: DOWN
      - takeScreenshot: 32-drill-steps
