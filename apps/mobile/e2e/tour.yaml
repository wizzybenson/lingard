# Walk every tab and the main pushed screens after signing in; a screenshot at each stop.
appId: app.lingard
---
- runFlow: sign-in.yaml
- takeScreenshot: 01a-path
- scrollUntilVisible:
    element: "Places"
    direction: DOWN
    centerElement: true
- tapOn: "Places"  # the list is folded under the map
- scrollUntilVisible:
    element: "Café du Quai.*"
    direction: DOWN
    centerElement: true  # clear of the tab bar, so the tap lands on the place
- takeScreenshot: 01b-map
- tapOn: "Café du Quai.*"
- takeScreenshot: 02-city-location
- scrollUntilVisible:
    element: "Useful here"
    direction: DOWN
- takeScreenshot: 02b-useful-here
- tapOn: "Practice, tab.*"
- tapOn: "Review"
- takeScreenshot: 03-phone
- tapOn: "Back"
- tapOn: "Practice, tab.*"
- tapOn: "Lessons"
- takeScreenshot: 04-school
- tapOn: "Back"
- tapOn: "Exam Hall, tab.*"
- assertVisible: "Start a full mock"
- takeScreenshot: 05-exam
- scrollUntilVisible:
    element: "Check my level again.*"
    direction: DOWN
- takeScreenshot: 05b-exam-placement
- tapOn: "Progress, tab.*"
- takeScreenshot: 06-passport
- tapOn: "Practice, tab.*"
- tapOn: "Sounds"
- assertVisible: "Back"
- takeScreenshot: 07-studio
- tapOn: "Back"
- tapOn: "Progress, tab.*"
- scrollUntilVisible:
    element: "My goal and exam date"
    direction: DOWN
    centerElement: true  # clear of the tab bar
- tapOn: "My goal and exam date"
- assertVisible: "Back"
- takeScreenshot: 08-goal
- tapOn: "Back"
- tapOn: "Settings"
- takeScreenshot: 09-settings
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- takeScreenshot: 10-settings-bottom
- tapOn: "Back"
- tapOn: "Today, tab.*"
- scrollUntilVisible:
    element: "Today's path|TODAY'S PATH"
    direction: UP
