# A day, end to end (paid): Start opens a day planned ahead at once, the NPC speaks, Leave moves to the next scene.
appId: app.lingard
---
- runFlow: sign-in.yaml
- scrollUntilVisible:
    element: "(Begin day .*|Continue day .*|Continue your story)"
    direction: UP
- tapOn: "(Begin day .*|Continue day .*|Continue your story)"
- extendedWaitUntil:          # planned ahead: the scene opens straight away
    visible: "Your goal"
    timeout: 5000
- takeScreenshot: 21-scene-1
- copyTextFrom:
    text: "with .*"
- tapOn: "Start talking"
- extendedWaitUntil:
    visible:
      id: "caption-npc"
    timeout: 30000
- takeScreenshot: 22-scene-1-npc
- tapOn: "Leave"
- extendedWaitUntil:          # the next scene of the same day
    visible: "Put your headphones on.*"
    timeout: 60000
- assertNotVisible: ${maestro.copiedText}
- takeScreenshot: 23-scene-2
- tapOn: "Back"
- assertVisible: "Today's path|TODAY'S PATH"
