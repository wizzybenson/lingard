# The School: key points for the learner's level, one opened and played. No paid calls (no dictation audio).
appId: app.lingard
---
- runFlow: sign-in.yaml
- tapOn: "School, tab.*"
- extendedWaitUntil:
    visible: "Rules · .*|Règles · .*"
    timeout: 10000
- takeScreenshot: school-01-path
- scrollUntilVisible:
    element: "Basics to refresh|Coming up next"
    direction: DOWN
- takeScreenshot: school-02-more
- scrollUntilVisible:
    element: "Start lesson"
    direction: UP
- tapOn: "Start lesson"
- extendedWaitUntil:
    visible: "The rule"
    timeout: 10000
- takeScreenshot: school-03-lesson
- scrollUntilVisible:
    element: "Spot the error"
    direction: DOWN
- takeScreenshot: school-04-games
- tapOn: "Back"
- scrollUntilVisible:
    element: "Words · .*"
    direction: DOWN
- tapOn:
    below: "Words · .*"
    text: ".+"
- extendedWaitUntil:
    visible: "In short"
    timeout: 10000
- scrollUntilVisible:
    element: "Fill the gap"
    direction: DOWN
- takeScreenshot: school-05-words-fill-the-gap
