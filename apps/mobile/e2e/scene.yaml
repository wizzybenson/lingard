# Live scene, end to end (paid: planning, NPC model, TTS, STT). Starts today's story, joins, waits for the NPC to speak.
appId: app.lingard
---
- runFlow: sign-in.yaml
- scrollUntilVisible:
    element: "(Begin day .*|Continue your story)"
    direction: UP
- tapOn: "(Begin day .*|Continue your story)"
- extendedWaitUntil:
    visible: "Your goal"
    timeout: 180000
- takeScreenshot: 11-scene
- tapOn: "Start talking"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "Leave"
    timeout: 30000
- takeScreenshot: 12-scene-live
- extendedWaitUntil:
    visible:
      id: "caption-npc"
    timeout: 30000
- takeScreenshot: 13-npc-spoke
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 14-scene-after
