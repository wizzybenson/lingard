# The School in English: IELTS key points, a grammar lesson with its irregular-verb duel, and a word set. No paid calls.
appId: app.lingard
---
- runFlow: sign-in.yaml
- scrollUntilVisible:  # English in focus: the city pill on Today switches it (clear of the dev build's menu button)
    element: "Switch to (Ashford|Rivemont)"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible: "Switch to Ashford"
    commands:
      - tapOn: "Switch to Ashford"
- tapOn: "Practice, tab.*"
- tapOn: "Lessons"
- extendedWaitUntil:
    visible: "Rules · .*"
    timeout: 10000
- takeScreenshot: school-en-01-path
- scrollUntilVisible:
    element: "Start lesson"
    direction: DOWN
- tapOn: "Start lesson"
- extendedWaitUntil:
    visible: "The rule"
    timeout: 10000
- takeScreenshot: school-en-02-lesson
- tapOn: "Back"
- scrollUntilVisible:
    element: "Words · .*"
    direction: DOWN
- tapOn: "Words · .*"  # each kind is folded to one line until opened
- tapOn:
    below: "Words · .*"
    text: ".+"
- extendedWaitUntil:
    visible: "In short"
    timeout: 10000
- runFlow:  # practice opens once the learner is ready
    when:
      visible: "I'm ready: .*"
    commands:
      - tapOn: "I'm ready: .*"
- scrollUntilVisible:
    element: "Fill the gap"
    direction: DOWN
- takeScreenshot: school-en-03-words
